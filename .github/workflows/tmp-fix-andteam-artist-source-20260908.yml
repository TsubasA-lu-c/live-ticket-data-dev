name: 'Temporary &TEAM source normalization'

on:
  push:
    branches:
      - 'chatgpt/andteam-mark-on-you-20260908'
    paths:
      - '.github/workflows/tmp-fix-andteam-artist-source-20260908.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore artist-level official seed URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          artists_path = Path('data/artists.json')
          manifest_path = Path('data/manifest.json')

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))
          def dump(path, value):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          def sha16(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()[:16]

          artists = load(artists_path)
          matches = [a for a in artists if a.get('id') == 'and_team']
          assert len(matches) == 1
          assert matches[0].get('sourceUrl') == 'https://www.andteam-official.jp/news/021ab1de6a61'
          matches[0]['sourceUrl'] = 'https://www.andteam-official.jp/'
          assert matches[0].get('lastVerifiedAt') == '2026-09-08T21:15:03+09:00'
          dump(artists_path, artists)

          manifest = load(manifest_path)
          assert manifest.get('version') == 196
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = sha16(artists_path)
          dump(manifest_path, manifest)
          assert load(manifest_path)['files']['artists']['hash'] == sha16(artists_path)
          print('restored &TEAM artist-level official homepage seed; manifest hash verified')
          PY

          git diff --check
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          unexpected="$(printf '%s\n' "$status" | awk '{print $2}' | grep -v -E '^(data/artists.json|data/manifest.json)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changes: $unexpected" >&2; exit 1; }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artists.json data/manifest.json
          git commit -m 'fix: preserve &TEAM official homepage collection seed'
          git push origin HEAD:${GITHUB_REF_NAME}
