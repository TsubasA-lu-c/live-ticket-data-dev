name: Apply weekly approved existing-event updates 20260912

on:
  push:
    branches:
      - audit/rescue-missing-performances-20260912
    paths:
      - '.github/workflows/apply-approved-existing-20260912.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rescue-missing-performances-20260912
          fetch-depth: 0
      - name: Apply approved existing-event changes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          JST = timezone(timedelta(hours=9))
          NOW = '2026-09-12T00:00:00+09:00'
          root = Path('data/artist')

          def load(aid):
              p=root/f'{aid}.json'; return p, json.loads(p.read_text())
          def save(p,d): p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          def tours(d): return d.get('tours') or []
          def perfs(d): return d.get('performances') or []
          def lots(d): return d.setdefault('lotteries',[])
          def tour_for(d, token):
              token=token.lower()
              ms=[t for t in tours(d) if token in (t.get('title') or '').lower()]
              if not ms: raise SystemExit(f'tour not found token={token} artist={d.get("artistId")}')
              return ms[0]
          def perf_dates(d, dates, tour_id=None):
              out=[]
              for date in dates:
                  ms=[p for p in perfs(d) if (p.get('performanceAt') or '').startswith(date) and (tour_id is None or p.get('tourId')==tour_id)]
                  if not ms: raise SystemExit(f'performance not found artist={d.get("artistId")} date={date} tour={tour_id}')
                  out += ms
              seen=set(); uniq=[]
              for p in out:
                  if p['id'] not in seen: seen.add(p['id']); uniq.append(p)
              return uniq
          def add_lottery(d, *, lid, tour_id, typ, start, end, perf_ids, source_url, result=None, pay_start=None, pay_end=None):
              for l in lots(d):
                  if l.get('id')==lid: return False
                  if l.get('entryStartAt')==start and l.get('entryEndAt')==end and sorted(l.get('performanceIds') or [])==sorted(perf_ids): return False
              lots(d).append({
                  'id': lid, 'tourId': tour_id, 'type': typ,
                  'entryStartAt': start, 'entryEndAt': end,
                  'resultAt': result, 'paymentStartAt': pay_start, 'paymentEndAt': pay_end,
                  'performanceIds': perf_ids, 'source':'system', 'sourceUrl':source_url, 'lastVerifiedAt':NOW,
              })
              return True
          def apply_simple(aid, tour_token, dates, *, lid, typ, start, end, source, result=None, pay_start=None, pay_end=None):
              p,d=load(aid); t=tour_for(d,tour_token); ps=perf_dates(d,dates,t['id'])
              add_lottery(d,lid=lid,tour_id=t['id'],typ=typ,start=start,end=end,perf_ids=[x['id'] for x in ps],source_url=source,result=result,pay_start=pay_start,pay_end=pay_end)
              save(p,d)

          # Hinatazaka46
          apply_simple('hinatazaka46','18th', ['2026-10-06','2026-10-07'], lid='hinatazaka46_18th_live_official_presale_20260907', typ='オフィシャル先行', start='2026-09-07T12:00:00+09:00', end='2026-09-09T23:59:00+09:00', source='https://www.hinatazaka46.com/s/official/news/detail/E00911?ima=0000')

          # BUMP OF CHICKEN
          apply_simple('bump_of_chicken','ratio clavis', ['2027-01-23','2027-01-24','2027-02-06','2027-02-07'], lid='bump_ratio_clavis_dome_silver_week_20260911', typ='Silver Weekスペシャル先行', start='2026-09-11T18:00:00+09:00', end='2026-09-27T23:59:00+09:00', source='https://www.toysfactory.co.jp/artist/bumpofchicken/news/detail/7408')

          # Dream Festival common second presale
          for aid, date in [('ae_group','2026-11-21'),('novelbright','2026-11-21'),('monaki','2026-11-23')]:
              p,d=load(aid); t=tour_for(d,'dream festival'); ps=perf_dates(d,[date],t['id'])
              add_lottery(d,lid=f'{aid}_dreamfestival_2026_second_presale',tour_id=t['id'],typ='2次先行',start='2026-09-07T12:00:00+09:00',end='2026-09-13T23:59:00+09:00',perf_ids=[x['id'] for x in ps],source_url='https://dreamfestival.jp/information/')
              save(p,d)

          # FREDERIC trade
          apply_simple('frederic','umimoyasu', ['2026-10-12'], lid='frederic_umimoyasu_2026_trade', typ='公式チケットトレード', start='2026-09-10T12:00:00+09:00', end='2026-10-11T11:59:00+09:00', source='https://frederic-official.com/news/detail/3748')

          # Kroi additional standing sale
          apply_simple('kroi','jungle', ['2026-09-22','2026-09-23'], lid='kroi_jungle_tokyo_2f_standing_20260905', typ='2Fスタンディング追加先着販売', start='2026-09-05T19:30:00+09:00', end=None, source='https://kroi.net/news/detail/89244')

          # Miura Daichi two additional sales
          p,d=load('miura_daichi'); t=tour_for(d,'daichi miura'); ps=perf_dates(d,['2026-09-12','2026-09-13'],t['id']); ids=[x['id'] for x in ps]
          add_lottery(d,lid='miura_daichi_misato_production_seat_20260908',tour_id=t['id'],typ='機材席開放・制作席追加先着販売',start='2026-09-08T18:00:00+09:00',end=None,perf_ids=ids,source_url='https://daichi-miura.jp/news/detail/1097')
          add_lottery(d,lid='miura_daichi_misato_equipment_same_day_20260911',tour_id=t['id'],typ='機材席・当日引換券先着販売',start='2026-09-11T18:00:00+09:00',end=None,perf_ids=ids,source_url='https://daichi-miura.jp/news/detail/1099')
          save(p,d)

          # JO1 Dream Festival only; AAO mapping intentionally deferred
          p,d=load('jo1'); t=tour_for(d,'dream festival'); ps=perf_dates(d,['2026-11-21'],t['id'])
          add_lottery(d,lid='jo1_dreamfestival_2026_second_presale',tour_id=t['id'],typ='2次先行',start='2026-09-07T12:00:00+09:00',end='2026-09-13T23:59:00+09:00',perf_ids=[x['id'] for x in ps],source_url='https://dreamfestival.jp/information/')
          save(p,d)

          # ILLIT Lawson lottery
          apply_simple('illit','press start', ['2026-12-23','2026-12-24','2026-12-26','2026-12-27'], lid='illit_press_start_encore_lawson_20260907', typ='ローソンチケット先行', start='2026-09-07T17:00:00+09:00', end='2026-09-15T23:59:00+09:00', source='https://www.illit-official.jp/')

          # INKIGAYO general sale: NiziU, Ado, =LOVE
          for aid,date in [('niziu','2026-09-22'),('ado','2026-09-23'),('equal_love','2026-09-22')]:
              p,d=load(aid); t=tour_for(d,'inkigayo'); ps=perf_dates(d,[date],t['id'])
              add_lottery(d,lid=f'{aid}_inkigayo_general_20260910',tour_id=t['id'],typ='一般発売（先着）',start='2026-09-10T12:00:00+09:00',end=None,perf_ids=[x['id'] for x in ps],source_url='https://inkigayo-live.jp/')
              save(p,d)

          # Mr.Children Fukui final lottery
          apply_simple('mr_children','saturday in the park', ['2026-10-03','2026-10-04'], lid='mr_children_saturday_park_fukui_final_20260911', typ='福井公演 最終抽選券受付', start='2026-09-11T19:00:00+09:00', end='2026-09-27T23:59:00+09:00', result='2026-10-02T20:30:00+09:00', source='https://tour.mrchildren.jp/index.html')

          # YOASOBI Lawson pre-request
          apply_simple('yoasobi','超惑星', ['2026-10-24','2026-10-25'], lid='yoasobi_chowakusei_osaka_lawson_prerequest_20260908', typ='ローソン プレリク先行', start='2026-09-08T12:00:00+09:00', end='2026-09-15T23:59:00+09:00', result='2026-09-18T15:00:00+09:00', source='https://l-tike.com/order/?gLcode=56728&gPfKey=20251224000002109688')

          # IDOLiSH7 additional general + conditional same-day sale
          p,d=load('idolish7'); t=tour_for(d,'4ward journey'); ps=perf_dates(d,['2026-09-13'],t['id']); ids=[x['id'] for x in ps]
          add_lottery(d,lid='idolish7_4ward_fukuoka_additional_general_20260910',tour_id=t['id'],typ='追加一般発売',start='2026-09-10T18:00:00+09:00',end='2026-09-12T23:59:00+09:00',perf_ids=ids,source_url='https://idolish7.com/4j/news/xbw60gvl4lcu/')
          add_lottery(d,lid='idolish7_4ward_fukuoka_same_day_conditional_20260913',tour_id=t['id'],typ='当日券（残席がある場合）',start='2026-09-13T00:00:00+09:00',end=None,perf_ids=ids,source_url='https://idolish7.com/4j/news/xbw60gvl4lcu/')
          save(p,d)

          # XG THE CORE FINAL presale
          apply_simple('xg','the core final', ['2027-02-10','2027-02-11','2027-02-27','2027-02-28'], lid='xg_the_core_final_presale_20260907', typ='チケット先行抽選', start='2026-09-07T15:00:00+09:00', end='2026-09-14T23:59:00+09:00', result='2026-09-19T15:00:00+09:00', pay_start='2026-09-19T15:00:00+09:00', pay_end='2026-09-24T23:59:00+09:00', source='https://www.xgalx.com/xg/news/detail.php?id=1135785')

          # HANA resale windows
          p,d=load('hana'); t=tour_for(d,'born to bloom')
          for date,start,end,suf in [
              ('2026-09-16','2026-09-11T21:00:00+09:00','2026-09-16T18:30:00+09:00','osaka_0916'),
              ('2026-09-17','2026-09-12T21:00:00+09:00','2026-09-17T18:30:00+09:00','osaka_0917'),
              ('2026-10-29','2026-10-24T21:00:00+09:00','2026-10-29T18:30:00+09:00','budokan_1029'),
              ('2026-10-30','2026-10-25T21:00:00+09:00','2026-10-30T18:30:00+09:00','budokan_1030'),
              ('2026-10-31','2026-10-26T21:00:00+09:00','2026-10-31T17:00:00+09:00','budokan_1031')]:
              ps=perf_dates(d,[date],t['id']); add_lottery(d,lid=f'hana_born_to_bloom_resale_{suf}',tour_id=t['id'],typ='公式リセール購入',start=start,end=end,perf_ids=[x['id'] for x in ps],source_url='https://hana.b-rave.tokyo/live/hana1sttour2026-borntobloom-resale-2/')
          save(p,d)

          # CANDY TUNE resale windows
          p,d=load('candy_tune'); t=tour_for(d,'candy circus')
          for date,start,end,suf in [
              ('2026-09-19','2026-09-17T10:00:00+09:00','2026-09-18T23:59:00+09:00','matsudo_0919'),
              ('2026-12-08','2026-12-06T10:00:00+09:00','2026-12-07T23:59:00+09:00','tokyo_1208'),
              ('2026-12-09','2026-12-07T10:00:00+09:00','2026-12-08T23:59:00+09:00','tokyo_1209')]:
              ps=perf_dates(d,[date],t['id']); add_lottery(d,lid=f'candy_tune_candy_circus_resale_{suf}',tour_id=t['id'],typ='公式リセール',start=start,end=end,perf_ids=[x['id'] for x in ps],source_url=(t.get('sourceUrl') or 'https://candytune.asobisystem.com/'))
          save(p,d)

          # 04 Limited Sazabys canonical tour title/source
          p,d=load('04_limited_sazabys'); t=tour_for(d,'view')
          t['title']='04 Limited Sazabys VIEW tour 2026'; t['sourceUrl']='https://www.04limitedsazabys.com/feature/view'; t['lastVerifiedAt']=NOW; save(p,d)

          # 10-FEET F.A.D ticket windows on rescued performance
          p,d=load('10_feet'); t=tour_for(d,'261014'); ps=perf_dates(d,['2026-10-14'],t['id']); ids=[x['id'] for x in ps]
          add_lottery(d,lid='10_feet_fad30_261014_eplus_preorder',tour_id=t['id'],typ='e+プレオーダー',start='2026-08-17T18:00:00+09:00',end='2026-08-23T23:59:00+09:00',perf_ids=ids,source_url='https://eplus.jp/sf/detail/4581460001-P0030001P021001?P6=001')
          add_lottery(d,lid='10_feet_fad30_261014_general',tour_id=t['id'],typ='一般発売（先着）',start='2026-09-05T10:00:00+09:00',end='2026-10-13T18:00:00+09:00',perf_ids=ids,source_url='https://eplus.jp/sf/detail/4581460001-P0030001P021001?P6=001')
          save(p,d)
          PY

      - name: Materialize relations
        run: python3 tools/materialize_artist_live_relations.py
      - name: Update manifest
        run: python3 tools/update_manifest.py
      - name: Validate
        run: python3 tools/validate.py
      - name: Show diff
        run: git status --short && git diff --stat
      - name: Commit approved batch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artist/04_limited_sazabys.json data/artist/10_feet.json data/artist/ado.json data/artist/ae_group.json data/artist/bump_of_chicken.json data/artist/candy_tune.json data/artist/equal_love.json data/artist/frederic.json data/artist/hana.json data/artist/hinatazaka46.json data/artist/idolish7.json data/artist/illit.json data/artist/jo1.json data/artist/kroi.json data/artist/miura_daichi.json data/artist/monaki.json data/artist/mr_children.json data/artist/niziu.json data/artist/novelbright.json data/artist/xg.json data/artist/yoasobi.json data/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'update: apply weekly approved ticket updates batch 1'
          git push origin HEAD:audit/rescue-missing-performances-20260912
