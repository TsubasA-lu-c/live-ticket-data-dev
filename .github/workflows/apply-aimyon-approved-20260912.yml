name: Apply approved Aimyon 2027 updates
on:
  push:
    branches: [audit/rescue-missing-performances-20260912]
    paths: ['.github/workflows/apply-aimyon-approved-20260912.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/rescue-missing-performances-20260912, fetch-depth: 0}
      - name: Apply exact times and ticket windows
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          p=Path('data/artist/aimyon.json'); d=json.loads(p.read_text())
          tour=next(x for x in d['tours'] if x['id']=='aimyon_tour_2027')
          tour['title']='AIMYON TOUR 2027 -cosmic%-'
          tour['prices']=[{'label':'指定席','amount':10000,'currency':'JPY'}]
          tour['sourceUrl']='https://www.aimyong.net/feature/tour2027'; tour['lastVerifiedAt']='2026-09-12T00:00:00+09:00'
          times={
          '0206':('17:00','18:00'),'0207':('16:00','17:00'),'0213':('17:00','18:00'),'0214':('16:00','17:00'),'0220':('17:00','18:00'),'0221':('16:00','17:00'),
          '0313':('16:30','18:00'),'0314':('15:30','17:00'),'0320':('17:00','18:00'),'0321':('16:00','17:00'),'0331':('17:30','18:30'),'0401':('17:30','18:30'),
          '0417':('17:00','18:00'),'0418':('16:00','17:00'),'0421':('17:30','18:30'),'0422':('17:30','18:30'),'0428':('17:00','18:00'),'0429':('16:00','17:00'),
          '0502':('16:30','18:00'),'0503':('15:30','17:00'),'0512':('17:30','18:30'),'0513':('17:30','18:30'),'0529':('17:00','18:00'),'0530':('16:00','17:00'),
          '0605':('17:00','18:00'),'0606':('16:00','17:00'),'0612':('17:00','18:00'),'0613':('16:00','17:00'),'0622':('17:30','18:30'),'0623':('17:30','18:30'),
          '0626':('17:00','18:00'),'0627':('16:00','17:00'),'0703':('17:00','18:00'),'0704':('16:00','17:00'),'0710':('17:00','18:00'),'0711':('16:00','17:00')}
          perfs=[x for x in d['performances'] if x.get('tourId')=='aimyon_tour_2027']
          if len(perfs)!=36: raise SystemExit(f'expected 36 performances, got {len(perfs)}')
          for x in perfs:
            key=x['id'][-4:]
            if key not in times: raise SystemExit('unmapped '+x['id'])
            date=x['performanceAt'][:10]; op,st=times[key]
            x['doorOpenAt']=f'{date}T{op}:00+09:00'; x['performanceAt']=f'{date}T{st}:00+09:00'
            x['performanceTimeEstimated']=False; x.pop('performanceDate',None)
            x['sourceUrl']='https://www.aimyong.net/feature/tour2027'; x['lastVerifiedAt']='2026-09-12T00:00:00+09:00'
          front=[x['id'] for x in perfs if x['performanceAt'][:10] <= '2027-04-29']
          back=[x['id'] for x in perfs if x['performanceAt'][:10] >= '2027-05-02']
          lots=[
            ('aimyon_tour_2027_aim_front','AIM会員優先予約（前半公演）','2026-10-03T12:00:00+09:00','2026-10-19T23:59:00+09:00',front),
            ('aimyon_tour_2027_cd_front','BEST ALBUM CD封入先行予約（前半公演）','2026-10-21T12:00:00+09:00','2026-11-02T23:59:00+09:00',front),
            ('aimyon_tour_2027_aim_back','AIM会員優先予約（後半公演）','2027-01-08T12:00:00+09:00','2027-01-18T23:59:00+09:00',back),
            ('aimyon_tour_2027_cd_back','BEST ALBUM CD封入先行予約（後半公演）','2027-01-21T12:00:00+09:00','2027-01-29T23:59:00+09:00',back)]
          existing={x['id'] for x in d.get('lotteries',[])}
          for lid,typ,s,e,pids in lots:
            if lid in existing: raise SystemExit('duplicate '+lid)
            d.setdefault('lotteries',[]).append({'id':lid,'tourId':'aimyon_tour_2027','type':typ,'entryStartAt':s,'entryEndAt':e,'resultAt':None,'paymentDeadline':None,'performanceIds':pids,'source':'system','sourceUrl':'https://www.aimyong.net/feature/tour2027','lastVerifiedAt':'2026-09-12T00:00:00+09:00'})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          mp=Path('data/manifest.json'); m=json.loads(mp.read_text()); h=lambda q:hashlib.sha256(q.read_bytes()).hexdigest()[:16]
          m['version']=int(m.get('version',0))+1; m['updatedAt']=datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          m['artists']['aimyon']['hash']=h(p); m['files']['artists']['hash']=h(Path('data/artists.json'))
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artist/aimyon.json data/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: apply Aimyon TOUR 2027 approved updates'
          git push origin HEAD:audit/rescue-missing-performances-20260912
