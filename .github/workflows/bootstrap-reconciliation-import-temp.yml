name: Bootstrap reconciliation normalize temp

on:
  push:
    branches:
      - apply/bootstrap-reconciliation-20260823
    paths:
      - '.github/bootstrap-reconciliation-final.ready'

permissions:
  contents: write

concurrency:
  group: bootstrap-reconciliation-normalize-20260823
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify audited base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          expected='18df9af321c33080a0559d6d3d6042bcda2153cd'
          actual="$(git rev-parse origin/main)"
          test "$actual" = "$expected" || { echo "main moved: expected=$expected actual=$actual" >&2; exit 1; }
          test -z "$(git diff --name-only origin/main...HEAD -- data/)" || {
            echo 'Refusing normalize: data already differs from audited main.' >&2
            git diff --name-status origin/main...HEAD -- data/
            exit 1
          }

      - name: Decode, combine, normalize, and audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import bz2
          import copy
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          ROOT = Path('.')
          SOURCE_MAIN = '18df9af321c33080a0559d6d3d6042bcda2153cd'
          expected_artists = {
            'ellegarden','ado',
            'hinatazaka46','aimyon','creepy_nuts','vaundy','fujii_kaze',
            'lisa','snow_man','ryokuoushoku_shakai',
            'naniwa_danshi','hey_say_jump','travis_japan','twice','seventeen','sky_hi','tennimu','touken_ranbu_musical','zutomayo','momoiro_clover_z',
            'babymetal','mrs_green_apple','be_first','glay','yuzu',
            'king_and_prince','milk','bump_of_chicken','bz','ae_group','frederic','fruits_zipper',
            'cutie_street','monaki','equal_love','super_beaver','wanima','yabai_tshirts_yasan','10_feet','the_oral_cigarettes','kroi',
            'hitsuji_bungaku','miura_daichi','kurayamisaka','starglow','ini','jo1','imp','mazzel','not_equal_me',
            'boku_aozora','da_ice','bts','stray_kids','ive','aespa','tomorrow_x_together','shinee',
            'sandaime_j_soul_brothers','idolish7','a3','ikimonogakari','and_team','aina_the_end',
            'urashimasakatasen'
          }
          if len(expected_artists) != 65:
              raise SystemExit(f'expected artist set size error: {len(expected_artists)}')

          kind_to_collection = {'tour':'tours','performance':'performances','lottery':'lotteries'}
          collection_to_kind = {v:k for k,v in kind_to_collection.items()}
          expected_delete_ids = {
              'a3_act3_aw2027_tokyo_0101',
              'a3_act3_aw2027_shizuoka_0101',
              'a3_act3_aw2027_kagawa_0101',
              'a3_act3_aw2027_aichi_0101',
              'a3_act3_aw2027_yamaguchi_0101',
              'a3_act3_aw2027_osaka_0101',
          }
          expected_delete_keys = {
              ('data/artist/a3.json','performances',x) for x in expected_delete_ids
          }

          worker_parts = [ROOT / f'.github/bootstrap-reconciliation-chunks/part-{i:02d}' for i in range(6)]
          if any(not p.is_file() for p in worker_parts):
              raise SystemExit('missing worker patch chunks')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in worker_parts)
          worker_payload = json.loads(bz2.decompress(base64.b64decode(encoded)))
          worker_ops = worker_payload.get('operations') or []
          if len(worker_ops) != 970:
              raise SystemExit(f'worker operation count mismatch: {len(worker_ops)}')
          if len({op.get('artistId') for op in worker_ops}) != 55:
              raise SystemExit('worker artist count mismatch')
          worker_deletes = {
              (op.get('artistId'), op.get('kind'), op.get('id'))
              for op in worker_ops if op.get('op') == 'delete'
          }
          expected_worker_deletes = {('a3','performance',x) for x in expected_delete_ids}
          if worker_deletes != expected_worker_deletes:
              raise SystemExit(f'worker delete gate failed: {sorted(worker_deletes)}')

          source_payloads = []
          source_counts = {}
          for rel in [
              '.github/bootstrap-reconciliation-patches/reconcile-01.json',
              '.github/bootstrap-reconciliation-patches/reconcile-02.json',
              '.github/bootstrap-reconciliation-patches/reconcile-03.json',
          ]:
              payload = json.loads((ROOT / rel).read_text(encoding='utf-8'))
              ops = payload.get('operations') or []
              source_payloads.extend(ops)
              source_counts[Path(rel).name] = len(ops)
          source_payloads.extend(worker_ops)
          source_counts['worker-04-11'] = len(worker_ops)

          normalized = []
          touched = set()
          artists = set()
          action_counts = Counter()
          by_file = defaultdict(list)
          for n, op in enumerate(source_payloads, 1):
              action = op.get('op') or op.get('action')
              artist = op.get('artistId')
              kind = op.get('kind')
              object_id = op.get('id')
              if not all(isinstance(v, str) and v for v in (action, artist, kind, object_id)):
                  raise SystemExit(f'operation #{n}: invalid identity: {op}')
              if action not in {'upsert','merge','delete'} or kind not in kind_to_collection:
                  raise SystemExit(f'operation #{n}: unsupported operation: {op}')
              file = f'data/artist/{artist}.json'
              collection = kind_to_collection[kind]
              key = (file, collection, object_id)
              if key in touched:
                  raise SystemExit(f'cross-worker duplicate target: {key}')
              touched.add(key)
              artists.add(artist)
              out = {
                  'action': action,
                  'file': file,
                  'collection': collection,
                  'id': object_id,
              }
              if action == 'upsert':
                  if op.get('expectAbsent') is not True:
                      raise SystemExit(f'upsert without expectAbsent=true: {key}')
                  value = op.get('value')
                  if not isinstance(value, dict) or value.get('id') != object_id:
                      raise SystemExit(f'invalid upsert value: {key}')
                  out['expectAbsent'] = True
                  out['value'] = value
              elif action == 'merge':
                  changes = op.get('changes')
                  if not isinstance(changes, dict) or not changes:
                      raise SystemExit(f'merge without changes: {key}')
                  out['changes'] = changes
              else:
                  reason = op.get('reason')
                  if not isinstance(reason, str) or not reason.strip():
                      raise SystemExit(f'delete without reason: {key}')
                  out['reason'] = reason
              normalized.append(out)
              by_file[file].append(out)
              action_counts[action] += 1

          if artists != expected_artists:
              raise SystemExit(f'artist scope mismatch missing={sorted(expected_artists-artists)} extra={sorted(artists-expected_artists)}')
          delete_keys = {
              (op['file'], op['collection'], op['id']) for op in normalized if op['action'] == 'delete'
          }
          if delete_keys != expected_delete_keys:
              raise SystemExit(f'combined delete allow-list failed: {sorted(delete_keys)}')
          if action_counts['delete'] != 6:
              raise SystemExit(f'delete count mismatch: {action_counts["delete"]}')

          # Apply in-memory against the audited main-derived data and enforce preservation/orphans.
          for file, ops in sorted(by_file.items()):
              path = ROOT / file
              if not path.is_file():
                  raise SystemExit(f'missing artist data file: {file}')
              data = json.loads(path.read_text(encoding='utf-8'))
              before = {}
              for collection in ('tours','performances','lotteries'):
                  rows = data.get(collection)
                  if not isinstance(rows, list):
                      raise SystemExit(f'{file}:{collection} must be list')
                  ids = [row.get('id') for row in rows if isinstance(row, dict)]
                  if len(ids) != len(set(ids)):
                      raise SystemExit(f'duplicate existing ids: {file}:{collection}')
                  before[collection] = set(ids)

              for op in ops:
                  rows = data[op['collection']]
                  matches = [i for i,row in enumerate(rows) if isinstance(row,dict) and row.get('id') == op['id']]
                  if op['action'] == 'upsert':
                      if matches:
                          raise SystemExit(f'upsert target exists in main: {(file,op["collection"],op["id"])}')
                      rows.append(copy.deepcopy(op['value']))
                  elif op['action'] == 'merge':
                      if len(matches) != 1:
                          raise SystemExit(f'merge target count != 1 in main: {(file,op["collection"],op["id"])} count={len(matches)}')
                      row = dict(rows[matches[0]])
                      row.update(op['changes'])
                      rows[matches[0]] = row
                  else:
                      if len(matches) != 1:
                          raise SystemExit(f'delete target count != 1 in main: {(file,op["collection"],op["id"])} count={len(matches)}')
                      del rows[matches[0]]

              after = {}
              for collection in ('tours','performances','lotteries'):
                  ids = [row.get('id') for row in data[collection] if isinstance(row,dict)]
                  if len(ids) != len(set(ids)):
                      raise SystemExit(f'duplicate resulting ids: {file}:{collection}')
                  after[collection] = set(ids)
                  removed = before[collection] - after[collection]
                  allowed = {oid for f,c,oid in expected_delete_keys if f == file and c == collection}
                  if removed != allowed:
                      raise SystemExit(f'unexpected existing ID removal: {file}:{collection} removed={sorted(removed)} allowed={sorted(allowed)}')

              tour_ids = {row.get('id') for row in data['tours'] if isinstance(row,dict)}
              perf_ids = {row.get('id') for row in data['performances'] if isinstance(row,dict)}
              for row in data['performances']:
                  if not isinstance(row, dict):
                      raise SystemExit(f'non-object performance: {file}')
                  if row.get('tourId') not in tour_ids:
                      raise SystemExit(f'orphan performance: {file}:{row.get("id")} -> {row.get("tourId")}')
              for row in data['lotteries']:
                  if not isinstance(row, dict):
                      raise SystemExit(f'non-object lottery: {file}')
                  if row.get('tourId') not in tour_ids:
                      raise SystemExit(f'orphan lottery tour: {file}:{row.get("id")}')
                  pids = row.get('performanceIds')
                  if pids is not None:
                      if not isinstance(pids, list) or any(pid not in perf_ids for pid in pids):
                          raise SystemExit(f'orphan lottery performanceIds: {file}:{row.get("id")}')

          # A3 must retain the 2027 tour object while nulling unsupported tour dates.
          a3_tour_null_merges = [
              op for op in normalized
              if op['file'] == 'data/artist/a3.json'
              and op['collection'] == 'tours'
              and op['action'] == 'merge'
              and op.get('changes', {}).get('startDate', 'missing') is None
              and op.get('changes', {}).get('endDate', 'missing') is None
          ]
          if not a3_tour_null_merges:
              raise SystemExit('A3 unsupported tour date null-merge is missing')

          final_patch = {
              'schemaVersion': 1,
              'kind': 'bootstrap_reconciliation_apply_agent_patch',
              'sourceMainCommit': SOURCE_MAIN,
              'operations': normalized,
          }
          out_path = ROOT / '.github/bootstrap-reconciliation-patches/bootstrap-final-normalized.json'
          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text(json.dumps(final_patch, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          summary = {
              'sourceMainCommit': SOURCE_MAIN,
              'artistCount': len(artists),
              'operationCount': len(normalized),
              'actionCounts': dict(sorted(action_counts.items())),
              'sourceOperationCounts': source_counts,
              'deleteIds': sorted(expected_delete_ids),
              'targetFiles': sorted(by_file),
          }
          summary_path = ROOT / '.github/bootstrap-reconciliation-summary.json'
          summary_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
          git diff --check -- .github/bootstrap-reconciliation-patches/bootstrap-final-normalized.json .github/bootstrap-reconciliation-summary.json
          test -z "$(git diff --name-only -- data/)" || { echo 'Refusing data change during normalization.' >&2; exit 1; }

      - name: Commit normalized control files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/bootstrap-reconciliation-patches/bootstrap-final-normalized.json .github/bootstrap-reconciliation-summary.json
          test -z "$(git diff --cached --name-only | grep '^data/' || true)" || exit 1
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize audited bootstrap reconciliation patch'
          git pull --rebase origin apply/bootstrap-reconciliation-20260823
          git push origin HEAD:apply/bootstrap-reconciliation-20260823
