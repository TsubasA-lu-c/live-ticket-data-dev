name: One-shot Oishi relation rematerialization

on:
  push:
    branches:
      - fix/oishi-relation-materialization-20260910
    paths:
      - '.github/workflows/rematerialize-oishi-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oishi-relation-materialization-20260910
          fetch-depth: 0

      - name: Verify clean start
        run: test -z "$(git status --short)"

      - name: Materialize approved relations and update manifest
        run: python3 tools/materialize_artist_live_relations_once.py

      - name: Verify materialization is idempotent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('tools/materialize_artist_live_relations_once.py')
          spec = importlib.util.spec_from_file_location('relation_once', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          changed = module.materialize()
          if changed:
              raise SystemExit('materialization not idempotent: ' + ', '.join(map(str, changed)))
          print('relation materialization is idempotent')
          PY

      - name: Guard generated paths
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated diff:"
          git status --short
          unexpected=$(git status --short | grep -vE 'data/artist/(oishi_masayoshi|masayoshi_oishi)\.json|data/manifest\.json' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated paths:"
            echo "$unexpected"
            exit 1
          fi
          git diff --quiet -- data/artist/oishi_masayoshi.json && {
            echo 'Expected oishi_masayoshi.json to change, but it did not.' >&2
            exit 1
          }

      - name: Commit generated data and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artist/oishi_masayoshi.json data/artist/masayoshi_oishi.json data/manifest.json
          git rm tools/materialize_artist_live_relations_once.py .github/workflows/rematerialize-oishi-once.yml
          git commit -m "fix: rematerialize Oishi artist relation data"
          git push origin HEAD:fix/oishi-relation-materialization-20260910
