name: One-shot date-only performance fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/date-only-fix-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify base and patch audited records
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "98aee141a5a8b8192a91e84764bcfc62149d2691"
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          root = Path('.')
          data = root / 'data'
          artist_dir = data / 'artist'
          source_url = 'https://babymetal.com/mob/news/diarKiji.php?cd=TOUR_TO&lang=ja&site=TO&so=a'
          jst = timezone(timedelta(hours=9))
          verified = datetime.now(jst).strftime('%Y-%m-%dT%H:%M:%S+09:00')

          # ZUTOMAYO: official page confirms 7/25 + PYRAMID GARDEN, but no start time.
          zp = artist_dir / 'zutomayo.json'
          z = json.loads(zp.read_text())
          zmatches = [p for p in z['performances'] if p['id'] == 'zutomayo_fujirock_2026_0725']
          assert len(zmatches) == 1, len(zmatches)
          perf = zmatches[0]
          assert perf['tourId'] == 'zutomayo_fes_fujirock_2026'
          assert perf['performanceAt'] == '2026-07-25T12:00:00+09:00'
          assert perf['venue'] == '苗場スキー場 PYRAMID GARDEN'
          perf['performanceDate'] = '2026-07-25'
          perf['performanceAt'] = None
          perf['lastVerifiedAt'] = verified
          zp.write_text(json.dumps(z, ensure_ascii=False, indent=2) + '\n')

          # BABYMETAL: official TOUR gives local date + venue but no START for these shows.
          bp = artist_dir / 'babymetal.json'
          b = json.loads(bp.read_text())
          rows = [
            ('0830','2026-08-30','Petco Park, San Diego, CA, US','taiban','THE BLACK PARADE 2026 STADIUM TOUR'),
            ('0902','2026-09-02','Ball Arena, Denver, CO','oneman',None),
            ('0904','2026-09-04','Huntington Bank Pavilion at Northerly Island, Chicago, IL','oneman',None),
            ('0905','2026-09-05','Ruoff Music Center, Noblesville, IN','oneman',None),
            ('0907','2026-09-07','RBC Amphitheatre, Toronto, ON','oneman',None),
            ('0909','2026-09-09','PNC Bank Arts Center, Holmdel, NJ','oneman',None),
            ('0910','2026-09-10','Xfinity Center, Mansfield, MA','oneman',None),
            ('0912','2026-09-12','Jiffy Lube Live, Bristow, VA','oneman',None),
            ('0913','2026-09-13','Coastal Credit Union Music Park at Walnut Creek, Raleigh, NC','oneman',None),
            ('0915','2026-09-15','Truliant Amphitheater, Charlotte, NC','oneman',None),
            ('0916','2026-09-16','Ameris Bank Amphitheatre, Alpharetta, GA','oneman',None),
            ('0918','2026-09-18','Pine Knob Music Theatre, Clarkston, MI','oneman',None),
            ('0919','2026-09-19','Kentucky Expo Center, Louisville, KY','fes','Louder Than Life 2026'),
            ('0921','2026-09-21','Hollywood Casino Amphitheater, Maryland Heights, MO','oneman',None),
            ('0923','2026-09-23','Dos Equis Pavilion, Dallas, TX','oneman',None),
            ('0925','2026-09-25','The Cynthia Woods Mitchell Pavilion Sponsored by Huntsman, The Woodlands, TX','oneman',None),
            ('0926','2026-09-26','Germania Insurance Amphitheater, Del Valle, TX','oneman',None),
            ('0929','2026-09-29','First Financial Credit Union Amphitheater, Albuquerque, NM','oneman',None),
            ('1001','2026-10-01','Talking Stick Resort Amphitheatre, Phoenix, AZ','oneman',None),
            ('1003','2026-10-03','Discovery Park, Sacramento, CA, US','fes','Aftershock Festival 2026'),
            ('1128','2026-11-28','Espaco Unimed, Sao Paulo, Brazil','oneman',None),
            ('1201','2026-12-01','Movistar Arena, Buenos Aires, Argentina','oneman',None),
            ('1203','2026-12-03','Movistar Arena, Santiago, Chile','oneman',None),
            ('1207','2026-12-07','Costa 21, Lima, Peru','oneman',None),
            ('1212','2026-12-12','Fray Nano Stadium, Mexico City, Mexico','oneman',None),
          ]
          tour_ids = {t['id'] for t in b['tours']}
          existing_ids = {p['id'] for p in b['performances']}
          existing_tours = {p['tourId'] for p in b['performances']}
          for suffix, date, venue, kind, event in rows:
              tid = f'babymetal_overseas_2026_{suffix}'
              pid = f'{tid}_date_only'
              assert tid in tour_ids, tid
              assert pid not in existing_ids, pid
              assert tid not in existing_tours, f'unexpected existing performance for {tid}'
              b['performances'].append({
                  'id': pid,
                  'tourId': tid,
                  'venue': venue,
                  'performanceDate': date,
                  'performanceAt': None,
                  'doorOpenAt': None,
                  'kind': kind,
                  'eventName': event,
                  'source': 'system',
                  'sourceUrl': source_url,
                  'lastVerifiedAt': verified,
              })
          bp.write_text(json.dumps(b, ensure_ascii=False, indent=2) + '\n')

          # Structural validation of the complete feed under the new contract.
          valid_kinds = {'oneman','fes','taiban'}
          for fp in sorted(artist_dir.glob('*.json')):
              d = json.loads(fp.read_text())
              assert d['artistId'] == fp.stem
              tids = {t['id'] for t in d.get('tours', [])}
              pids = {p['id'] for p in d.get('performances', [])}
              assert len(pids) == len(d.get('performances', [])), f'duplicate performance id: {fp}'
              for p in d.get('performances', []):
                  assert p['tourId'] in tids, (fp, p['id'], p['tourId'])
                  assert 'performanceAt' in p
                  if p['performanceAt'] is None:
                      date = p.get('performanceDate')
                      assert isinstance(date, str) and len(date) == 10, (fp, p['id'], date)
                      datetime.strptime(date, '%Y-%m-%d')
                  assert p.get('kind') in valid_kinds, (fp, p['id'], p.get('kind'))
                  if p.get('kind') in {'fes','taiban'}:
                      assert p.get('eventName'), (fp, p['id'])
              for lot in d.get('lotteries', []):
                  for pid in lot.get('performanceIds') or []:
                      assert pid in pids, (fp, lot.get('id'), pid)

          # Update manifest exactly like tools/update_manifest.py.
          mp = data / 'manifest.json'
          m = json.loads(mp.read_text())
          m['version'] = m.get('version', 0) + 1
          m['updatedAt'] = verified
          def h16(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()[:16]
          m.setdefault('files', {}).setdefault('artists', {})['hash'] = h16(data / 'artists.json')
          m.setdefault('artists', {})
          files = sorted(artist_dir.glob('*.json'))
          ids = {p.stem for p in files}
          for p in files:
              m['artists'].setdefault(p.stem, {})['hash'] = h16(p)
          for aid in list(m['artists']):
              if aid not in ids:
                  del m['artists'][aid]
          mp.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n')

          # Manifest verification.
          m2 = json.loads(mp.read_text())
          assert m2['artists']['zutomayo']['hash'] == h16(zp)
          assert m2['artists']['babymetal']['hash'] == h16(bp)
          assert m2['files']['artists']['hash'] == h16(data / 'artists.json')
          assert len([p for p in b['performances'] if p['id'].endswith('_date_only')]) == 25
          print('patched: zutomayo=1, babymetal date-only=25, manifest version', m2['version'])
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' data/artist/babymetal.json data/artist/zutomayo.json data/manifest.json | sort)"
          test "$changed" = "$expected"

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/date-only-fix-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/artist/babymetal.json data/artist/zutomayo.json data/manifest.json .github/workflows/date-only-fix-temp.yml
          git commit -m "Fix date-only performances for BABYMETAL and ZUTOMAYO"
          git push origin HEAD:${{ github.head_ref }}
