name: Fix Yabai taiban eventName

on:
  push:
    branches:
      - fix/yabait-eventname-20260917

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/yabait-eventname-20260917
          fetch-depth: 0
          clean: true

      - name: Apply correction and rebuild manifest
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git log -1 --pretty=%s)" = "chore: apply scoped Yabai eventName fix" ] || exit 0
          echo 'Before:'
          git status --short
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          artist_path = Path('data/artist/yabai_tshirts_yasan.json')
          manifest_path = Path('data/manifest.json')
          data = json.loads(artist_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          perf_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_nara_0204'
          tour_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_0204'
          event_name = '老いてもヤングスキニーツアー vol.7'
          source_url = 'https://yabaitshirtsyasan.com/live/293577/'
          now = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%dT%H:%M:%S+09:00')

          matches = [p for p in data.get('performances', []) if p.get('id') == perf_id]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one performance {perf_id}, found {len(matches)}')
          perf = matches[0]
          assert perf.get('tourId') == tour_id, perf
          assert perf.get('kind') == 'taiban', perf
          assert perf.get('sourceUrl') == source_url, perf
          perf['eventName'] = event_name
          perf['lastVerifiedAt'] = now
          artist_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest['version'] = int(manifest.get('version', 0)) + 1
          manifest['updatedAt'] = now
          manifest.setdefault('artists', {}).setdefault('yabai_tshirts_yasan', {})['hash'] = hashlib.sha256(artist_path.read_bytes()).hexdigest()[:16]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate scoped delivery data
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git log -1 --pretty=%s)" = "chore: apply scoped Yabai eventName fix" ] || exit 0
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          # Parse every delivery JSON to catch syntax corruption.
          for p in Path('data').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))

          artist_path = Path('data/artist/yabai_tshirts_yasan.json')
          d = json.loads(artist_path.read_text(encoding='utf-8'))
          perf_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_nara_0204'
          tour_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_0204'
          ps = [x for x in d['performances'] if x.get('id') == perf_id]
          assert len(ps) == 1
          p = ps[0]
          assert p.get('tourId') == tour_id
          assert p.get('kind') == 'taiban'
          assert p.get('eventName') == '老いてもヤングスキニーツアー vol.7'
          assert p.get('sourceUrl') == 'https://yabaitshirtsyasan.com/live/293577/'

          tour_ids = [x.get('id') for x in d.get('tours', [])]
          perf_ids = [x.get('id') for x in d.get('performances', [])]
          lot_ids = [x.get('id') for x in d.get('lotteries', [])]
          assert len(tour_ids) == len(set(tour_ids))
          assert len(perf_ids) == len(set(perf_ids))
          assert len(lot_ids) == len(set(lot_ids))
          assert tour_id in set(tour_ids)
          assert all(x.get('tourId') in set(tour_ids) for x in d.get('performances', []))
          assert all(x.get('tourId') in set(tour_ids) for x in d.get('lotteries', []))
          assert all(pid in set(perf_ids) for x in d.get('lotteries', []) for pid in (x.get('performanceIds') or []))
          assert all(x.get('eventName') for x in d.get('performances', []) if x.get('kind') in {'taiban','fes'})

          manifest = json.loads(Path('data/manifest.json').read_text(encoding='utf-8'))
          expected = hashlib.sha256(artist_path.read_bytes()).hexdigest()[:16]
          assert manifest['artists']['yabai_tshirts_yasan']['hash'] == expected
          PY
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'data/artist/yabai_tshirts_yasan.json\ndata/manifest.json'

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git log -1 --pretty=%s)" = "chore: apply scoped Yabai eventName fix" ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artist/yabai_tshirts_yasan.json data/manifest.json
          git commit -m 'fix: set Yabai Youngskinny eventName'
          echo 'After commit:'
          git status --short
          git push origin HEAD:fix/yabait-eventname-20260917
