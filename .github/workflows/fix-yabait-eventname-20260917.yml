name: Fix Yabai taiban eventName

on:
  push:
    branches:
      - fix/yabait-eventname-20260917

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/yabait-eventname-20260917
          fetch-depth: 0
          clean: true

      - name: Apply scoped correction
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git log -1 --pretty=%s)" = "chore: retry Yabai eventName fix" ] || exit 0
          echo 'Before:'
          git status --short
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          path = Path('data/artist/yabai_tshirts_yasan.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          perf_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_nara_0204'
          expected_tour = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_0204'
          event_name = '老いてもヤングスキニーツアー vol.7'
          matches = [p for p in data.get('performances', []) if p.get('id') == perf_id]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one performance {perf_id}, found {len(matches)}')
          perf = matches[0]
          assert perf.get('tourId') == expected_tour, perf
          assert perf.get('kind') == 'taiban', perf
          assert perf.get('sourceUrl') == 'https://yabaitshirtsyasan.com/live/293577/', perf
          perf['eventName'] = event_name
          perf['lastVerifiedAt'] = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Relation check (diagnostic only)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git log -1 --pretty=%s)" = "chore: retry Yabai eventName fix" ] || exit 0
          python3 tools/materialize_artist_live_relations.py --check

      - name: Rebuild manifest
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git log -1 --pretty=%s)" = "chore: retry Yabai eventName fix" ] || exit 0
          python3 tools/update_manifest.py

      - name: Full validator
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git log -1 --pretty=%s)" = "chore: retry Yabai eventName fix" ] || exit 0
          python3 tools/validate.py

      - name: Scoped integrity and diff check
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git log -1 --pretty=%s)" = "chore: retry Yabai eventName fix" ] || exit 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('data/artist/yabai_tshirts_yasan.json').read_text(encoding='utf-8'))
          perf_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_nara_0204'
          tour_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_0204'
          ps = [x for x in d['performances'] if x.get('id') == perf_id]
          assert len(ps) == 1
          p = ps[0]
          assert p.get('tourId') == tour_id
          assert p.get('kind') == 'taiban'
          assert p.get('eventName') == '老いてもヤングスキニーツアー vol.7'
          assert sum(t.get('id') == tour_id for t in d['tours']) == 1
          assert all(len({x.get('id') for x in d[k]}) == len(d[k]) for k in ('tours','performances','lotteries'))
          for lot in d['lotteries']:
              if perf_id in (lot.get('performanceIds') or []):
                  assert lot.get('tourId') == tour_id
          PY
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'data/artist/yabai_tshirts_yasan.json\ndata/manifest.json'

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git log -1 --pretty=%s)" = "chore: retry Yabai eventName fix" ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artist/yabai_tshirts_yasan.json data/manifest.json
          git commit -m 'fix: set Yabai Youngskinny eventName'
          echo 'After commit:'
          git status --short
          git push origin HEAD:fix/yabait-eventname-20260917
