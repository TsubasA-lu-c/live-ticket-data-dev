name: Apply weekly approved existing-event updates 20260912 v2

on:
  push:
    branches:
      - audit/rescue-missing-performances-20260912
    paths:
      - '.github/workflows/apply-approved-existing-20260912-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rescue-missing-performances-20260912
          fetch-depth: 0
      - name: Apply approved existing-event changes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          NOW='2026-09-12T00:00:00+09:00'
          root=Path('data/artist')
          def load(aid):
              p=root/f'{aid}.json'; return p,json.loads(p.read_text())
          def save(p,d): p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          def tourmap(d): return {t['id']:t for t in d.get('tours',[])}
          def tour_for(d, token):
              ms=[t for t in d.get('tours',[]) if token.lower() in (t.get('title') or '').lower()]
              if len(ms)!=1: raise SystemExit(f'tour match {d.get("artistId")} token={token} count={len(ms)} titles={[t.get("title") for t in d.get("tours",[])]}')
              return ms[0]
          def perf_dates(d, dates, tour_id=None):
              out=[]
              for date in dates:
                  ms=[x for x in d.get('performances',[]) if (x.get('performanceAt') or '').startswith(date) and (tour_id is None or x.get('tourId')==tour_id)]
                  if not ms: raise SystemExit(f'performance missing {d.get("artistId")} {date} tour={tour_id}')
                  out.extend(ms)
              seen=set(); r=[]
              for x in out:
                  if x['id'] not in seen: seen.add(x['id']); r.append(x)
              return r
          def perf_dates_single_tour(d,dates):
              ps=perf_dates(d,dates)
              tids={x['tourId'] for x in ps}
              if len(tids)!=1: raise SystemExit(f'expected single tour {d.get("artistId")} {dates}, got {tids}')
              return next(iter(tids)),ps
          def add(d,lid,tid,typ,start,end,ids,url,result=None,pay_start=None,pay_end=None):
              ls=d.setdefault('lotteries',[])
              for l in ls:
                  if l.get('id')==lid: return
                  if l.get('entryStartAt')==start and l.get('entryEndAt')==end and sorted(l.get('performanceIds') or [])==sorted(ids): return
              ls.append({'id':lid,'tourId':tid,'type':typ,'entryStartAt':start,'entryEndAt':end,'resultAt':result,'paymentStartAt':pay_start,'paymentEndAt':pay_end,'performanceIds':ids,'source':'system','sourceUrl':url,'lastVerifiedAt':NOW})
          def simple(aid,token,dates,lid,typ,start,end,url,result=None,pay_start=None,pay_end=None):
              p,d=load(aid); t=tour_for(d,token); ps=perf_dates(d,dates,t['id']); add(d,lid,t['id'],typ,start,end,[x['id'] for x in ps],url,result,pay_start,pay_end); save(p,d)
          def bydate(aid,dates,lid,typ,start,end,url,result=None,pay_start=None,pay_end=None):
              p,d=load(aid); tid,ps=perf_dates_single_tour(d,dates); add(d,lid,tid,typ,start,end,[x['id'] for x in ps],url,result,pay_start,pay_end); save(p,d)

          simple('hinatazaka46','18th',['2026-10-06','2026-10-07'],'hinatazaka46_18th_live_official_presale_20260907','オフィシャル先行','2026-09-07T12:00:00+09:00','2026-09-09T23:59:00+09:00','https://www.hinatazaka46.com/s/official/news/detail/E00911?ima=0000')
          simple('bump_of_chicken','ratio clavis',['2027-01-23','2027-01-24','2027-02-06','2027-02-07'],'bump_ratio_clavis_dome_silver_week_20260911','Silver Weekスペシャル先行','2026-09-11T18:00:00+09:00','2026-09-27T23:59:00+09:00','https://www.toysfactory.co.jp/artist/bumpofchicken/news/detail/7408')
          bydate('ae_group',['2026-11-21'],'ae_group_dreamfestival_2026_second_presale','2次先行','2026-09-07T12:00:00+09:00','2026-09-13T23:59:00+09:00','https://dreamfestival.jp/information/')
          bydate('novelbright',['2026-11-21'],'novelbright_dreamfestival_2026_second_presale','2次先行','2026-09-07T12:00:00+09:00','2026-09-13T23:59:00+09:00','https://dreamfestival.jp/information/')
          bydate('monaki',['2026-11-23'],'monaki_dreamfestival_2026_second_presale','2次先行','2026-09-07T12:00:00+09:00','2026-09-13T23:59:00+09:00','https://dreamfestival.jp/information/')
          simple('frederic','umimoyasu',['2026-10-12'],'frederic_umimoyasu_2026_trade','公式チケットトレード','2026-09-10T12:00:00+09:00','2026-10-11T11:59:00+09:00','https://frederic-official.com/news/detail/3748')
          simple('kroi','jungle',['2026-09-22','2026-09-23'],'kroi_jungle_tokyo_2f_standing_20260905','2Fスタンディング追加先着販売','2026-09-05T19:30:00+09:00',None,'https://kroi.net/news/detail/89244')
          bydate('miura_daichi',['2026-09-12','2026-09-13'],'miura_daichi_misato_production_seat_20260908','制作席追加先着販売','2026-09-08T18:00:00+09:00',None,'https://daichi-miura.jp/news/detail/1097')
          bydate('miura_daichi',['2026-09-12','2026-09-13'],'miura_daichi_misato_equipment_same_day_20260911','機材席・当日引換券先着販売','2026-09-11T18:00:00+09:00',None,'https://daichi-miura.jp/news/detail/1099')
          bydate('jo1',['2026-11-21'],'jo1_dreamfestival_2026_second_presale','2次先行','2026-09-07T12:00:00+09:00','2026-09-13T23:59:00+09:00','https://dreamfestival.jp/information/')
          simple('illit','press start',['2026-12-23','2026-12-24','2026-12-26','2026-12-27'],'illit_press_start_encore_lawson_20260907','ローソンチケット先行','2026-09-07T17:00:00+09:00','2026-09-15T23:59:00+09:00','https://www.illit-official.jp/')
          simple('niziu','inkigayo',['2026-09-22'],'niziu_inkigayo_general_20260910','一般発売（先着）','2026-09-10T12:00:00+09:00',None,'https://inkigayo-live.jp/')
          simple('ado','inkigayo',['2026-09-23'],'ado_inkigayo_general_20260910','一般発売（先着）','2026-09-10T12:00:00+09:00',None,'https://inkigayo-live.jp/')
          simple('equal_love','inkigayo',['2026-09-22'],'equal_love_inkigayo_general_20260910','一般発売（先着）','2026-09-10T12:00:00+09:00',None,'https://inkigayo-live.jp/')
          simple('mr_children','saturday in the park',['2026-10-03','2026-10-04'],'mr_children_saturday_park_fukui_final_20260911','福井公演 最終抽選券受付','2026-09-11T19:00:00+09:00','2026-09-27T23:59:00+09:00','https://tour.mrchildren.jp/index.html','2026-10-02T20:30:00+09:00')
          simple('yoasobi','超惑星',['2026-10-24','2026-10-25'],'yoasobi_chowakusei_osaka_lawson_prerequest_20260908','ローソン プレリク先行','2026-09-08T12:00:00+09:00','2026-09-15T23:59:00+09:00','https://l-tike.com/order/?gLcode=56728&gPfKey=20251224000002109688','2026-09-18T15:00:00+09:00')
          bydate('idolish7',['2026-09-13'],'idolish7_4ward_fukuoka_additional_general_20260910','追加一般発売','2026-09-10T18:00:00+09:00','2026-09-12T23:59:00+09:00','https://idolish7.com/4j/news/xbw60gvl4lcu/')
          bydate('idolish7',['2026-09-13'],'idolish7_4ward_fukuoka_same_day_conditional_20260913','当日券（残席がある場合）','2026-09-13T00:00:00+09:00',None,'https://idolish7.com/4j/news/xbw60gvl4lcu/')
          simple('xg','the core final',['2027-02-10','2027-02-11','2027-02-27','2027-02-28'],'xg_the_core_final_presale_20260907','チケット先行抽選','2026-09-07T15:00:00+09:00','2026-09-14T23:59:00+09:00','https://www.xgalx.com/xg/news/detail.php?id=1135785','2026-09-19T15:00:00+09:00','2026-09-19T15:00:00+09:00','2026-09-24T23:59:00+09:00')

          p,d=load('hana'); t=tour_for(d,'born to bloom')
          for date,start,end,suf in [('2026-09-16','2026-09-11T21:00:00+09:00','2026-09-16T18:30:00+09:00','osaka_0916'),('2026-09-17','2026-09-12T21:00:00+09:00','2026-09-17T18:30:00+09:00','osaka_0917'),('2026-10-29','2026-10-24T21:00:00+09:00','2026-10-29T18:30:00+09:00','budokan_1029'),('2026-10-30','2026-10-25T21:00:00+09:00','2026-10-30T18:30:00+09:00','budokan_1030'),('2026-10-31','2026-10-26T21:00:00+09:00','2026-10-31T17:00:00+09:00','budokan_1031')]:
              ps=perf_dates(d,[date],t['id']); add(d,f'hana_born_to_bloom_resale_{suf}',t['id'],'公式リセール購入',start,end,[x['id'] for x in ps],'https://hana.b-rave.tokyo/live/hana1sttour2026-borntobloom-resale-2/')
          save(p,d)

          p,d=load('candy_tune'); t=tour_for(d,'candy circus')
          for date,start,end,suf in [('2026-09-19','2026-09-17T10:00:00+09:00','2026-09-18T23:59:00+09:00','matsudo_0919'),('2026-12-08','2026-12-06T10:00:00+09:00','2026-12-07T23:59:00+09:00','tokyo_1208'),('2026-12-09','2026-12-07T10:00:00+09:00','2026-12-08T23:59:00+09:00','tokyo_1209')]:
              ps=perf_dates(d,[date],t['id']); add(d,f'candy_tune_candy_circus_resale_{suf}',t['id'],'公式リセール',start,end,[x['id'] for x in ps],t.get('sourceUrl') or 'https://candytune.asobisystem.com/')
          save(p,d)

          p,d=load('04_limited_sazabys'); t=tour_for(d,'view'); t['title']='04 Limited Sazabys VIEW tour 2026'; t['sourceUrl']='https://www.04limitedsazabys.com/feature/view'; t['lastVerifiedAt']=NOW; save(p,d)

          p,d=load('10_feet'); t=tour_for(d,'261014'); ps=perf_dates(d,['2026-10-14'],t['id']); ids=[x['id'] for x in ps]
          add(d,'10_feet_fad30_261014_eplus_preorder',t['id'],'e+プレオーダー','2026-08-17T18:00:00+09:00','2026-08-23T23:59:00+09:00',ids,'https://eplus.jp/sf/detail/4581460001-P0030001P021001?P6=001')
          add(d,'10_feet_fad30_261014_general',t['id'],'一般発売（先着）','2026-09-05T10:00:00+09:00','2026-10-13T18:00:00+09:00',ids,'https://eplus.jp/sf/detail/4581460001-P0030001P021001?P6=001')
          save(p,d)
          PY
      - name: Materialize relations
        run: python3 tools/materialize_artist_live_relations.py
      - name: Update manifest
        run: python3 tools/update_manifest.py
      - name: Validate
        run: python3 tools/validate.py
      - name: Commit approved batch
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artist/04_limited_sazabys.json data/artist/10_feet.json data/artist/ado.json data/artist/ae_group.json data/artist/bump_of_chicken.json data/artist/candy_tune.json data/artist/equal_love.json data/artist/frederic.json data/artist/hana.json data/artist/hinatazaka46.json data/artist/idolish7.json data/artist/illit.json data/artist/jo1.json data/artist/kroi.json data/artist/miura_daichi.json data/artist/monaki.json data/artist/mr_children.json data/artist/niziu.json data/artist/novelbright.json data/artist/xg.json data/artist/yoasobi.json data/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'update: apply weekly approved ticket updates batch 1'
          git push origin HEAD:audit/rescue-missing-performances-20260912
