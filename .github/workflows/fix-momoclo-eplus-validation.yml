name: Fix momoclo eplus validation

on:
  push:
    branches:
      - fix/dev-validation-momoclo-eplus-20260829
    paths:
      - '.github/workflows/fix-momoclo-eplus-validation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified fix
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fix.b64 <<'EOF'

EOF
          echo '6c9b923509cb6894617566406f7fc9cc7cbf8c63110c7216f2ba2da9f9005549  /tmp/fix.b64' | sha256sum -c -
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          Path('/tmp/fix.patch').write_bytes(gzip.decompress(base64.b64decode(Path('/tmp/fix.b64').read_bytes())))
          PY
          echo 'bfaceee22fe824f9a863d58f5954ad642fd79b5e8a15587363d96aac71e2fe71  /tmp/fix.patch' | sha256sum -c -
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          rm -f .github/workflows/fix-momoclo-eplus-validation.yml
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data .github
          git commit -m 'fix: complete Momoclo Xmas eplus lottery mapping'
          git push origin HEAD:fix/dev-validation-momoclo-eplus-20260829
