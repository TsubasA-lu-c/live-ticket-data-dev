name: Apply weekly approved existing data 20260912
on:
  push:
    branches: [audit/rescue-missing-performances-20260912]
    paths: ['.github/workflows/apply-weekly-approved-existing-20260912.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard branch state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "audit/rescue-missing-performances-20260912"
          git status --short
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "b8366378b4f828cf27ae3b5f80d3c6945aff4710"
      - name: Apply approved existing-event updates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime

          ROOT=Path('data/artist')
          VERIFIED='2026-09-12T00:00:00+09:00'
          changed=set()

          def load(aid):
              p=ROOT/f'{aid}.json'; d=json.loads(p.read_text(encoding='utf-8')); return p,d
          def save(p,d):
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); changed.add(str(p))
          def date_of(perf):
              return (perf.get('performanceDate') or perf.get('performanceAt','')[:10])
          def perfs_on(d, dates):
              wanted=set(dates); out=[p for p in d['performances'] if date_of(p) in wanted]
              got={date_of(p) for p in out}
              if got != wanted: raise AssertionError(f'dates mismatch wanted={wanted} got={got}')
              return out
          def unique_tour_for(perfs):
              tids={p['tourId'] for p in perfs}
              if len(tids)!=1: raise AssertionError(f'expected one tour, got {tids}')
              return next(iter(tids))
          def tour(d, tid):
              xs=[t for t in d['tours'] if t['id']==tid]
              if len(xs)!=1: raise AssertionError(f'tour {tid} count={len(xs)}')
              return xs[0]
          def lottery(d, *, lid, tid, typ, start, end, pids, source_url, result=None, pay_start=None, pay_end=None):
              existing=[x for x in d['lotteries'] if x['id']==lid]
              obj={'id':lid,'tourId':tid,'type':typ,'entryStartAt':start,'entryEndAt':end,'resultAt':result,'paymentStartAt':pay_start,'paymentEndAt':pay_end,'performanceIds':pids,'source':'system','sourceUrl':source_url,'lastVerifiedAt':VERIFIED}
              if existing:
                  existing[0].update(obj)
              else:
                  d['lotteries'].append(obj)
          def source_for(d, tid): return tour(d,tid).get('sourceUrl')

          # Hinatazaka46 — existing 18th Single LIVE
          p,d=load('hinatazaka46'); ps=perfs_on(d,['2026-10-06','2026-10-07']); tid=unique_tour_for(ps)
          lottery(d,lid='hinatazaka46_18th_single_live_2026_official_presale_0907',tid=tid,typ='オフィシャル先行',start='2026-09-07T12:00:00+09:00',end='2026-09-09T23:59:00+09:00',pids=[x['id'] for x in ps],source_url=source_for(d,tid)); save(p,d)

          # Vaundy — Yokohama 2027 dates + VAWS presales
          p,d=load('vaundy'); ps=perfs_on(d,['2027-11-27','2027-11-28']); tid=unique_tour_for(ps)
          by={date_of(x):x for x in ps}; by['2027-11-27'].update(venue='横浜アリーナ',doorOpenAt='2027-11-27T17:00:00+09:00',performanceAt='2027-11-27T18:00:00+09:00',lastVerifiedAt=VERIFIED); by['2027-11-28'].update(venue='横浜アリーナ',doorOpenAt='2027-11-28T15:00:00+09:00',performanceAt='2027-11-28T16:00:00+09:00',lastVerifiedAt=VERIFIED)
          src=source_for(d,tid)
          lottery(d,lid='vaundy_2027_yokohama_vaws_premium_presale',tid=tid,typ='VAWS premium先行',start='2026-09-06T19:00:00+09:00',end='2026-09-18T23:59:00+09:00',result='2026-10-01T18:00:00+09:00',pay_start='2026-10-01T18:00:00+09:00',pay_end='2026-10-04T23:59:00+09:00',pids=[x['id'] for x in ps],source_url=src)
          lottery(d,lid='vaundy_2027_yokohama_vaws_presale',tid=tid,typ='VAWS先行',start='2026-09-19T12:00:00+09:00',end='2026-10-04T23:59:00+09:00',result='2026-10-10T18:00:00+09:00',pay_start='2026-10-10T18:00:00+09:00',pay_end='2026-10-13T23:59:00+09:00',pids=[x['id'] for x in ps],source_url=src); save(p,d)

          # HANA — replace incomplete generic resale with exact per-performance windows
          p,d=load('hana'); ps=perfs_on(d,['2026-09-16','2026-09-17','2026-10-29','2026-10-30','2026-10-31']); tid=unique_tour_for(ps)
          old=[x for x in d['lotteries'] if x['id']=='hana_born_to_bloom_2026_add_official_resale']
          if len(old)!=1: raise AssertionError(f'HANA placeholder count={len(old)}')
          src=old[0]['sourceUrl']; d['lotteries']=[x for x in d['lotteries'] if x['id']!='hana_born_to_bloom_2026_add_official_resale']
          windows={'2026-09-16':('2026-09-11T21:00:00+09:00','2026-09-16T18:30:00+09:00'),'2026-09-17':('2026-09-12T21:00:00+09:00','2026-09-17T18:30:00+09:00'),'2026-10-29':('2026-10-24T21:00:00+09:00','2026-10-29T18:30:00+09:00'),'2026-10-30':('2026-10-25T21:00:00+09:00','2026-10-30T18:30:00+09:00'),'2026-10-31':('2026-10-26T21:00:00+09:00','2026-10-31T17:00:00+09:00')}
          for perf in ps:
              dt=date_of(perf); st,en=windows[dt]; lottery(d,lid=f'hana_born_to_bloom_2026_add_resale_{dt[5:].replace("-","")}',tid=tid,typ='定価トレード（公式リセール）',start=st,end=en,pids=[perf['id']],source_url=src)
          save(p,d)

          # Sakurazaka46 — anniversary time correction + presales
          p,d=load('sakurazaka46'); ps=perfs_on(d,['2026-11-15']); perf=ps[0]; tid=perf['tourId']; perf.update(doorOpenAt='2026-11-15T15:00:00+09:00',performanceAt='2026-11-15T17:00:00+09:00',lastVerifiedAt=VERIFIED); src=source_for(d,tid)
          # Existing three 9/6 presales: select by type and same tour
          targets=[x for x in d['lotteries'] if x['tourId']==tid and ('FC' in x['type'] or 'Lemino' in x['type'])]
          if len(targets)<3: raise AssertionError(f'Sakurazaka expected >=3 FC/Lemino lotteries got {len(targets)}')
          for x in targets:
              if x.get('entryStartAt') in (None,'2026-09-06T12:00:00+09:00') or x['id'].endswith(('fc','lemino_special','lemino_pack')):
                  x.update(entryStartAt='2026-09-06T12:00:00+09:00',entryEndAt='2026-09-20T23:59:00+09:00',lastVerifiedAt=VERIFIED)
          pids=[perf['id']]
          lottery(d,lid='sakurazaka46_6th_anniv_official_presale_1001',tid=tid,typ='オフィシャル先行',start='2026-10-01T12:00:00+09:00',end='2026-10-06T23:59:00+09:00',pids=pids,source_url=src)
          lottery(d,lid='sakurazaka46_6th_anniv_lawson_presale_1010',tid=tid,typ='ローソンチケット先行',start='2026-10-10T12:00:00+09:00',end='2026-10-19T23:59:00+09:00',pids=pids,source_url=src)
          lottery(d,lid='sakurazaka46_6th_anniv_aeon_presale_1022',tid=tid,typ='イオンカード先行',start='2026-10-22T12:00:00+09:00',end='2026-10-25T23:59:00+09:00',pids=pids,source_url=src)
          lottery(d,lid='sakurazaka46_6th_anniv_general_1031',tid=tid,typ='一般発売（先着）',start='2026-10-31T12:00:00+09:00',end=None,pids=pids,source_url=src); save(p,d)

          # BUMP OF CHICKEN — Ratio Clavis dome Silver Week
          p,d=load('bump_of_chicken'); ps=perfs_on(d,['2027-01-23','2027-01-24','2027-02-06','2027-02-07']); tid=unique_tour_for(ps); lottery(d,lid='bump_ratio_clavis_2027_dome_silver_week_presale',tid=tid,typ='ドーム公演 Silver Week 特別先行',start='2026-09-11T18:00:00+09:00',end='2026-09-27T23:59:00+09:00',pids=[x['id'] for x in ps],source_url=source_for(d,tid)); save(p,d)

          # Dream Festival shared second presale
          for aid,dt in [('ae_group','2026-11-21'),('novelbright','2026-11-21'),('monaki','2026-11-23')]:
              p,d=load(aid); ps=perfs_on(d,[dt]); tid=ps[0]['tourId']; lottery(d,lid=f'{aid}_dream_festival_2026_second_presale',tid=tid,typ='2次先行',start='2026-09-07T12:00:00+09:00',end='2026-09-13T23:59:00+09:00',pids=[ps[0]['id']],source_url=source_for(d,tid)); save(p,d)

          # 04 Limited Sazabys title canonicalization
          p,d=load('04_limited_sazabys'); tid='04_limited_sazabys_one_man_tour_2026'; t=tour(d,tid)
          if len([x for x in d['performances'] if x['tourId']==tid])!=9: raise AssertionError('04LS VIEW tour performance count != 9')
          t.update(title='04 Limited Sazabys VIEW tour 2026',lastVerifiedAt=VERIFIED); save(p,d)

          # Frederic — UMIMOYASU trade
          p,d=load('frederic'); ps=perfs_on(d,['2026-10-12']); tid=ps[0]['tourId']; lottery(d,lid='frederic_umimoyasu_2026_trade_0910',tid=tid,typ='公式チケットトレード',start='2026-09-10T12:00:00+09:00',end='2026-10-11T11:59:00+09:00',pids=[ps[0]['id']],source_url=source_for(d,tid)); save(p,d)

          # 10-FEET F.A.D rescued performance — preorder + general sale
          p,d=load('10_feet'); ps=perfs_on(d,['2026-10-14']); matches=[x for x in ps if 'F.A.D' in x.get('venue','')]
          if len(matches)!=1: raise AssertionError(f'10-FEET FAD match count={len(matches)}')
          perf=matches[0]; tid=perf['tourId']; src=perf.get('sourceUrl') or source_for(d,tid)
          lottery(d,lid='10_feet_fad30_261014_2026_eplus_presale',tid=tid,typ='e+プレオーダー',start='2026-08-17T18:00:00+09:00',end='2026-08-23T23:59:00+09:00',pids=[perf['id']],source_url=src)
          lottery(d,lid='10_feet_fad30_261014_2026_general',tid=tid,typ='一般発売（先着）',start='2026-09-05T10:00:00+09:00',end='2026-10-13T18:00:00+09:00',pids=[perf['id']],source_url=src); save(p,d)

          # Kroi — JUNGLE Tokyo 2F standing sale
          p,d=load('kroi'); ps=perfs_on(d,['2026-09-22','2026-09-23']); tid=unique_tour_for(ps); lottery(d,lid='kroi_jungle_2026_tokyo_2f_standing_0905',tid=tid,typ='2Fスタンディング追加販売（先着）',start='2026-09-05T19:30:00+09:00',end=None,pids=[x['id'] for x in ps],source_url=source_for(d,tid)); save(p,d)

          # Miura Daichi — Misato added/equipment seats
          p,d=load('miura_daichi'); ps=perfs_on(d,['2026-09-12','2026-09-13']); tid=unique_tour_for(ps); src=source_for(d,tid); pids=[x['id'] for x in ps]
          lottery(d,lid='miura_daichi_misato_2026_production_seat_0908',tid=tid,typ='制作席追加販売（先着）',start='2026-09-08T18:00:00+09:00',end=None,pids=pids,source_url=src)
          lottery(d,lid='miura_daichi_misato_2026_equipment_seat_0911',tid=tid,typ='機材席当日引換券（先着）',start='2026-09-11T18:00:00+09:00',end=None,pids=pids,source_url=src); save(p,d)

          # ENHYPEN BLOOD SAGA upgrade lottery
          p,d=load('enhypen'); ps=[x for x in d['performances'] if 'BLOOD SAGA' in (tour(d,x['tourId']).get('title') or '') and date_of(x)>='2026-12-01']
          if not ps: raise AssertionError('ENHYPEN BLOOD SAGA perfs not found')
          tid=unique_tour_for(ps); lottery(d,lid='enhypen_blood_saga_2026_upgrade_0909',tid=tid,typ='アップグレード抽選（VIP/S席）',start='2026-09-09T17:00:00+09:00',end='2026-09-28T23:59:00+09:00',result='2026-10-08T19:00:00+09:00',pay_start='2026-10-08T19:00:00+09:00',pay_end='2026-10-13T23:00:00+09:00',pids=[x['id'] for x in ps],source_url=source_for(d,tid)); save(p,d)

          # ILLIT PRESS START ENCORE Lawson lottery
          p,d=load('illit'); ps=perfs_on(d,['2026-12-23','2026-12-24','2026-12-26','2026-12-27']); tid=unique_tour_for(ps); lottery(d,lid='illit_press_start_encore_2026_lawson_0907',tid=tid,typ='ローソンチケット先行',start='2026-09-07T17:00:00+09:00',end='2026-09-15T23:59:00+09:00',pids=[x['id'] for x in ps],source_url=source_for(d,tid)); save(p,d)

          # CANDY TUNE exact resales
          p,d=load('candy_tune'); ps=perfs_on(d,['2026-09-19','2026-12-08','2026-12-09']); tid=unique_tour_for(ps); src=source_for(d,tid)
          w={'2026-09-19':('2026-09-17T10:00:00+09:00','2026-09-18T23:59:00+09:00'),'2026-12-08':('2026-12-06T10:00:00+09:00','2026-12-07T23:59:00+09:00'),'2026-12-09':('2026-12-07T10:00:00+09:00','2026-12-08T23:59:00+09:00')}
          for x in ps:
              st,en=w[date_of(x)]; lottery(d,lid=f'candy_tune_candy_circus_2026_resale_{date_of(x)[5:].replace("-","")}',tid=tid,typ='公式リセール',start=st,end=en,pids=[x['id']],source_url=src)
          save(p,d)

          # INKIGAYO general sales for existing performances
          for aid,dt in [('niziu','2026-09-22'),('ado','2026-09-23'),('equal_love','2026-09-22')]:
              p,d=load(aid); ps=perfs_on(d,[dt]); matches=[x for x in ps if 'INKIGAYO' in (tour(d,x['tourId']).get('title') or '').upper()]
              if len(matches)!=1: raise AssertionError(f'{aid} INKIGAYO count={len(matches)}')
              perf=matches[0]; tid=perf['tourId']; lottery(d,lid=f'{aid}_inkigayo_2026_general_0910',tid=tid,typ='一般発売（先着）',start='2026-09-10T12:00:00+09:00',end=None,pids=[perf['id']],source_url=source_for(d,tid)); save(p,d)

          # Mr.Children Fukui final lottery
          p,d=load('mr_children'); ps=perfs_on(d,['2026-10-03','2026-10-04']); tid=unique_tour_for(ps); lottery(d,lid='mr_children_saturday_park_2026_final_fukui',tid=tid,typ='最終抽選（福井公演）',start='2026-09-11T19:00:00+09:00',end='2026-09-27T23:59:00+09:00',result='2026-10-02T20:30:00+09:00',pids=[x['id'] for x in ps],source_url='https://tour.mrchildren.jp/'); save(p,d)

          # YOASOBI Kyocera Lawson prerequest
          p,d=load('yoasobi'); ps=perfs_on(d,['2026-10-24','2026-10-25']); tid=unique_tour_for(ps); lottery(d,lid='yoasobi_chowakusei_kyocera_2026_lawson_prerequest_0908',tid=tid,typ='ローソン プレリク先行',start='2026-09-08T12:00:00+09:00',end='2026-09-15T23:59:00+09:00',result='2026-09-18T15:00:00+09:00',pids=[x['id'] for x in ps],source_url=source_for(d,tid)); save(p,d)

          # IDOLiSH7 Fukuoka additional general + conditional same-day sale
          p,d=load('idolish7'); ps=perfs_on(d,['2026-09-13']); matches=[x for x in ps if '4WARD' in (tour(d,x['tourId']).get('title') or '').upper()]
          if not matches: raise AssertionError('IDOLiSH7 Fukuoka 4WARD 9/13 not found')
          tid=unique_tour_for(matches); src=source_for(d,tid); pids=[x['id'] for x in matches]
          lottery(d,lid='idolish7_4ward_fukuoka_2026_additional_general_0910',tid=tid,typ='追加一般発売',start='2026-09-10T18:00:00+09:00',end='2026-09-12T23:59:00+09:00',pids=pids,source_url=src)
          lottery(d,lid='idolish7_4ward_fukuoka_2026_same_day_conditional_0913',tid=tid,typ='当日券（残席がある場合のみ）',start='2026-09-13T00:00:00+09:00',end=None,pids=pids,source_url=src); save(p,d)

          # XG THE CORE FINAL presale
          p,d=load('xg'); ps=perfs_on(d,['2027-02-10','2027-02-11','2027-02-27','2027-02-28']); tid=unique_tour_for(ps); lottery(d,lid='xg_the_core_final_2027_presale_0907',tid=tid,typ='チケット先行抽選',start='2026-09-07T15:00:00+09:00',end='2026-09-14T23:59:00+09:00',result='2026-09-19T15:00:00+09:00',pay_start='2026-09-19T15:00:00+09:00',pay_end='2026-09-24T23:59:00+09:00',pids=[x['id'] for x in ps],source_url=source_for(d,tid)); save(p,d)

          print('CHANGED_FILES')
          for x in sorted(changed): print(x)
          PY
      - name: Materialize, manifest, validate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/materialize_artist_live_relations.py
          python3 tools/update_manifest.py
          python3 tools/validate.py
      - name: Inspect and commit only intended data
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          allowed='^(data/artist/(hinatazaka46|vaundy|hana|sakurazaka46|bump_of_chicken|ae_group|novelbright|monaki|04_limited_sazabys|frederic|10_feet|kroi|miura_daichi|enhypen|illit|candy_tune|niziu|ado|equal_love|mr_children|yoasobi|idolish7|xg|oishi_masayoshi|masayoshi_oishi)\.json|data/manifest\.json)$'
          bad=$(git status --short | sed 's/^...//' | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then echo "Unexpected diff:"; echo "$bad"; exit 1; fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artist/hinatazaka46.json data/artist/vaundy.json data/artist/hana.json data/artist/sakurazaka46.json data/artist/bump_of_chicken.json data/artist/ae_group.json data/artist/novelbright.json data/artist/monaki.json data/artist/04_limited_sazabys.json data/artist/frederic.json data/artist/10_feet.json data/artist/kroi.json data/artist/miura_daichi.json data/artist/enhypen.json data/artist/illit.json data/artist/candy_tune.json data/artist/niziu.json data/artist/ado.json data/artist/equal_love.json data/artist/mr_children.json data/artist/yoasobi.json data/artist/idolish7.json data/artist/xg.json data/artist/oishi_masayoshi.json data/artist/masayoshi_oishi.json data/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'update: apply weekly approved existing-event changes'
          git push origin HEAD:audit/rescue-missing-performances-20260912
