name: Apply Yabai Youngskinny correction

on:
  push:
    branches:
      - fix/yabait-youngskinny-20270204-20260913

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/yabait-youngskinny-20270204-20260913
          fetch-depth: 0
          clean: true

      - name: Apply scoped correction
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%s)"
          if [ "$message" != "chore: stage Yabai Youngskinny fix" ]; then
            echo "No-op for follow-up commit: $message"
            exit 0
          fi
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          path = Path('data/artist/yabai_tshirts_yasan.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          tour_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_0204'
          perf_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_nara_0204'
          lottery_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_prerequest2'
          official_url = 'https://yabaitshirtsyasan.com/live/293577/'
          now = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%dT%H:%M:%S+09:00')

          tours = data.get('tours', [])
          matches = [t for t in tours if t.get('id') == tour_id]
          if len(matches) != 1:
            raise SystemExit(f'expected exactly one tour {tour_id}, found {len(matches)}')
          tour = matches[0]
          tour['prices'] = [{'label': '前売', 'amount': 5500}]
          tour['sourceUrl'] = official_url
          tour['lastVerifiedAt'] = now

          performances = data.setdefault('performances', [])
          if any(p.get('id') == perf_id for p in performances):
            raise SystemExit(f'performance already exists: {perf_id}')
          performances.append({
              'id': perf_id,
              'tourId': tour_id,
              'venue': 'EVANS CASTLE HALL',
              'performanceAt': '2027-02-04T19:00:00+09:00',
              'doorOpenAt': '2027-02-04T18:15:00+09:00',
              'kind': 'taiban',
              'eventName': None,
              'source': 'system',
              'sourceUrl': official_url,
              'lastVerifiedAt': now,
          })

          lotteries = data.setdefault('lotteries', [])
          if any(x.get('id') == lottery_id for x in lotteries):
            raise SystemExit(f'lottery already exists: {lottery_id}')
          lotteries.append({
              'id': lottery_id,
              'tourId': tour_id,
              'type': 'プレリクエスト2次先行',
              'entryStartAt': '2026-08-21T12:00:00+09:00',
              'entryEndAt': '2026-09-01T23:59:00+09:00',
              'resultAt': None,
              'paymentStartAt': None,
              'paymentEndAt': None,
              'performanceIds': [perf_id],
              'source': 'system',
              'sourceUrl': official_url,
              'lastVerifiedAt': now,
          })

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest_path = Path('data/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          artist_path = path
          artist_hash = hashlib.sha256(artist_path.read_bytes()).hexdigest()[:16]
          artists_hash = hashlib.sha256(Path('data/artists.json').read_bytes()).hexdigest()[:16]
          manifest['version'] = int(manifest.get('version', 0)) + 1
          manifest['updatedAt'] = now
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = artists_hash
          manifest.setdefault('artists', {}).setdefault('yabai_tshirts_yasan', {})['hash'] = artist_hash
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Scoped invariants.
          reread = json.loads(path.read_text(encoding='utf-8'))
          assert sum(p.get('id') == perf_id for p in reread['performances']) == 1
          assert sum(x.get('id') == lottery_id for x in reread['lotteries']) == 1
          assert next(p for p in reread['performances'] if p.get('id') == perf_id)['kind'] == 'taiban'
          print(f'updated {perf_id} and {lottery_id}; manifest version={manifest["version"]}')
          PY

      - name: Validate JSON and scoped diff
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%s)"
          if [ "$message" != "chore: stage Yabai Youngskinny fix" ]; then exit 0; fi
          python3 -m json.tool data/artist/yabai_tshirts_yasan.json >/dev/null
          python3 -m json.tool data/manifest.json >/dev/null
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'data/artist/yabai_tshirts_yasan.json\ndata/manifest.json'

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%s)"
          if [ "$message" != "chore: stage Yabai Youngskinny fix" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artist/yabai_tshirts_yasan.json data/manifest.json
          git commit -m 'fix: add Yabai T-shirts Yasan Nara guest show'
          git push origin HEAD:fix/yabait-youngskinny-20270204-20260913
