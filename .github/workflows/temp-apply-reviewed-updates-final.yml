name: Temporary apply reviewed updates final

on:
  push:
    branches: [main]
    paths:
      - '.github/temp-apply-reviewed-updates-final-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply canonical-validated data patch
        shell: bash
        run: |
          set -euo pipefail
          baseline='dceebe70c8b1f55055e73ecd4608bd41ad498ca9'
          expected_sha='d01fe805df37480e60815994c58b0fe9dd79bda203b9b7516a05e5954c40c31f'
          patch="$RUNNER_TEMP/reviewed-dev-data.patch"

          echo '--- git status before ---'
          git status --short
          git cat-file -e "${baseline}^{commit}"
          if ! git diff --quiet "${baseline}..HEAD" -- data; then
            echo '[ERROR] data changed since reviewed baseline; refusing to apply'
            git diff --name-only "${baseline}..HEAD" -- data
            exit 1
          fi

          PATCH="$patch" EXPECTED_SHA="$expected_sha" python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          source = Path('.github/reviewed-dev-data-validated')
          chunks = sorted(source.glob('chunk-*.txt'))
          if [p.name for p in chunks] != [f'chunk-{i:02d}.txt' for i in range(5)]:
              raise SystemExit(f'[ERROR] unexpected patch chunks: {[p.name for p in chunks]}')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in chunks)
          patch = gzip.decompress(base64.b64decode(encoded))
          actual = hashlib.sha256(patch).hexdigest()
          expected = os.environ['EXPECTED_SHA']
          print(f'patch bytes: {len(patch)}')
          print(f'patch sha256: {actual}')
          if actual != expected:
              raise SystemExit(f'[ERROR] patch sha mismatch: {actual} != {expected}')
          Path(os.environ['PATCH']).write_bytes(patch)
          PY

          git apply --check "$patch"
          git apply "$patch"
          git apply --reverse --check "$patch"
          git diff --check

          echo '--- changed data files ---'
          mapfile -t changed < <(git diff --name-only -- data)
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -ne 38 ]; then
            echo "[ERROR] expected 38 changed data files, got ${#changed[@]}"
            exit 1
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              data/*) ;;
              *) echo "[ERROR] non-data path in patch: $path"; exit 1 ;;
            esac
          done

          echo '--- data diff stat ---'
          git diff --stat -- data
          echo '--- git status before commit ---'
          git status --short

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data
          if git diff --cached --quiet; then
            echo '[ERROR] no staged data changes'
            exit 1
          fi
          if git diff --cached --name-only | grep -Ev '^data/' >/dev/null; then
            echo '[ERROR] staged non-data files detected'
            git diff --cached --name-only
            exit 1
          fi
          git commit -m 'update: apply reviewed 2026-08-30 live ticket updates'
          git push origin HEAD:main

          echo '--- final git status ---'
          git status --short
