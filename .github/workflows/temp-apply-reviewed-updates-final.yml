name: Temporary apply reviewed updates final

on:
  push:
    branches: [main]
    paths:
      - '.github/temp-apply-reviewed-updates-final-trigger'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect recovery inputs
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          find .github -maxdepth 2 -type f -name 'reviewed-updates-20260830*' -print | sort

      - name: Upload recovery inputs
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-updates-20260830-recovery-inputs
          path: |
            .github/reviewed-updates-20260830.json.gz.b64
            .github/reviewed-updates-20260830/
            .github/reviewed-updates-20260830-final.json.gz.b64
            .github/reviewed-updates-20260830-final/
            .github/temp-apply-reviewed-updates-report.json
          if-no-files-found: error
          retention-days: 1
