name: Temporary apply reviewed updates final

on:
  push:
    branches: [main]
    paths:
      - '.github/temp-apply-reviewed-updates-final-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect staged reviewed-update payloads
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          python3 - <<'PY'
          import base64, gzip, hashlib, json, zlib
          from pathlib import Path

          root = Path('.')

          def chunks(path):
              files = sorted(path.glob('chunk-*.txt'))
              return ''.join(p.read_text(encoding='utf-8').strip() for p in files), [p.name for p in files]

          final_chunks, final_names = chunks(root / '.github/reviewed-updates-20260830-final')
          initial_chunks, initial_names = chunks(root / '.github/reviewed-updates-20260830')
          final_single = (root / '.github/reviewed-updates-20260830-final.json.gz.b64').read_text(encoding='utf-8').strip()
          initial_single = (root / '.github/reviewed-updates-20260830.json.gz.b64').read_text(encoding='utf-8').strip()

          print('final chunk names:', final_names)
          print('initial chunk names:', initial_names)
          print('final chunks len:', len(final_chunks), 'mod4:', len(final_chunks) % 4)
          print('final single len:', len(final_single), 'mod4:', len(final_single) % 4)
          print('initial chunks len:', len(initial_chunks), 'mod4:', len(initial_chunks) % 4)
          print('initial single len:', len(initial_single), 'mod4:', len(initial_single) % 4)
          print('final chunks are prefix of final single:', final_single.startswith(final_chunks))
          print('initial chunks are prefix of initial single:', initial_single.startswith(initial_chunks))
          print('initial single is prefix of initial chunks:', initial_chunks.startswith(initial_single))

          candidates = {
              'final_chunks': final_chunks,
              'final_single': final_single,
              'initial_chunks': initial_chunks,
              'initial_single': initial_single,
          }

          for label, text in candidates.items():
              print(f'--- {label} ---')
              try:
                  compressed = base64.b64decode(text, validate=True)
                  print('compressed bytes:', len(compressed), 'sha256:', hashlib.sha256(compressed).hexdigest())
              except Exception as exc:
                  print('base64 failed:', type(exc).__name__, str(exc))
                  continue
              try:
                  decoded = gzip.decompress(compressed)
                  print('gzip ok decoded bytes:', len(decoded), 'sha256:', hashlib.sha256(decoded).hexdigest())
                  spec = json.loads(decoded)
                  print('baseline:', spec.get('baselineCommit'))
                  print('artists:', ', '.join(sorted((spec.get('artists') or {}).keys())))
                  print('artist count:', len(spec.get('artists') or {}))
                  print('artistListUpdates:', len(spec.get('artistListUpdates') or []))
              except Exception as exc:
                  print('gzip/json failed:', type(exc).__name__, str(exc))
                  try:
                      d = zlib.decompressobj(16 + zlib.MAX_WBITS)
                      partial = d.decompress(compressed)
                      print('partial decoded bytes:', len(partial))
                      print('partial utf8 tail:', partial.decode('utf-8', errors='replace')[-500:])
                  except Exception as partial_exc:
                      print('partial decode failed:', type(partial_exc).__name__, str(partial_exc))

          raise SystemExit('inspection only: no data changes applied')
          PY
