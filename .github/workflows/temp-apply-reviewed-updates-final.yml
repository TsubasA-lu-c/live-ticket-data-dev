name: Temporary apply reviewed updates final

on:
  push:
    branches: [main]
    paths:
      - '.github/temp-apply-reviewed-updates-final-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check canonical collector access
        env:
          GH_TOKEN_CURRENT_REPO: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git ls-remote "https://x-access-token:${GH_TOKEN_CURRENT_REPO}@github.com/TsubasA-lu-c/chatgpt-workspace.git" HEAD
