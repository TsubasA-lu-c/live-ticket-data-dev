name: Temporary apply reviewed updates final

on:
  push:
    branches: [main]
    paths:
      - '.github/temp-apply-reviewed-updates-final-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect reviewed update application prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import json
          import subprocess
          from pathlib import Path

          root = Path('.')
          data = root / 'data'
          payload = root / '.github/reviewed-updates-20260830-final.json.gz.b64'
          spec = json.loads(gzip.decompress(base64.b64decode(payload.read_text(encoding='utf-8').strip())))
          baseline = spec.get('baselineCommit')
          diff = subprocess.run(['git', 'diff', '--quiet', f'{baseline}..HEAD', '--', 'data'])

          null_count = 0
          null_without_date = []
          for path in sorted((data / 'artist').glob('*.json')):
              obj = json.loads(path.read_text(encoding='utf-8'))
              for perf in obj.get('performances', []):
                  if perf.get('performanceAt') is None:
                      null_count += 1
                      if not perf.get('performanceDate'):
                          null_without_date.append(f'{path.stem}:{perf.get("id")}')

          report = {
              'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'baselineCommit': baseline,
              'dataChangedSinceBaseline': diff.returncode != 0,
              'artistOpCount': len(spec.get('artists') or {}),
              'artistIds': sorted((spec.get('artists') or {}).keys()),
              'artistListUpdateCount': len(spec.get('artistListUpdates') or []),
              'nullPerformanceAtCount': null_count,
              'nullPerformanceAtWithoutDate': null_without_date,
              'tools': {
                  'materialize': Path('tools/materialize_artist_live_relations.py').exists(),
                  'updateManifest': Path('tools/update_manifest.py').exists(),
                  'validate': Path('tools/validate.py').exists(),
              },
          }
          Path('.github/temp-apply-reviewed-updates-report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/temp-apply-reviewed-updates-report.json
          git commit -m 'ops: record reviewed update application prerequisites'
          git push origin HEAD:main
