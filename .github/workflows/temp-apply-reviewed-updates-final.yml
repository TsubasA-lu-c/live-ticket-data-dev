name: Temporary apply reviewed updates final

on:
  push:
    branches: [main]
    paths:
      - '.github/temp-apply-reviewed-updates-final-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect tolerant final payload recovery
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          python3 - <<'PY'
          import base64, json, re, zlib
          from pathlib import Path

          root = Path('.')

          def read_chunks(path):
              files = sorted(path.glob('chunk-*.txt'))
              return ''.join(p.read_text(encoding='utf-8').strip() for p in files)

          def tolerant_b64(text):
              compact = ''.join(text.split())
              compact += '=' * ((4 - len(compact) % 4) % 4)
              return base64.b64decode(compact, validate=False)

          def partial_gzip(compressed):
              d = zlib.decompressobj(16 + zlib.MAX_WBITS)
              out = bytearray()
              error = None
              for i in range(0, len(compressed), 256):
                  try:
                      out.extend(d.decompress(compressed[i:i+256]))
                  except Exception as exc:
                      error = f'{type(exc).__name__}: {exc}'
                      break
              return bytes(out), error

          def top_artist_ids(text):
              ids = []
              in_artists = False
              for line in text.splitlines():
                  if line == '  "artists": {':
                      in_artists = True
                      continue
                  if in_artists and line.startswith('  "artistListUpdates"'):
                      break
                  if in_artists:
                      m = re.match(r'^    "([^"]+)": \{$', line)
                      if m:
                          ids.append(m.group(1))
              return ids

          final_chunks = read_chunks(root / '.github/reviewed-updates-20260830-final')
          final_single = (root / '.github/reviewed-updates-20260830-final.json.gz.b64').read_text(encoding='utf-8').strip()

          for label, text in [('final_chunks', final_chunks), ('final_single_tolerant', final_single)]:
              print(f'=== {label} ===')
              compressed = tolerant_b64(text)
              print('input chars:', len(text), 'compressed bytes:', len(compressed))
              partial, error = partial_gzip(compressed)
              decoded = partial.decode('utf-8', errors='replace')
              print('partial decoded bytes:', len(partial), 'decompress error:', error)
              ids = top_artist_ids(decoded)
              print('top-level artist ids:', ids)
              print('top-level artist count visible:', len(ids))
              try:
                  spec = json.loads(partial)
                  print('partial is complete JSON: yes')
                  print('baseline:', spec.get('baselineCommit'))
                  print('artistListUpdates:', len(spec.get('artistListUpdates') or []))
              except Exception as exc:
                  print('partial is complete JSON: no:', type(exc).__name__, str(exc))
              print('decoded tail:')
              print(decoded[-1800:])

          print('final chunks prefix bytes equal to tolerant final single:',
                partial_gzip(tolerant_b64(final_single))[0].startswith(partial_gzip(tolerant_b64(final_chunks))[0]))
          raise SystemExit('inspection only: no data changes applied')
          PY
