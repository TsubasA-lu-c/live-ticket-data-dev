name: Temporary apply reviewed updates final

on:
  push:
    branches: [main]
    paths:
      - '.github/temp-apply-reviewed-updates-final-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover payload ignoring gzip trailer CRC
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import base64, json, subprocess, traceback, zlib
          from pathlib import Path

          report = {}
          try:
              text = Path('.github/reviewed-updates-20260830-final.json.gz.b64').read_text(encoding='utf-8').strip()
              raw = base64.b64decode(text + '=' * ((4 - len(text) % 4) % 4), validate=False)
              report['payloadChars'] = len(text)
              report['decodedBytes'] = len(raw)
              report['gzipHeader'] = raw[:10].hex()
              report['gzipTrailer'] = raw[-8:].hex()
              if raw[:3] != b'\x1f\x8b\x08':
                  raise ValueError('not a deflate gzip stream')
              decoded = zlib.decompress(raw[10:-8], -zlib.MAX_WBITS)
              report['rawDeflateOk'] = True
              report['decodedJsonBytes'] = len(decoded)
              spec = json.loads(decoded)
              report['jsonOk'] = True
              report['baselineCommit'] = spec.get('baselineCommit')
              report['artistOpCount'] = len(spec.get('artists') or {})
              report['artistIds'] = sorted((spec.get('artists') or {}).keys())
              report['artistListUpdateCount'] = len(spec.get('artistListUpdates') or [])
              report['topKeys'] = sorted(spec.keys())
          except Exception as exc:
              report['error'] = f'{type(exc).__name__}: {exc}'
              report['traceback'] = traceback.format_exc()
          report['head'] = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          Path('.github/temp-apply-reviewed-updates-report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/temp-apply-reviewed-updates-report.json
          git commit -m 'ops: record raw-deflate payload recovery diagnostics' || true
          git push origin HEAD:main
