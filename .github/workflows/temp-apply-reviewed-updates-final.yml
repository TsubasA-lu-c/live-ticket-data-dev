name: Temporary apply reviewed updates final

on:
  push:
    branches: [main]
    paths:
      - '.github/temp-apply-reviewed-updates-final-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Reconstruct and apply reviewed data in working tree
        shell: bash
        run: |
          set -euo pipefail
          echo '--- git status before ---'
          git status --short
          baseline='dceebe70c8b1f55055e73ecd4608bd41ad498ca9'
          git cat-file -e "${baseline}^{commit}"
          if ! git diff --quiet "${baseline}..HEAD" -- data; then
            echo '[ERROR] data changed since reviewed baseline'
            git diff --name-only "${baseline}..HEAD" -- data
            exit 1
          fi

          python3 - <<'PY'
          import base64
          import json
          import re
          import zlib
          from pathlib import Path

          root = Path('.')
          baseline = 'dceebe70c8b1f55055e73ecd4608bd41ad498ca9'
          expected_prefix = [
              '04_limited_sazabys','and_team','ateez','be_first','boku_aozora',
              'boynextdoor','bullet_train','candy_tune','cutie_street','da_ice',
              'equal_love','fruits_zipper','hana','illit','ini','jo1','kroi',
              'macaroni_empitsu','masayoshi_oishi','mazzel','milk','miura_daichi',
              'momoiro_clover_z','monaki','nakajima_kento','nogizaka46',
              'not_equal_me','oishi_masayoshi','one_n_only','one_ok_rock','saucy_dog',
          ]

          b64 = ''.join(
              p.read_text(encoding='utf-8').strip()
              for p in sorted((root / '.github/reviewed-updates-20260830-final').glob('chunk-*.txt'))
          )
          raw = base64.b64decode(b64 + '=' * ((4 - len(b64) % 4) % 4))
          d = zlib.decompressobj(16 + zlib.MAX_WBITS)
          decoded = d.decompress(raw).decode('utf-8')
          marker = re.search(r'"artists"\s*:\s*\{', decoded)
          if not marker:
              raise SystemExit('[ERROR] trusted payload has no artists object')
          pos = marker.end()
          dec = json.JSONDecoder()
          recovered = {}
          incomplete = None

          def skip(i):
              while i < len(decoded) and decoded[i] in ' \t\r\n,':
                  i += 1
              return i

          while True:
              pos = skip(pos)
              if pos >= len(decoded) or decoded[pos] == '}':
                  break
              try:
                  key, key_end = dec.raw_decode(decoded, pos)
              except json.JSONDecodeError:
                  break
              pos = skip(key_end)
              if pos >= len(decoded) or decoded[pos] != ':':
                  raise SystemExit(f'[ERROR] malformed trusted payload after artist key {key!r}')
              pos = skip(pos + 1)
              try:
                  value, value_end = dec.raw_decode(decoded, pos)
              except json.JSONDecodeError:
                  incomplete = key
                  break
              recovered[key] = value
              pos = value_end

          if list(recovered) != expected_prefix:
              raise SystemExit(f'[ERROR] trusted artist prefix mismatch: {list(recovered)}')
          if incomplete != 'sky_hi':
              raise SystemExit(f'[ERROR] expected truncated sky_hi, got {incomplete!r}')

          verified = '2026-08-30T00:00:00+09:00'
          sky_tour = 'sky_hi_event_2026_toyosu_pit'
          sky_perf = [
              'sky_hi_event_2026_toyosu_pit_toyosu_1211',
              'sky_hi_event_2026_toyosu_pit_toyosu_1212',
              'sky_hi_event_2026_toyosu_pit_toyosu_1213',
          ]
          recovered['sky_hi'] = {
              'toursUpsert': [{
                  'id': sky_tour, 'artistId': 'sky_hi',
                  'title': 'SKY-HI Birthday Bash 2026 -X-',
                  'startDate': '2026-12-11T00:00:00+09:00',
                  'endDate': '2026-12-13T00:00:00+09:00',
                  'prices': [{'label':'スタンディング','amount':9000,'currency':'JPY'}],
                  'source':'system','sourceUrl':'https://skyhi.tokyo/','lastVerifiedAt':verified,
              }],
              'performancesUpsert': [
                  {'id':sky_perf[0],'tourId':sky_tour,'venue':'豊洲PIT','performanceAt':'2026-12-11T19:00:00+09:00','doorOpenAt':'2026-12-11T18:00:00+09:00','kind':'oneman','eventName':'SKY-HI X UVERworld','source':'system','sourceUrl':'https://skyhi.tokyo/','lastVerifiedAt':verified},
                  {'id':sky_perf[1],'tourId':sky_tour,'venue':'豊洲PIT','performanceAt':'2026-12-12T18:30:00+09:00','doorOpenAt':'2026-12-12T17:30:00+09:00','kind':'oneman','eventName':'SKY-HI X FRIENDS','source':'system','sourceUrl':'https://skyhi.tokyo/','lastVerifiedAt':verified},
                  {'id':sky_perf[2],'tourId':sky_tour,'venue':'豊洲PIT','performanceAt':'2026-12-13T18:30:00+09:00','doorOpenAt':'2026-12-13T17:30:00+09:00','kind':'oneman','eventName':'SKY-HI X SKY-HI','source':'system','sourceUrl':'https://skyhi.tokyo/','lastVerifiedAt':verified},
              ],
              'lotteriesUpsert': [
                  {'id':sky_tour+'_flyers_architect','tourId':sky_tour,'type':'FLYERS／B-Town〈Architect〉先行','entryStartAt':'2026-08-24T18:00:00+09:00','entryEndAt':'2026-08-31T23:59:00+09:00','resultAt':'2026-09-05T12:00:00+09:00','paymentStartAt':None,'paymentEndAt':None,'performanceIds':sky_perf,'source':'system','sourceUrl':'https://skyhi.tokyo/','lastVerifiedAt':verified},
                  {'id':sky_tour+'_resident','tourId':sky_tour,'type':'B-Town〈Resident〉先行','entryStartAt':'2026-09-05T15:00:00+09:00','entryEndAt':'2026-09-10T23:59:00+09:00','resultAt':'2026-09-17T12:00:00+09:00','paymentStartAt':None,'paymentEndAt':None,'performanceIds':sky_perf,'source':'system','sourceUrl':'https://skyhi.tokyo/','lastVerifiedAt':verified},
                  {'id':sky_tour+'_second','tourId':sky_tour,'type':'FLYERS 2次／B-Town各2次先行','entryStartAt':'2026-09-17T15:00:00+09:00','entryEndAt':'2026-09-23T23:59:00+09:00','resultAt':'2026-09-30T12:00:00+09:00','paymentStartAt':None,'paymentEndAt':None,'performanceIds':sky_perf,'source':'system','sourceUrl':'https://skyhi.tokyo/','lastVerifiedAt':verified},
              ],
          }

          recovered['wanima'] = {
              'toursUpsert': [
                  {'id':'wanima_what_a_wonderful_world_2026','artistId':'wanima','title':'What a Wonderful World !! 26','startDate':'2026-11-07T00:00:00+09:00','endDate':'2026-11-07T00:00:00+09:00','prices':None,'source':'system','sourceUrl':'https://www800.asia/2026/about/','lastVerifiedAt':verified},
                  {'id':'wanima_kishidan_banpaku_2026','artistId':'wanima','title':'サントリー オールフリー presents 氣志團万博2026 ～房総爆音リゾート～','startDate':'2026-11-08T00:00:00+09:00','endDate':'2026-11-08T00:00:00+09:00','prices':None,'source':'system','sourceUrl':'https://www.red-hot.ne.jp/play/detail.php?pid=py28189','lastVerifiedAt':verified},
              ],
              'performancesUpsert': [
                  {'id':'wanima_what_a_wonderful_world_2026_1107','tourId':'wanima_what_a_wonderful_world_2026','venue':'宜野湾港マリーナ・トロピカルビーチ特設会場','performanceAt':'2026-11-07T13:00:00+09:00','doorOpenAt':'2026-11-07T11:00:00+09:00','kind':'fes','eventName':'What a Wonderful World !! 26','source':'system','sourceUrl':'https://www800.asia/2026/about/','lastVerifiedAt':verified},
                  {'id':'wanima_kishidan_banpaku_2026_1108','tourId':'wanima_kishidan_banpaku_2026','venue':'幕張メッセ国際展示場 4～7ホール','performanceAt':'2026-11-08T10:30:00+09:00','doorOpenAt':'2026-11-08T09:00:00+09:00','kind':'fes','eventName':'サントリー オールフリー presents 氣志團万博2026 ～房総爆音リゾート～','source':'system','sourceUrl':'https://www.red-hot.ne.jp/play/detail.php?pid=py28189','lastVerifiedAt':verified},
              ],
          }

          haneda = [
              'yabai_tshirts_yasan_mtp_tour_2026_haneda_1027',
              'yabai_tshirts_yasan_mtp_tour_2026_haneda_1028',
              'yabai_tshirts_yasan_mtp_tour_2026_haneda_1104',
              'yabai_tshirts_yasan_mtp_tour_2026_haneda_1105',
              'yabai_tshirts_yasan_mtp_tour_2026_haneda_1110',
              'yabai_tshirts_yasan_mtp_tour_2026_haneda_1111',
          ]
          recovered['yabai_tshirts_yasan'] = {
              'lotteriesUpsert': [
                  {'id':'yabai_tshirts_yasan_mtp_tour_2026_eplus_preorder_haneda','tourId':'yabai_tshirts_yasan_mtp_tour_2026','type':'Zepp Haneda公演 プレオーダー先行（e+）','entryStartAt':'2026-08-07T12:00:00+09:00','entryEndAt':'2026-08-19T23:59:00+09:00','resultAt':None,'paymentStartAt':None,'paymentEndAt':None,'performanceIds':haneda,'source':'system','sourceUrl':'https://yabaitshirtsyasan.com/mtp_tour/','lastVerifiedAt':verified},
                  {'id':'yabai_tshirts_yasan_mtp_tour_2026_pia_prereserve_haneda','tourId':'yabai_tshirts_yasan_mtp_tour_2026','type':'Zepp Haneda公演 プレリザーブ先行（ぴあ）','entryStartAt':'2026-08-07T12:00:00+09:00','entryEndAt':'2026-08-19T23:59:00+09:00','resultAt':None,'paymentStartAt':None,'paymentEndAt':None,'performanceIds':haneda,'source':'system','sourceUrl':'https://yabaitshirtsyasan.com/mtp_tour/','lastVerifiedAt':verified},
              ],
          }

          recovered['yuzu'] = {
              'toursUpsert': [{
                  'id':'yuzu_wonderlivet_2026','artistId':'yuzu','title':'WONDERLIVET 2026',
                  'startDate':'2026-11-22T00:00:00+09:00','endDate':'2026-11-22T00:00:00+09:00',
                  'prices':None,'source':'system','sourceUrl':'https://yuzu-official.com/','lastVerifiedAt':verified,
              }],
              'performancesUpsert': [{
                  'id':'yuzu_wonderlivet_2026_1122','tourId':'yuzu_wonderlivet_2026',
                  'venue':'KINTEX 第2展示場 HALL 7・8・9・10','performanceAt':'2026-11-22T12:00:00+09:00',
                  'doorOpenAt':None,'kind':'fes','eventName':'WONDERLIVET 2026','source':'system',
                  'sourceUrl':'https://yuzu-official.com/','lastVerifiedAt':verified,
                  'performanceDate':'2026-11-22','performanceTimeEstimated':True,
              }],
          }

          if len(recovered) != 35:
              raise SystemExit(f'[ERROR] expected 35 reviewed artists, got {len(recovered)}')
          if 'xg' in recovered or 'yuuri' in recovered:
              raise SystemExit('[ERROR] excluded old candidates leaked into reconstructed payload')

          def upsert(items, updates):
              items = list(items or [])
              updates = list(updates or [])
              index = {item['id']: i for i, item in enumerate(items)}
              for item in updates:
                  item_id = item['id']
                  if item_id in index:
                      items[index[item_id]] = item
                  else:
                      index[item_id] = len(items)
                      items.append(item)
              return items

          for artist_id, ops in recovered.items():
              path = root / 'data' / 'artist' / f'{artist_id}.json'
              if not path.exists():
                  raise SystemExit(f'[ERROR] missing artist file: {path}')
              doc = json.loads(path.read_text(encoding='utf-8'))
              doc['tours'] = upsert(doc.get('tours'), ops.get('toursUpsert'))
              doc['performances'] = upsert(doc.get('performances'), ops.get('performancesUpsert'))
              doc['lotteries'] = upsert(doc.get('lotteries'), ops.get('lotteriesUpsert'))
              path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          artists_path = root / 'data' / 'artists.json'
          registry = json.loads(artists_path.read_text(encoding='utf-8'))
          reviewed_ids = set(recovered)
          found = set()
          for artist in registry:
              artist_id = artist.get('id')
              if artist_id in reviewed_ids:
                  artist['lastVerifiedAt'] = verified
                  found.add(artist_id)
          if found != reviewed_ids:
              raise SystemExit(f'[ERROR] artists.json missing reviewed ids: {sorted(reviewed_ids - found)}')
          artists_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          normalized = []
          for path in sorted((root / 'data' / 'artist').glob('*.json')):
              doc = json.loads(path.read_text(encoding='utf-8'))
              dirty = False
              for perf in doc.get('performances', []):
                  if perf.get('performanceAt') is not None:
                      continue
                  performance_date = perf.get('performanceDate')
                  if not performance_date:
                      raise SystemExit(f'[ERROR] {path}: null performanceAt without performanceDate: {perf.get("id")}')
                  perf['performanceAt'] = f'{performance_date}T12:00:00+09:00'
                  perf['performanceTimeEstimated'] = True
                  normalized.append((path.stem, perf.get('id')))
                  dirty = True
              if dirty:
                  path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print(f'[OK] recovered reviewed artists: {len(recovered)}')
          print(f'[OK] performanceAt compatibility normalizations: {len(normalized)}')
          for artist_id, perf_id in normalized:
              print(f'  normalized {artist_id}:{perf_id}')
          PY

          echo '--- locate canonical collector validation tools ---'
          work_root="$(dirname "$RUNNER_WORKSPACE")"
          collector_source="$(find "$work_root" -type f -path '*/chatgpt-workspace/live-ticket-collector/source/tools/validate.py' -print -quit | sed 's#/tools/validate.py$##')"
          if [ -z "$collector_source" ]; then
            echo '[ERROR] canonical collector checkout not found on self-hosted runner'
            exit 1
          fi
          collector_repo="$(cd "$collector_source/../.." && pwd)"
          canonical_commit='211b33a6883a5615f43f954899d839e33657d496'
          git -C "$collector_repo" cat-file -e "${canonical_commit}^{commit}"
          validation_repo="$RUNNER_TEMP/chikenote-collector-validation"
          rm -rf "$validation_repo"
          git clone --shared --no-checkout "$collector_repo" "$validation_repo"
          git -C "$validation_repo" checkout --detach "$canonical_commit"
          validation_source="$validation_repo/live-ticket-collector/source"
          rm -rf "$validation_source/data"
          ln -s "$GITHUB_WORKSPACE/data" "$validation_source/data"

          echo '--- materialize relations ---'
          (cd "$validation_source" && python3 tools/materialize_artist_live_relations.py --data-dir "$GITHUB_WORKSPACE/data")
          echo '--- update manifest ---'
          (cd "$validation_source" && python3 tools/update_manifest.py)
          echo '--- validate ---'
          (cd "$validation_source" && python3 tools/validate.py) | tee "$RUNNER_TEMP/chikenote-validate.log"
          echo '--- warnings ---'
          grep -F '[WARNING]' "$RUNNER_TEMP/chikenote-validate.log" || true
          echo '--- diff check ---'
          git diff --check
          echo '--- data diff stat ---'
          git diff --stat -- data
          echo '--- git status after ---'
          git status --short

      - name: Upload validation log
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-dev-validation-log
          path: ${{ runner.temp }}/chikenote-validate.log
          if-no-files-found: error
          retention-days: 1
