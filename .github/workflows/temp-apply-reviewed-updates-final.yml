name: Temporary apply reviewed updates final

on:
  push:
    branches: [main]
    paths:
      - '.github/temp-apply-reviewed-updates-final-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect trusted reviewed-update prefix
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          python3 - <<'PY'
          import base64, json, zlib
          from pathlib import Path

          chunk_dir = Path('.github/reviewed-updates-20260830-final')
          text = ''.join(p.read_text(encoding='utf-8').strip() for p in sorted(chunk_dir.glob('chunk-*.txt')))
          compressed = base64.b64decode(text + '=' * ((4 - len(text) % 4) % 4), validate=False)
          d = zlib.decompressobj(16 + zlib.MAX_WBITS)
          decoded = d.decompress(compressed).decode('utf-8')

          marker = '  "artists": {'
          start = decoded.index(marker) + len(marker)
          pos = start
          dec = json.JSONDecoder()
          complete = {}
          incomplete_key = None

          def skip_ws_comma(s, i):
              while i < len(s) and s[i] in ' \t\r\n,':
                  i += 1
              return i

          while True:
              pos = skip_ws_comma(decoded, pos)
              if pos >= len(decoded) or decoded[pos] == '}':
                  break
              try:
                  key, key_end = dec.raw_decode(decoded, pos)
              except json.JSONDecodeError:
                  break
              pos = key_end
              pos = skip_ws_comma(decoded, pos)
              if pos >= len(decoded) or decoded[pos] != ':':
                  raise SystemExit(f'missing colon after key {key!r}')
              pos += 1
              pos = skip_ws_comma(decoded, pos)
              try:
                  value, end = dec.raw_decode(decoded, pos)
              except json.JSONDecodeError:
                  incomplete_key = key
                  break
              complete[key] = value
              pos = end

          print('complete artist ops:', len(complete))
          print('incomplete artist key:', incomplete_key)
          for aid, ops in complete.items():
              summary = {
                  'toursUpsert': len(ops.get('toursUpsert') or []),
                  'toursDelete': len(ops.get('toursDelete') or []),
                  'performancesUpsert': len(ops.get('performancesUpsert') or []),
                  'performancesDelete': len(ops.get('performancesDelete') or []),
                  'lotteriesUpsert': len(ops.get('lotteriesUpsert') or []),
                  'lotteriesDelete': len(ops.get('lotteriesDelete') or []),
                  'topLevel': ops.get('topLevel') or {},
              }
              print(aid, json.dumps(summary, ensure_ascii=False, sort_keys=True))

          # Print enough of the incomplete SKY-HI object to reconstruct it exactly.
          if incomplete_key:
              key_marker = '    ' + json.dumps(incomplete_key, ensure_ascii=False) + ': '
              key_pos = decoded.rfind(key_marker)
              print('--- incomplete object text ---')
              print(decoded[key_pos:])

          raise SystemExit('inspection only: no data changes applied')
          PY
