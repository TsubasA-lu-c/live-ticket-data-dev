                      'source': 'system',
                      'sourceUrl': 'https://www.tetsuya.uk.com/contents/1041692',
                      'lastVerifiedAt': VERIFIED
                  },
                  {
                      'id': 'tetsuya_acoustic_live_tour_2026_billboard',
                      'artistId': 'tetsuya',
                      'title': 'TETSUYA Acoustic Live Tour 2026 at Billboard Live',
                      'startDate': '2026-09-03T00:00:00+09:00',
                      'endDate': '2026-09-12T00:00:00+08:00',
                      'prices': None,
