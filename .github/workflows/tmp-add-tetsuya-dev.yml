name: Temporary TETSUYA Dev materialization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-add-tetsuya-dev.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize TETSUYA as independent Artist
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          DATA = Path('data')
          VERIFIED = '2026-09-03T18:32:00+09:00'

          def dump(path: Path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def sha16(path: Path):
              return hashlib.sha256(path.read_bytes()).hexdigest()[:16]

          artists_path = DATA / 'artists.json'
          artists = json.loads(artists_path.read_text(encoding='utf-8'))
          if not any(a.get('id') == 'tetsuya' for a in artists):
              artists.append({
                  'id': 'tetsuya',
                  'name': 'TETSUYA',
                  'aliases': ['テツヤ'],
                  'genre': 'ソロ',
                  'imageUrl': None,
                  'source': 'system',
                  'sourceUrl': 'https://www.tetsuya.uk.com/',
                  'lastVerifiedAt': VERIFIED,
                  'appleMusic': {
                      'artistId': '256671013'
                  }
              })
          dump(artists_path, artists)

          tetsuya = {
              'artistId': 'tetsuya',
              'tours': [
                  {
                      'id': 'tetsuya_25th_anniversary_live_2026',
