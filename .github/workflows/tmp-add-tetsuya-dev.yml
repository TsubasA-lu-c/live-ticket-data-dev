                      'lastVerifiedAt': VERIFIED
                  },
                  {
                      'id': 'tetsuya_acoustic_live_tour_2026_ticketboard_osaka',
                      'tourId': 'tetsuya_acoustic_live_tour_2026_billboard',
                      'type': 'ticket board特別受付（先着）',
                      'entryStartAt': '2026-08-22T10:00:00+09:00',
                      'entryEndAt': '2026-09-03T23:59:00+09:00',
                      'resultAt': None,
                      'paymentStartAt': None,
                      'paymentEndAt': None,
                      'performanceIds': [
                          'tetsuya_acoustic_live_tour_2026_osaka_0905_1st',
                          'tetsuya_acoustic_live_tour_2026_osaka_0905_2nd'
                      ],
                      'source': 'system',
                      'sourceUrl': 'https://www.tetsuya.uk.com/contents/1103174',
                      'lastVerifiedAt': VERIFIED
                  },
                  {
                      'id': 'tetsuya_acoustic_live_tour_2026_taipei_general',
                      'tourId': 'tetsuya_acoustic_live_tour_2026_billboard',
                      'type': '台北公演 一般発売（先着）',
                      'entryStartAt': '2026-08-07T18:00:00+08:00',
                      'entryEndAt': None,
                      'resultAt': None,
                      'paymentStartAt': None,
                      'paymentEndAt': None,
                      'performanceIds': [
                          'tetsuya_acoustic_live_tour_2026_taipei_0912_1st',
                          'tetsuya_acoustic_live_tour_2026_taipei_0912_2nd'
                      ],
                      'source': 'system',
                      'sourceUrl': 'https://www.tetsuya.uk.com/contents/1099026',
                      'lastVerifiedAt': VERIFIED
                  }
              ],
              'appleMusicTracks': []
          }
          tetsuya_path = DATA / 'artist' / 'tetsuya.json'
          dump(tetsuya_path, tetsuya)

          relations_path = DATA / 'artist_relations.json'
          relations = json.loads(relations_path.read_text(encoding='utf-8'))
          if not any(r.get('id') == 'larc_en_ciel__tetsuya' for r in relations.get('relations', [])):
              relations.setdefault('relations', []).append({
                  'id': 'larc_en_ciel__tetsuya',
                  'type': 'independent_solo',
                  'artistIds': ['larc_en_ciel', 'tetsuya'],
                  'approvedByUser': True,
                  'note': 'L\'Arc~en~CielとTETSUYAソロは別Artistとして扱い、親グループへdelivery materializeしない。'
              })
          dump(relations_path, relations)

          # Structural checks before manifest update.
          ids = [a.get('id') for a in artists]
          assert len(ids) == len(set(ids)), 'duplicate artist ids'
          assert 'larc_en_ciel' in ids and 'tetsuya' in ids
          assert tetsuya['artistId'] == 'tetsuya'
          tour_ids = {t['id'] for t in tetsuya['tours']}
          perf_ids = {p['id'] for p in tetsuya['performances']}
          assert all(p['tourId'] in tour_ids for p in tetsuya['performances'])
          assert all(l['tourId'] in tour_ids for l in tetsuya['lotteries'])
          assert all(pid in perf_ids for l in tetsuya['lotteries'] for pid in l.get('performanceIds', []))
          assert any(r.get('type') == 'independent_solo' and set(r.get('artistIds', [])) == {'larc_en_ciel', 'tetsuya'} for r in relations['relations'])

          manifest_path = DATA / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = int(manifest.get('version', 0)) + 1
          manifest['updatedAt'] = VERIFIED
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = sha16(artists_path)
          manifest.setdefault('artists', {})['tetsuya'] = {'hash': sha16(tetsuya_path)}
          dump(manifest_path, manifest)

          # Verify stored hashes against written bytes.
          manifest2 = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest2['files']['artists']['hash'] == sha16(artists_path)
          assert manifest2['artists']['tetsuya']['hash'] == sha16(tetsuya_path)
          print('TETSUYA Dev materialization checks passed')
          PY
      - name: Commit Dev data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artists.json data/artist/tetsuya.json data/artist_relations.json data/manifest.json
          git diff --cached --check
          git commit -m 'data: add TETSUYA as independent solo Artist'
          git push
