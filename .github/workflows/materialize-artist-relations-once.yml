name: One-shot Artist relation materialization

on:
  push:
    branches:
      - feature/artist-live-relations-20260829

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/artist-live-relations-20260829
          fetch-depth: 0

      - name: Verify clean start
        run: test -z "$(git status --short)"

      - name: Materialize approved relations and update manifest
        run: python3 tools/materialize_artist_live_relations_once.py

      - name: Guard generated paths
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated diff:"
          git status --short
          unexpected=$(git status --short | grep -vE 'data/artist/(oishi_masayoshi|masayoshi_oishi)\.json|data/manifest\.json' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated paths:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit generated data and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artist/oishi_masayoshi.json data/artist/masayoshi_oishi.json data/manifest.json
          git rm tools/materialize_artist_live_relations_once.py .github/workflows/materialize-artist-relations-once.yml
          git commit -m "data: materialize approved artist live relations"
          git push origin HEAD:feature/artist-live-relations-20260829
