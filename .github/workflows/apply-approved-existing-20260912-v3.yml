name: Apply weekly approved existing-event updates 20260912 v3

on:
  push:
    branches:
      - audit/rescue-missing-performances-20260912
    paths:
      - '.github/workflows/apply-approved-existing-20260912-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rescue-missing-performances-20260912
          fetch-depth: 0
      - name: Apply approved existing-event changes with date disambiguation
        run: |
          python3 - <<'PY'
          import re, textwrap
          from pathlib import Path
          src=Path('.github/workflows/apply-approved-existing-20260912-v2.yml').read_text()
          m=re.search(r"python3 - <<'PY'\n(.*?)\n\s*PY\n", src, re.S)
          if not m: raise SystemExit('embedded apply script not found')
          script=textwrap.dedent(m.group(1))
          old="""def simple(aid,token,dates,lid,typ,start,end,url,result=None,pay_start=None,pay_end=None):
    p,d=load(aid); t=tour_for(d,token); ps=perf_dates(d,dates,t['id']); add(d,lid,t['id'],typ,start,end,[x['id'] for x in ps],url,result,pay_start,pay_end); save(p,d)
"""
          new="""def simple(aid,token,dates,lid,typ,start,end,url,result=None,pay_start=None,pay_end=None):
    p,d=load(aid)
    tm=tourmap(d)
    ps=[]
    for date in dates:
        ms=[x for x in d.get('performances',[]) if (x.get('performanceAt') or '').startswith(date) and token.lower() in (tm.get(x.get('tourId'),{}).get('title') or '').lower()]
        if not ms: raise SystemExit(f'performance+tour missing {aid} {date} token={token}')
        ps.extend(ms)
    tids={x['tourId'] for x in ps}
    if len(tids)!=1: raise SystemExit(f'ambiguous performance tour {aid} {dates} token={token} tids={tids}')
    tid=next(iter(tids)); add(d,lid,tid,typ,start,end,[x['id'] for x in ps],url,result,pay_start,pay_end); save(p,d)
"""
          if old not in script: raise SystemExit('simple function pattern not found')
          script=script.replace(old,new)
          exec(compile(script,'approved-existing-v3','exec'),{})
          PY
      - name: Materialize relations
        run: python3 tools/materialize_artist_live_relations.py
      - name: Update manifest
        run: python3 tools/update_manifest.py
      - name: Validate
        run: python3 tools/validate.py
      - name: Commit approved batch
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artist/04_limited_sazabys.json data/artist/10_feet.json data/artist/ado.json data/artist/ae_group.json data/artist/bump_of_chicken.json data/artist/candy_tune.json data/artist/equal_love.json data/artist/frederic.json data/artist/hana.json data/artist/hinatazaka46.json data/artist/idolish7.json data/artist/illit.json data/artist/jo1.json data/artist/kroi.json data/artist/miura_daichi.json data/artist/monaki.json data/artist/mr_children.json data/artist/niziu.json data/artist/novelbright.json data/artist/xg.json data/artist/yoasobi.json data/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'update: apply weekly approved ticket updates batch 1'
          git push origin HEAD:audit/rescue-missing-performances-20260912
