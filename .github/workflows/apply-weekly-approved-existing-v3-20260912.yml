name: Apply weekly approved existing data v3 20260912
on:
  push:
    branches: [audit/rescue-missing-performances-20260912]
    paths: ['.github/workflows/apply-weekly-approved-existing-v3-20260912.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "b8366378b4f828cf27ae3b5f80d3c6945aff4710"
          test -z "$(git status --short)"
      - name: Reuse guarded transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/apply-weekly-approved-existing-20260912.yml').read_text(encoding='utf-8')
          section=text.split('      - name: Apply approved existing-event updates\n',1)[1].split('      - name: Materialize, manifest, validate\n',1)[0]
          start=section.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=section.rindex("          PY\n")
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in section[start:end].splitlines())+'\n'
          exec(compile(code,'weekly-approved-existing.py','exec'),{})
          PY
      - name: Update manifest canonically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          data=Path('data'); mp=data/'manifest.json'; m=json.loads(mp.read_text(encoding='utf-8'))
          h=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()[:16]
          m['version']=int(m.get('version',0))+1
          m['updatedAt']=datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          m.setdefault('files',{}).setdefault('artists',{})['hash']=h(data/'artists.json')
          hashes={p.stem:h(p) for p in sorted((data/'artist').glob('*.json'))}; ma=m.setdefault('artists',{})
          for aid,v in hashes.items(): ma.setdefault(aid,{})['hash']=v
          for aid in list(ma):
              if aid not in hashes: del ma[aid]
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('manifest version',m['version'])
          PY
      - name: Validate changed data and hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          root=Path('data'); m=json.loads((root/'manifest.json').read_text()); h=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()[:16]
          assert m['files']['artists']['hash']==h(root/'artists.json')
          changed=[]
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              path=line[3:]
              if path.startswith('data/artist/') and path.endswith('.json'): changed.append(Path(path))
          assert changed, 'no changed artist files'
          for p in changed:
              d=json.loads(p.read_text(encoding='utf-8')); assert d['artistId']==p.stem
              tids=[x['id'] for x in d.get('tours',[])]; pids=[x['id'] for x in d.get('performances',[])]; lids=[x['id'] for x in d.get('lotteries',[])]
              assert len(tids)==len(set(tids)); assert len(pids)==len(set(pids)); assert len(lids)==len(set(lids))
              tset=set(tids); pset=set(pids)
              for x in d.get('performances',[]): assert x['tourId'] in tset, (p,x['id'])
              for x in d.get('lotteries',[]):
                  assert x['tourId'] in tset, (p,x['id'],'bad tour')
                  assert set(x.get('performanceIds') or []) <= pset, (p,x['id'],'bad perf ids')
              assert m['artists'][p.stem]['hash']==h(p)
          print('changed data/hash OK',len(changed))
          PY
      - name: Commit intended data only
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          allowed='^(data/artist/(hinatazaka46|vaundy|hana|sakurazaka46|bump_of_chicken|ae_group|novelbright|monaki|04_limited_sazabys|frederic|10_feet|kroi|miura_daichi|enhypen|illit|candy_tune|niziu|ado|equal_love|mr_children|yoasobi|idolish7|xg)\.json|data/manifest\.json)$'
          bad=$(git status --short | sed 's/^...//' | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then echo "Unexpected diff:"; echo "$bad"; exit 1; fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artist/*.json data/manifest.json
          git commit -m 'update: apply weekly approved existing-event changes'
          git push origin HEAD:audit/rescue-missing-performances-20260912
