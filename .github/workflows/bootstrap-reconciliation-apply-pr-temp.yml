name: Bootstrap reconciliation final audit temp

on:
  pull_request:
    branches:
      - apply/bootstrap-reconciliation-20260823
    paths:
      - '.github/bootstrap-reconciliation-pr-trigger'
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: bootstrap-reconciliation-final-audit-20260823
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apply/bootstrap-reconciliation-20260823
          fetch-depth: 0

      - name: Normalize approved patches and audit applied data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main apply/bootstrap-reconciliation-20260823
          python3 - <<'PY'
          import base64
          import copy
          import gzip
          import hashlib
          import json
          import subprocess
          from collections import Counter, defaultdict
          from pathlib import Path

          BASE = '18df9af321c33080a0559d6d3d6042bcda2153cd'
          if subprocess.check_output(['git','rev-parse','origin/main'], text=True).strip() != BASE:
              raise SystemExit('main moved from audited baseline')

          expected_artists = {
            'ellegarden','ado',
            'hinatazaka46','aimyon','creepy_nuts','vaundy','fujii_kaze',
            'lisa','snow_man','ryokuoushoku_shakai',
            'naniwa_danshi','hey_say_jump','travis_japan','twice','seventeen','sky_hi','tennimu','touken_ranbu_musical','zutomayo','momoiro_clover_z',
            'babymetal','mrs_green_apple','be_first','glay','yuzu',
            'king_and_prince','milk','bump_of_chicken','bz','ae_group','frederic','fruits_zipper',
            'cutie_street','monaki','equal_love','super_beaver','wanima','yabai_tshirts_yasan','10_feet','the_oral_cigarettes','kroi',
            'hitsuji_bungaku','miura_daichi','kurayamisaka','starglow','ini','jo1','imp','mazzel','not_equal_me',
            'boku_aozora','da_ice','bts','stray_kids','ive','aespa','tomorrow_x_together','shinee',
            'sandaime_j_soul_brothers','idolish7','a3','ikimonogakari','and_team','aina_the_end',
            'urashimasakatasen'
          }
          assert len(expected_artists) == 65
          collections = {'tour':'tours','performance':'performances','lottery':'lotteries'}
          expected_delete_ids = {
              'a3_act3_aw2027_tokyo_0101',
              'a3_act3_aw2027_shizuoka_0101',
              'a3_act3_aw2027_kagawa_0101',
              'a3_act3_aw2027_aichi_0101',
              'a3_act3_aw2027_yamaguchi_0101',
              'a3_act3_aw2027_osaka_0101',
          }
          expected_deletes = {('a3','performance',x) for x in expected_delete_ids}

          operations = []
          source_counts = {}
          for rel in [
              '.github/bootstrap-reconciliation-patches/reconcile-01.json',
              '.github/bootstrap-reconciliation-patches/reconcile-02.json',
              '.github/bootstrap-reconciliation-patches/reconcile-03.json',
          ]:
              ops = json.loads(Path(rel).read_text(encoding='utf-8')).get('operations') or []
              source_counts[Path(rel).stem] = len(ops)
              operations.extend(ops)

          parts = sorted(Path('.github/bootstrap-reconciliation-chunks-v2').glob('part-*'))
          if [p.name for p in parts] != [f'part-{i:02d}' for i in range(8)]:
              raise SystemExit(f'unexpected worker chunks: {[p.name for p in parts]}')
          worker = json.loads(gzip.decompress(base64.b64decode(''.join(p.read_text(encoding='ascii').strip() for p in parts))))
          worker_ops = worker.get('operations') or []
          if len(worker_ops) != 970 or len({op.get('artistId') for op in worker_ops}) != 55:
              raise SystemExit('worker payload count/scope mismatch')
          source_counts['worker-04-11'] = len(worker_ops)
          operations.extend(worker_ops)

          # Deterministically normalize every worker schema to apply_agent_patch.py-compatible shape.
          normalized = []
          touched = set()
          by_artist = defaultdict(list)
          action_counts = Counter()
          deletes = set()
          for n, op in enumerate(operations, 1):
              action = op.get('action') or op.get('op')
              artist = op.get('artistId')
              kind = op.get('kind')
              object_id = op.get('id')
              if action not in {'upsert','merge','delete'} or kind not in collections:
                  raise SystemExit(f'operation #{n}: invalid action/kind')
              if not all(isinstance(x,str) and x for x in (artist,object_id)):
                  raise SystemExit(f'operation #{n}: invalid artist/id')
              key = (artist, kind, object_id)
              if key in touched:
                  raise SystemExit(f'cross-worker duplicate target: {key}')
              touched.add(key)
              out = {
                  'action': action,
                  'file': f'data/artist/{artist}.json',
                  'collection': collections[kind],
                  'id': object_id,
              }
              if action == 'upsert':
                  if op.get('expectAbsent') is not True:
                      raise SystemExit(f'upsert without expectAbsent=true: {key}')
                  value = op.get('value')
                  if not isinstance(value,dict) or value.get('id') != object_id:
                      raise SystemExit(f'invalid upsert value: {key}')
                  out['expectAbsent'] = True
                  out['value'] = value
              elif action == 'merge':
                  changes = op.get('changes')
                  if not isinstance(changes,dict) or not changes:
                      raise SystemExit(f'merge without changes: {key}')
                  out['changes'] = changes
              else:
                  if not str(op.get('reason') or '').strip():
                      raise SystemExit(f'delete without reason: {key}')
                  deletes.add(key)
              normalized.append(out)
              by_artist[artist].append(out)
              action_counts[action] += 1

          if len(normalized) != 1058:
              raise SystemExit(f'operation total mismatch: {len(normalized)}')
          if set(by_artist) != expected_artists:
              raise SystemExit(f'artist scope mismatch missing={sorted(expected_artists-set(by_artist))} extra={sorted(set(by_artist)-expected_artists)}')
          if deletes != expected_deletes or action_counts['delete'] != 6:
              raise SystemExit(f'delete allow-list mismatch: {sorted(deletes)}')

          # Reconstruct the expected state from immutable main and require byte-independent JSON equality with apply branch.
          for artist, ops in sorted(by_artist.items()):
              rel = f'data/artist/{artist}.json'
              base_text = subprocess.check_output(['git','show',f'origin/main:{rel}'], text=True)
              expected = json.loads(base_text)
              before_ids = {c:{r.get('id') for r in expected[c] if isinstance(r,dict)} for c in collections.values()}
              for op in ops:
                  rows = expected[op['collection']]
                  matches = [i for i,row in enumerate(rows) if isinstance(row,dict) and row.get('id') == op['id']]
                  if op['action'] == 'upsert':
                      if matches:
                          raise SystemExit(f'upsert target existed in main: {(artist,op["collection"],op["id"])}')
                      rows.append(copy.deepcopy(op['value']))
                  elif op['action'] == 'merge':
                      if len(matches) != 1:
                          raise SystemExit(f'merge target count !=1 in main: {(artist,op["collection"],op["id"])}')
                      row = dict(rows[matches[0]])
                      row.update(op['changes'])
                      rows[matches[0]] = row
                  else:
                      if len(matches) != 1:
                          raise SystemExit(f'delete target count !=1 in main: {(artist,op["collection"],op["id"])}')
                      del rows[matches[0]]

              actual = json.loads(Path(rel).read_text(encoding='utf-8'))
              if actual != expected:
                  raise SystemExit(f'applied data differs from normalized approved patch: {artist}')

              after_ids = {c:{r.get('id') for r in actual[c] if isinstance(r,dict)} for c in collections.values()}
              for c in collections.values():
                  removed = before_ids[c] - after_ids[c]
                  allowed = expected_delete_ids if artist == 'a3' and c == 'performances' else set()
                  if removed != allowed:
                      raise SystemExit(f'unexpected existing ID deletion: {artist}.{c} {sorted(removed)}')
              tour_ids = after_ids['tours']
              perf_ids = after_ids['performances']
              for row in actual['performances']:
                  if row.get('tourId') not in tour_ids:
                      raise SystemExit(f'orphan performance: {artist}.{row.get("id")}')
              for row in actual['lotteries']:
                  if row.get('tourId') not in tour_ids:
                      raise SystemExit(f'orphan lottery tour: {artist}.{row.get("id")}')
                  pids = row.get('performanceIds')
                  if pids is not None and (not isinstance(pids,list) or any(pid not in perf_ids for pid in pids)):
                      raise SystemExit(f'orphan lottery performanceIds: {artist}.{row.get("id")}')

          data_diff = subprocess.check_output(['git','diff','--name-only','origin/main...HEAD','--','data/'], text=True).splitlines()
          expected_data_files = {f'data/artist/{a}.json' for a in expected_artists} | {'data/manifest.json'}
          if set(data_diff) != expected_data_files:
              raise SystemExit(f'unexpected data diff files missing={sorted(expected_data_files-set(data_diff))} extra={sorted(set(data_diff)-expected_data_files)}')
          if 'data/artists.json' in data_diff:
              raise SystemExit('data/artists.json changed')

          # Manifest must be exactly one version ahead and all hashes must match current data.
          base_manifest = json.loads(subprocess.check_output(['git','show','origin/main:data/manifest.json'], text=True))
          manifest = json.loads(Path('data/manifest.json').read_text(encoding='utf-8'))
          if manifest.get('version') != int(base_manifest.get('version',0)) + 1:
              raise SystemExit('manifest version mismatch')
          def hash16(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()[:16]
          if manifest.get('files',{}).get('artists',{}).get('hash') != hash16('data/artists.json'):
              raise SystemExit('artists index hash mismatch')
          for artist in expected_artists:
              if manifest.get('artists',{}).get(artist,{}).get('hash') != hash16(f'data/artist/{artist}.json'):
                  raise SystemExit(f'manifest artist hash mismatch: {artist}')

          # High-risk centrally approved invariants.
          a3 = json.loads(Path('data/artist/a3.json').read_text(encoding='utf-8'))
          if expected_delete_ids & {p.get('id') for p in a3['performances']}:
              raise SystemExit('A3 approved delete IDs still exist')
          null_date_tours = [t for t in a3['tours'] if t.get('startDate') is None and t.get('endDate') is None and ('2027' in str(t.get('title')) or 'ACT3' in str(t.get('title')).upper())]
          if not null_date_tours:
              raise SystemExit('A3 2027 tour with nulled unsupported dates not retained')
          bloom_dates = {str(p.get('performanceAt',''))[:10] for p in a3['performances'] if '2027-04-0' in str(p.get('performanceAt',''))}
          if not {'2027-04-03','2027-04-04'} <= bloom_dates:
              raise SystemExit('A3 FULL BLOOMING LIVE 2027-04-03/04 not retained')

          def find_ops(artist, needle):
              needle = needle.lower()
              return [op for op in normalized if f'/artist/{artist}.json' in op['file'] and needle in json.dumps(op,ensure_ascii=False).lower()]

          sky = find_ops('sky_hi','viva la rock')
          if not any(str(op.get('value',{}).get('performanceAt',''))[11:16] == '11:00' for op in sky):
              raise SystemExit('SKY-HI VIVA LA ROCK festival START invariant missing')
          ztm = find_ops('zutomayo','fuji rock')
          if not any(str(op.get('value',{}).get('performanceAt',''))[11:16] == '12:00' for op in ztm):
              raise SystemExit('zutomayo FUJI ROCK provisional 12:00 invariant missing')
          venezia = find_ops('glay','venezia') + find_ops('glay','dreamy')
          venezia_times = sorted({op.get('value',{}).get('performanceAt') for op in venezia if op.get('value',{}).get('performanceAt')})
          if not venezia_times or any(str(x).endswith('+09:00') for x in venezia_times):
              raise SystemExit(f'GLAY VENEZIA local-offset invariant failed: {venezia_times}')

          summary = {
              'sourceMainCommit': BASE,
              'artistCount': len(by_artist),
              'operationCount': len(normalized),
              'actionCounts': dict(sorted(action_counts.items())),
              'sourceOperationCounts': source_counts,
              'deleteIds': sorted(expected_delete_ids),
              'changedDataFiles': len(data_diff),
              'glayVeneziaPerformanceAt': venezia_times,
              'normalizedSchema': ['action','file','collection','id','expectAbsent/value OR changes'],
          }
          print('FINAL_AUDIT_SUMMARY=' + json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY

          git diff --check origin/main...HEAD -- data/
          test -z "$(git diff --name-only origin/main...HEAD -- data/artists.json)"
