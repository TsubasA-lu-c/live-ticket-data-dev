name: equal-love-9th-general-presale

on:
  push:
    branches:
      - chore/equal-love-9th-general-presale-20260904

permissions:
  contents: write

jobs:
  update-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/equal-love-9th-general-presale-20260904
          fetch-depth: 0

      - name: Update equal_love data and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          verified_at = "2026-09-04T19:51:00+09:00"
          source_url = "https://equal-love.jp/news/detail/11912"
          artist_path = Path("data/artist/equal_love.json")
          manifest_path = Path("data/manifest.json")

          data = json.loads(artist_path.read_text(encoding="utf-8"))
          performance_ids = [
              "equal_love_9th_anniversary_2026_toyota_1015",
              "equal_love_9th_anniversary_2026_toyota_1016",
          ]
          lottery = {
              "id": "equal_love_9th_anniversary_2026_general_presale",
              "tourId": "equal_love_9th_anniversary_2026",
              "type": "一般先行（抽選）",
              "entryStartAt": "2026-09-04T18:00:00+09:00",
              "entryEndAt": "2026-09-13T23:59:00+09:00",
              "resultAt": None,
              "paymentStartAt": None,
              "paymentEndAt": None,
              "performanceIds": performance_ids,
              "source": "system",
              "sourceUrl": source_url,
              "lastVerifiedAt": verified_at,
          }

          if not any(t.get("id") == lottery["tourId"] for t in data.get("tours", [])):
              raise SystemExit("target tour missing")
          existing_performances = {p.get("id") for p in data.get("performances", [])}
          missing = [pid for pid in performance_ids if pid not in existing_performances]
          if missing:
              raise SystemExit(f"target performances missing: {missing}")

          lotteries = data.setdefault("lotteries", [])
          existing_index = next((i for i, item in enumerate(lotteries) if item.get("id") == lottery["id"]), None)
          if existing_index is not None:
              lotteries[existing_index] = lottery
          else:
              insert_at = next((i + 1 for i, item in enumerate(lotteries) if item.get("id") == "equal_love_9th_anniversary_2026_fc_2nd"), len(lotteries))
              lotteries.insert(insert_at, lottery)

          for key in ("tours", "performances", "lotteries"):
              ids = [item.get("id") for item in data.get(key, [])]
              if len(ids) != len(set(ids)):
                  raise SystemExit(f"duplicate ids in {key}")
          tour_ids = {item["id"] for item in data.get("tours", [])}
          performance_ids_all = {item["id"] for item in data.get("performances", [])}
          for item in data.get("lotteries", []):
              if item.get("tourId") not in tour_ids:
                  raise SystemExit(f"missing tour ref: {item.get('id')}")
              for pid in item.get("performanceIds", []):
                  if pid not in performance_ids_all:
                      raise SystemExit(f"missing performance ref: {item.get('id')} -> {pid}")

          artist_text = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          artist_path.write_text(artist_text, encoding="utf-8")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = int(manifest.get("version", 0)) + 1
          manifest["updatedAt"] = verified_at
          manifest.setdefault("artists", {}).setdefault("equal_love", {})["hash"] = hashlib.sha256(artist_text.encode("utf-8")).hexdigest()[:16]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          check = json.loads(artist_path.read_text(encoding="utf-8"))
          matches = [x for x in check.get("lotteries", []) if x.get("id") == lottery["id"]]
          if len(matches) != 1 or matches[0] != lottery:
              raise SystemExit("lottery verification failed")
          print("equal_love lottery update validated")
          PY

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artist/equal_love.json data/manifest.json
          git diff --cached --check
          git commit -m "data: add =LOVE 9th anniversary general presale"
          git push origin HEAD:chore/equal-love-9th-general-presale-20260904
