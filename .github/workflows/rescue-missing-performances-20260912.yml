name: Rescue missing performances 20260912
on:
  push:
    branches: ['audit/rescue-missing-performances-20260912']
    paths: ['.github/workflows/rescue-missing-performances-20260912.yml']
permissions:
  contents: write
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Add independently verified missing performances
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone,timedelta
          from pathlib import Path

          root=Path('.')
          data=root/'data'
          verified='2026-09-12T00:00:00+09:00'

          def load(aid):
              p=data/'artist'/f'{aid}.json'
              return p,json.loads(p.read_text())
          def save(p,d):
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          def add_tour(d,row):
              ids={x['id'] for x in d.get('tours',[])}
              if row['id'] not in ids:d.setdefault('tours',[]).append(row)
          def add_perf(d,row):
              ids={x['id'] for x in d.get('performances',[])}
              if row['id'] not in ids:d.setdefault('performances',[]).append(row)

          # Creepy Nuts — official RIJF event source confirms 2026-09-12 at Soga.
          p,d=load('creepy_nuts')
          tid='creepy_nuts_rock_in_japan_festival_2026'
          add_tour(d,{
            'id':tid,'artistId':'creepy_nuts','title':'ROCK IN JAPAN FESTIVAL 2026',
            'startDate':'2026-09-12T00:00:00+09:00','endDate':'2026-09-12T00:00:00+09:00',
            'prices':None,'source':'system','sourceUrl':'https://rijfes.jp/2026/timetable/','lastVerifiedAt':verified})
          add_perf(d,{
            'id':tid+'_0912','tourId':tid,'venue':'千葉市蘇我スポーツ公園',
            'performanceAt':'2026-09-12T12:00:00+09:00','performanceDate':'2026-09-12',
            'performanceTimeEstimated':True,'doorOpenAt':None,'kind':'fes','eventName':'ROCK IN JAPAN FESTIVAL 2026',
            'source':'system','sourceUrl':'https://rijfes.jp/2026/timetable/','lastVerifiedAt':verified})
          save(p,d)

          # 10-FEET — official artist LIVE/NEWS plus official ticket source.
          p,d=load('10_feet')
          tid='10_feet_fad30_261014_2026'
          add_tour(d,{
            'id':tid,'artistId':'10_feet','title':'F.A.D30周年シリーズ “261014”',
            'startDate':'2026-10-14T00:00:00+09:00','endDate':'2026-10-14T00:00:00+09:00',
            'prices':None,'source':'system','sourceUrl':'https://10-feet.kyoto/contents/1101856','lastVerifiedAt':verified})
          add_perf(d,{
            'id':tid+'_yokohama_1014','tourId':tid,'venue':'F.A.D YOKOHAMA',
            'performanceAt':'2026-10-14T19:00:00+09:00','doorOpenAt':'2026-10-14T18:15:00+09:00',
            'kind':'taiban','eventName':'F.A.D30周年シリーズ “261014” 10-FEET / STOMPIN’ BIRD',
            'source':'system','sourceUrl':'https://eplus.jp/sf/detail/4581460001-P0030001P021001?P6=001','lastVerifiedAt':verified})

          tid='10_feet_kishidan_banpaku_2026'
          add_tour(d,{
            'id':tid,'artistId':'10_feet','title':'氣志團万博2026 ～房総爆音リゾート～',
            'startDate':'2026-11-08T00:00:00+09:00','endDate':'2026-11-08T00:00:00+09:00',
            'prices':None,'source':'system','sourceUrl':'https://10-feet.kyoto/contents/1087996','lastVerifiedAt':verified})
          add_perf(d,{
            'id':tid+'_makuhari_1108','tourId':tid,'venue':'幕張メッセ国際展示場4～7ホール',
            'performanceAt':'2026-11-08T12:00:00+09:00','performanceDate':'2026-11-08',
            'performanceTimeEstimated':True,'doorOpenAt':None,'kind':'fes','eventName':'氣志團万博2026 ～房総爆音リゾート～',
            'source':'system','sourceUrl':'https://10-feet.kyoto/contents/1087996','lastVerifiedAt':verified})
          save(p,d)

          # 緑黄色社会 — official event site lists the artist on 12/12; stage time not announced in text.
          p,d=load('ryokuoushoku_shakai')
          tid='ryokuoushoku_shakai_musubi_no_yumebanchi_2026'
          add_tour(d,{
            'id':tid,'artistId':'ryokuoushoku_shakai','title':'結びの夢番地2026',
            'startDate':'2026-12-12T00:00:00+09:00','endDate':'2026-12-12T00:00:00+09:00',
            'prices':None,'source':'system','sourceUrl':'https://www.musubinoyumebanchi.jp/','lastVerifiedAt':verified})
          add_perf(d,{
            'id':tid+'_fukuyama_1212','tourId':tid,'venue':'広島県立ふくやま産業交流館 ビッグ・ローズ',
            'performanceAt':'2026-12-12T12:00:00+09:00','performanceDate':'2026-12-12',
            'performanceTimeEstimated':True,'doorOpenAt':None,'kind':'fes','eventName':'結びの夢番地2026',
            'source':'system','sourceUrl':'https://www.musubinoyumebanchi.jp/','lastVerifiedAt':verified})
          save(p,d)

          # Rebuild manifest exactly like collector/tools/update_manifest.py.
          manifest_path=data/'manifest.json'
          manifest=json.loads(manifest_path.read_text())
          def h16(path):return hashlib.sha256(path.read_bytes()).hexdigest()[:16]
          manifest['version']=int(manifest.get('version',0))+1
          JST=timezone(timedelta(hours=9))
          manifest['updatedAt']=datetime.now(JST).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          manifest.setdefault('files',{}).setdefault('artists',{})['hash']=h16(data/'artists.json')
          hashes={p.stem:h16(p) for p in sorted((data/'artist').glob('*.json'))}
          manifest.setdefault('artists',{})
          for aid,h in hashes.items():manifest['artists'].setdefault(aid,{})['hash']=h
          for aid in list(manifest['artists']):
              if aid not in hashes:del manifest['artists'][aid]
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Sanity check exact intended changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          checks={
            'creepy_nuts':['creepy_nuts_rock_in_japan_festival_2026_0912'],
            '10_feet':['10_feet_fad30_261014_2026_yokohama_1014','10_feet_kishidan_banpaku_2026_makuhari_1108'],
            'ryokuoushoku_shakai':['ryokuoushoku_shakai_musubi_no_yumebanchi_2026_fukuyama_1212'],
          }
          for aid,ids in checks.items():
            d=json.load(open(f'data/artist/{aid}.json'))
            got={x['id'] for x in d['performances']}
            assert all(x in got for x in ids),(aid,ids-got)
          m=json.load(open('data/manifest.json')); assert m['version']==203,m['version']
          print('rescue sanity: PASS')
          PY
          changed=$(git status --short | awk '{print $2}' | sort)
          printf '%s\n' "$changed"
          expected=$(printf '%s\n' data/artist/10_feet.json data/artist/creepy_nuts.json data/artist/ryokuoushoku_shakai.json data/manifest.json | sort)
          test "$changed" = "$expected"
      - name: Commit rescue data only
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/artist/10_feet.json data/artist/creepy_nuts.json data/artist/ryokuoushoku_shakai.json data/manifest.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: rescue verified missing performances'
          git push origin HEAD:audit/rescue-missing-performances-20260912
