name: Cleanup audit temp workflows 20260913
on:
  push:
    branches: [audit/rescue-missing-performances-20260912]
    paths: ['.github/workflows/cleanup-audit-temp-workflows-20260913.yml']
permissions:
  contents: write
jobs:
