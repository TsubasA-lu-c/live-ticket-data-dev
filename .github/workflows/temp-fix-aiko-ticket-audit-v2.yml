name: Temporary aiko ticket audit remediation v2

on:
  push:
    branches:
      - fix/aiko-ticket-audit-20260829
    paths:
      - '.github/workflows/temp-fix-aiko-ticket-audit-v2.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed aiko lottery remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          detail_path = Path('data/artist/aiko.json')
          manifest_path = Path('data/manifest.json')
          raw = detail_path.read_text(encoding='utf-8')
          doc = json.loads(raw)
          apple_before = json.dumps(doc.get('appleMusicTracks'), ensure_ascii=False, sort_keys=True)
          verified = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%dT%H:%M:%S+09:00')

          rename = {
            'aiko_llp26_baby_peenats_main':'aiko_llp26_2026_2027_baby_peenats_main',
            'aiko_llp26_team_aiko_main':'aiko_llp26_2026_2027_team_aiko_main',
            'aiko_llp26_official_main':'aiko_llp26_2026_2027_official_main',
            'aiko_llp26_official_overseas_main':'aiko_llp26_2026_2027_official_overseas_main',
            'aiko_llp26_official_2nd_main':'aiko_llp26_2026_2027_official_2nd_main',
            'aiko_llp26_baby_peenats_added':'aiko_llp26_2026_2027_baby_peenats_added',
            'aiko_llp26_album17_added':'aiko_llp26_2026_2027_album17_added',
            'aiko_llp26_official_final_main':'aiko_llp26_2026_2027_official_final_main',
            'aiko_llp26_team_aiko_added':'aiko_llp26_2026_2027_team_aiko_added',
            'aiko_llp26_official_added':'aiko_llp26_2026_2027_official_added',
            'aiko_llp26_official_overseas_added':'aiko_llp26_2026_2027_official_overseas_added',
          }

          # New IDs were introduced only in this artist file; refuse rename if data files gained external refs.
          for old in rename:
              refs=[]
              for p in Path('data').rglob('*.json'):
                  if p == detail_path: continue
                  if old in p.read_text(encoding='utf-8'): refs.append(str(p))
              if refs: raise SystemExit(f'external data refs prevent rename {old}: {refs}')

          sources = {
            'aiko_llp25_2026_baby_peenats_front':'https://www.aiko.com/live/?id=33',
            'aiko_llp25_2026_team_aiko_front':'https://www.aiko.com/live/?id=33',
            'aiko_llp25_2026_official_front':'https://www.aiko.com/live/?id=33',
            'aiko_llp25_2026_official_overseas_front':'https://www.aiko.com/live/?id=33',
            'aiko_llp25_2026_general_front':'https://www.aiko.com/live/?id=33',
            'aiko_llp25_2026_baby_peenats_back':'https://www.aiko.com/live/?id=33',
            'aiko_llp25_2026_team_aiko_back':'https://www.aiko.com/live/?id=33',
            'aiko_llp25_2026_official_back':'https://www.aiko.com/live/?id=33',
            'aiko_llp25_2026_official_overseas_back':'https://www.aiko.com/live/?id=33',
            'aiko_llp25_2026_general_back':'https://www.aiko.com/live/?id=33',
            'aiko_llp26_baby_peenats_main':'https://www.aiko.com/topics/?id=7991',
            'aiko_llp26_team_aiko_main':'https://www.aiko.com/topics/?id=7991',
            'aiko_llp26_official_main':'https://www.aiko.com/topics/?id=8010',
            'aiko_llp26_official_overseas_main':'https://www.aiko.com/topics/?id=8010',
            'aiko_llp26_official_2nd_main':'https://eplus.jp/sf/detail/0005810001',
            'aiko_llp26_baby_peenats_added':'https://www.aiko.com/topics/?id=8018',
            'aiko_llp26_album17_added':'https://www.aiko.com/topics/?id=8013',
            'aiko_llp26_official_final_main':'https://www.aiko.com/topics/?id=8018',
            'aiko_llp26_team_aiko_added':'https://www.aiko.com/topics/?id=8018',
            'aiko_llp26_official_added':'https://www.aiko.com/topics/?id=8018',
            'aiko_llp26_official_overseas_added':'https://www.aiko.com/topics/?id=8018',
          }

          touched=set()
          for lot in doc['lotteries']:
              old=lot['id']
              if old in sources:
                  lot['sourceUrl']=sources[old]; lot['lastVerifiedAt']=verified; touched.add(old)
              if old in rename: lot['id']=rename[old]
          missing=set(sources)-touched
          if missing: raise SystemExit(f'missing existing lotteries: {sorted(missing)}')

          def lot(id,tourId,type,start,end,pids,url):
              return {'id':id,'tourId':tourId,'type':type,'entryStartAt':start,'entryEndAt':end,'resultAt':None,'paymentStartAt':None,'paymentEndAt':None,'performanceIds':pids,'source':'system','sourceUrl':url,'lastVerifiedAt':verified}

          doc['lotteries'].extend([
            lot('aiko_llp25_2026_sfp_web_hamamatsu','aiko_llp25_2026','SFP WEB会員受付（浜松公演）','2025-10-03T10:00:00+09:00','2025-10-06T23:59:00+09:00',['aiko_llp25_2026_hamamatsu_0121'],'https://www.sundayfolk.com/liveinfo/524bniy/'),
            lot('aiko_llp25_2026_sfp_web_nagoya','aiko_llp25_2026','SFP WEB会員受付（愛知公演）','2025-12-19T10:00:00+09:00','2025-12-22T23:59:00+09:00',['aiko_llp25_2026_nagoya_0423','aiko_llp25_2026_nagoya_0424'],'https://www.sundayfolk.com/liveinfo/52ger3u/'),
            lot('aiko_llp25_2026_candy_room','aiko_llp25_2026','CANDY ROOM会員先行（広島・米子公演）','2025-10-04T12:00:00+09:00','2025-10-13T23:59:00+09:00',['aiko_llp25_2026_hiroshima_0124','aiko_llp25_2026_hiroshima_0125','aiko_llp25_2026_yonago_0405'],'https://fan.pia.jp/candy/ticket/detail/626/'),
            lot('aiko_llp26_2026_2027_eplus_preorder_aichi','aiko_llp26_2026_2027','イープラス プレオーダー（愛知公演）','2026-08-26T12:00:00+09:00','2026-09-06T23:59:00+09:00',['aiko_llp26_2026_2027_nagoya_1202','aiko_llp26_2026_2027_nagoya_1203'],'https://eplus.jp/sf/detail/0005810001'),
            lot('aiko_llp26_2026_2027_pia_prereserve_aichi','aiko_llp26_2026_2027','チケットぴあ プレリザーブ（愛知公演）','2026-08-26T12:00:00+09:00','2026-09-06T23:59:00+09:00',['aiko_llp26_2026_2027_nagoya_1202','aiko_llp26_2026_2027_nagoya_1203'],'https://t.pia.jp/pia/artist/artists.do?artistsCd=11013184'),
          ])

          if len(doc['lotteries']) != 26: raise SystemExit(f"expected 26 lotteries, got {len(doc['lotteries'])}")
          pids={p['id'] for p in doc['performances']}; seen=set()
          for x in doc['lotteries']:
              if x['id'] in seen: raise SystemExit(f"duplicate lottery id {x['id']}")
              seen.add(x['id'])
              if not x['id'].startswith(x['tourId']+'_'): raise SystemExit(f"bad lottery id prefix {x['id']}")
              for pid in x.get('performanceIds') or []:
                  if pid not in pids: raise SystemExit(f"broken performance ref {pid}")

          start='  "lotteries": [\n'; end='\n  ],\n  "appleMusicTracks": ['
          if raw.count(start)!=1 or raw.count(end)!=1: raise SystemExit('unexpected aiko.json section markers')
          prefix,rest=raw.split(start,1); _,suffix=rest.split(end,1)
          body='\n'.join('    '+json.dumps(x,ensure_ascii=False,separators=(',',':'))+(',' if i<len(doc['lotteries'])-1 else '') for i,x in enumerate(doc['lotteries']))
          new_raw=prefix+start+body+end+suffix
          parsed=json.loads(new_raw)
          if json.dumps(parsed.get('appleMusicTracks'),ensure_ascii=False,sort_keys=True)!=apple_before: raise SystemExit('Apple Music changed unexpectedly')
          detail_path.write_text(new_raw,encoding='utf-8')

          def h16(p): return hashlib.sha256(p.read_bytes()).hexdigest()[:16]
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version']=int(manifest.get('version',0))+1; manifest['updatedAt']=verified
          manifest.setdefault('artists',{}).setdefault('aiko',{})['hash']=h16(detail_path)
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'lotteryCount':26,'appleMusicUnchanged':True,'renamed':len(rename),'added':5,'manifestVersion':manifest['version']},ensure_ascii=False))
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' data/artist/aiko.json data/manifest.json | sort)"
          test "$changed" = "$expected" || { echo 'Unexpected diff:'; echo "$changed"; exit 1; }
          git status --short
          git diff --stat
      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artist/aiko.json data/manifest.json
          git commit -m 'data: remediate aiko ticket coverage'
          git push origin HEAD:fix/aiko-ticket-audit-20260829
