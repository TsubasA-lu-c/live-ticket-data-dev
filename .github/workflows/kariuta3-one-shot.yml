name: Kariuta III one-shot update

on:
  push:
    branches:
      - chatgpt/kariuta3-update-20260829

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Patch and validate Kariuta III data
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import copy, hashlib, json
          from pathlib import Path

          VERIFIED = "2026-08-29T20:17:00+09:00"
          O = "oishi_masayoshi"
          M = "masayoshi_oishi"
          data = Path("data")
          adir = data / "artist"

          def read(p):
              return json.loads(p.read_text(encoding="utf-8"))

          def write(p, v):
              p.write_text(json.dumps(v, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          def by_id(items, iid):
              return next(x for x in items if x["id"] == iid)

          docs = {O: read(adir/f"{O}.json"), M: read(adir/f"{M}.json")}
          orig_tracks = {k: copy.deepcopy(v.get("appleMusicTracks", [])) for k,v in docs.items()}

          pairs = [
              ("oishi_masayoshi_kariuta3_kanagawa_0830", "masayoshi_oishi__rel__oishi_masayoshi_kariuta3_kanagawa_0830"),
              ("oishi_masayoshi_kariuta3_okayama_0905", "masayoshi_oishi__rel__oishi_masayoshi_kariuta3_okayama_0905"),
              ("oishi_masayoshi_kariuta3_aichi_0919", "masayoshi_oishi__rel__oishi_masayoshi_kariuta3_aichi_0919"),
          ]
          for oid, mid in pairs:
              by_id(docs[O]["tours"], oid)["lastVerifiedAt"] = VERIFIED
              by_id(docs[M]["tours"], mid)["lastVerifiedAt"] = VERIFIED

          for oid, mid in [
              ("oishi_masayoshi_kariuta3_kanagawa_0830_20260830", "masayoshi_oishi__rel__oishi_masayoshi_kariuta3_kanagawa_0830_20260830"),
              ("oishi_masayoshi_kariuta3_okayama_0905_20260905", "masayoshi_oishi__rel__oishi_masayoshi_kariuta3_okayama_0905_20260905"),
              ("oishi_masayoshi_kariuta3_aichi_0919_20260919", "masayoshi_oishi__rel__oishi_masayoshi_kariuta3_aichi_0919_20260919"),
          ]:
              by_id(docs[O]["performances"], oid)["lastVerifiedAt"] = VERIFIED
              by_id(docs[M]["performances"], mid)["lastVerifiedAt"] = VERIFIED

          for aid, tid, pid in [
              (O, "oishi_masayoshi_kariuta3_kanagawa_0830", "oishi_masayoshi_kariuta3_kanagawa_0830_20260830"),
              (M, "masayoshi_oishi__rel__oishi_masayoshi_kariuta3_kanagawa_0830", "masayoshi_oishi__rel__oishi_masayoshi_kariuta3_kanagawa_0830_20260830"),
          ]:
              t = by_id(docs[aid]["tours"], tid)
              p = by_id(docs[aid]["performances"], pid)
              t["sourceUrl"] = "https://www.014014.jp/schedules/7689"
              p["venue"] = "アリオ橋本 1Fグランドガーデン"
              p["performanceAt"] = "2026-08-30T14:00:00+09:00"
              p.pop("performanceDate", None)
              p["sourceUrl"] = "https://www.014014.jp/schedules/7689"

          lots = [
              {
                  "id": "oishi_masayoshi_kariuta3_kanagawa_0830_cd_purchase",
                  "tourId": "oishi_masayoshi_kariuta3_kanagawa_0830",
                  "type": "CD購入整理券（抽選・終了）",
                  "entryStartAt": None,
                  "entryEndAt": "2026-08-16T23:59:00+09:00",
                  "resultAt": "2026-08-18T18:00:00+09:00",
                  "source": "system",
                  "sourceUrl": "https://hashimoto.ario.jp/event/2400014998/",
                  "lastVerifiedAt": VERIFIED,
                  "performanceIds": ["oishi_masayoshi_kariuta3_kanagawa_0830_20260830"],
              },
              {
                  "id": "oishi_masayoshi_kariuta3_okayama_0905_cd_purchase",
                  "tourId": "oishi_masayoshi_kariuta3_okayama_0905",
                  "type": "CD購入整理券（抽選・終了）",
                  "entryStartAt": None,
                  "entryEndAt": "2026-08-26T23:59:00+09:00",
                  "resultAt": "2026-08-28T18:00:00+09:00",
                  "source": "system",
                  "sourceUrl": "https://www.014014.jp/news/7840",
                  "lastVerifiedAt": VERIFIED,
                  "ticketUrl": "https://ticket.ponycanyon.co.jp/pc/413",
                  "performanceIds": ["oishi_masayoshi_kariuta3_okayama_0905_20260905"],
              },
              {
                  "id": "oishi_masayoshi_kariuta3_aichi_0919_cd_purchase",
                  "tourId": "oishi_masayoshi_kariuta3_aichi_0919",
                  "type": "CD購入整理券（抽選）",
                  "entryStartAt": None,
                  "entryEndAt": "2026-09-02T23:59:00+09:00",
                  "resultAt": "2026-09-04T19:00:00+09:00",
                  "source": "system",
                  "sourceUrl": "https://www.014014.jp/news/7890",
                  "lastVerifiedAt": VERIFIED,
                  "ticketUrl": "https://ticket.ponycanyon.co.jp/pc/416",
                  "performanceIds": ["oishi_masayoshi_kariuta3_aichi_0919_20260919"],
              },
              {
                  "id": "oishi_masayoshi_kariuta3_aichi_0919_club014_area",
                  "tourId": "oishi_masayoshi_kariuta3_aichi_0919",
                  "type": "CLUB014限定エリア（抽選）",
                  "entryStartAt": None,
                  "entryEndAt": "2026-09-02T23:59:00+09:00",
                  "resultAt": "2026-09-04T19:00:00+09:00",
                  "source": "system",
                  "sourceUrl": "https://club014.jp/news/?category_id=101&id=542",
                  "lastVerifiedAt": VERIFIED,
                  "performanceIds": ["oishi_masayoshi_kariuta3_aichi_0919_20260919"],
              },
          ]

          def replace_block(items, new_items, source_artist):
              new_ids = {x["id"] for x in new_items}
              items[:] = [x for x in items if x["id"] not in new_ids]
              idx = next((i for i,x in enumerate(items)
                          if isinstance(x.get("relationMirror"), dict)
                          and x["relationMirror"].get("sourceArtistId") == source_artist), len(items))
              items[idx:idx] = new_items

          replace_block(docs[O]["lotteries"], lots, M)

          mirrors = []
          for lot in lots:
              ml = copy.deepcopy(lot)
              ml["id"] = f"{M}__rel__{lot['id']}"
              ml["tourId"] = f"{M}__rel__{lot['tourId']}"
              ml["performanceIds"] = [f"{M}__rel__{x}" for x in lot["performanceIds"]]
              ml["relationMirror"] = {"sourceArtistId": O, "sourceId": lot["id"]}
              mirrors.append(ml)
          replace_block(docs[M]["lotteries"], mirrors, O)

          errors = []
          global_ids = {"t": set(), "p": set(), "l": set()}
          for aid, doc in docs.items():
              tids = {x["id"] for x in doc["tours"]}
              pmap = {x["id"]: x for x in doc["performances"]}
              lids = {x["id"] for x in doc["lotteries"]}
              if len(tids) != len(doc["tours"]): errors.append(f"{aid}: duplicate tour")
              if len(pmap) != len(doc["performances"]): errors.append(f"{aid}: duplicate performance")
              if len(lids) != len(doc["lotteries"]): errors.append(f"{aid}: duplicate lottery")
              for t in doc["tours"]:
                  if t["id"] in global_ids["t"]: errors.append(f"global duplicate tour {t['id']}")
                  global_ids["t"].add(t["id"])
                  rd = t.get("relationDisplay")
                  if rd:
                      prefix = "【オーイシマサヨシ】" if rd["sourceArtistId"] == O else "【大石昌良】"
                      if not t["title"].startswith(prefix): errors.append(f"{aid}: bad prefix {t['id']}")
              for p in doc["performances"]:
                  if p["id"] in global_ids["p"]: errors.append(f"global duplicate performance {p['id']}")
                  global_ids["p"].add(p["id"])
                  if p["tourId"] not in tids: errors.append(f"{aid}: bad performance ref {p['id']}")
              for l in doc["lotteries"]:
                  if l["id"] in global_ids["l"]: errors.append(f"global duplicate lottery {l['id']}")
                  global_ids["l"].add(l["id"])
                  if l["tourId"] not in tids: errors.append(f"{aid}: bad lottery tour {l['id']}")
                  for pid in l.get("performanceIds", []):
                      if pid not in pmap or pmap[pid]["tourId"] != l["tourId"]:
                          errors.append(f"{aid}: bad lottery performance {l['id']}->{pid}")
              if doc.get("appleMusicTracks", []) != orig_tracks[aid]:
                  errors.append(f"{aid}: Apple Music tracks changed")

          for lot in lots:
              by_id(docs[O]["lotteries"], lot["id"])
              by_id(docs[M]["lotteries"], f"{M}__rel__{lot['id']}")

          if errors:
              raise SystemExit("\n".join(errors))

          for aid, doc in docs.items():
              write(adir/f"{aid}.json", doc)

          manifest = read(data/"manifest.json")
          manifest["version"] = int(manifest["version"]) + 1
          manifest["updatedAt"] = VERIFIED
          for aid in (O, M):
              manifest["artists"][aid]["hash"] = hashlib.sha256((adir/f"{aid}.json").read_bytes()).hexdigest()[:16]
          write(data/"manifest.json", manifest)

          print("[OK] Kariuta III update")
          print(O, manifest["artists"][O]["hash"])
          print(M, manifest["artists"][M]["hash"])
          print("manifest", manifest["version"])
          PY

          git diff --check
          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artist/oishi_masayoshi.json data/artist/masayoshi_oishi.json data/manifest.json
          git rm .github/workflows/kariuta3-one-shot.yml

          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' .github/workflows/kariuta3-one-shot.yml data/artist/masayoshi_oishi.json data/artist/oishi_masayoshi.json data/manifest.json | sort)"

          git commit -m "update: オーイシマサヨシ「仮歌Ⅲ」フリーライブ情報更新"
          git push origin "HEAD:${GITHUB_REF_NAME}"
