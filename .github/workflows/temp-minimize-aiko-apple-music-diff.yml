name: Temporary minimize aiko Apple Music diff

on:
  push:
    branches:
      - data/aiko-apple-music-20260829
    paths:
      - '.github/workflows/temp-minimize-aiko-apple-music-diff.yml'

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore original formatting and insert only Apple Music tracks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show FETCH_HEAD:data/artist/aiko.json > /tmp/aiko-main.json
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('data/artist/aiko.json')
          original = Path('/tmp/aiko-main.json').read_text(encoding='utf-8')
          tracks = [
            {
              'songId': '1109978628',
              'title': '花火',
              'albumTitle': '桜の木の下',
              'previewUrl': 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/e9/36/ce/e936ce30-e286-3e7c-02d1-f78e358ff227/mzaf_5268480863287538515.plus.aac.ep.m4a',
              'artworkUrl': 'https://is1-ssl.mzstatic.com/image/thumb/Music123/v4/fd/15/d4/fd15d4e4-f556-0581-9fb0-fc6a0328c594/dj.fosphrnf.jpg/{w}x{h}{c}.{f}',
            },
            {
              'songId': '1109973216',
              'title': 'KissHug',
              'albumTitle': 'BABY',
              'previewUrl': 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/59/5c/84/595c846b-7953-568d-195d-67c53cf3d371/mzaf_3007839461467888568.plus.aac.ep.m4a',
              'artworkUrl': 'https://is1-ssl.mzstatic.com/image/thumb/Music113/v4/51/aa/96/51aa96cd-fe54-6ac5-8278-2ba8aada1fce/dj.lwelogmf.jpg/{w}x{h}{c}.{f}',
            },
            {
              'songId': '1109978637',
              'title': 'カブトムシ',
              'albumTitle': '桜の木の下',
              'previewUrl': 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/22/4b/47/224b472c-d307-bcd8-58ec-ba6fe43f2fdc/mzaf_16725470264792600088.plus.aac.ep.m4a',
              'artworkUrl': 'https://is1-ssl.mzstatic.com/image/thumb/Music123/v4/fd/15/d4/fd15d4e4-f556-0581-9fb0-fc6a0328c594/dj.fosphrnf.jpg/{w}x{h}{c}.{f}',
            },
          ]
          marker = '\n  "lastVerifiedAt": '
          idx = original.rfind(marker)
          if idx < 0:
              raise SystemExit('top-level lastVerifiedAt marker not found')
          block = '''
  "appleMusicTracks": [
    {
      "songId": "1109978628",
      "title": "花火",
      "albumTitle": "桜の木の下",
      "previewUrl": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/e9/36/ce/e936ce30-e286-3e7c-02d1-f78e358ff227/mzaf_5268480863287538515.plus.aac.ep.m4a",
      "artworkUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music123/v4/fd/15/d4/fd15d4e4-f556-0581-9fb0-fc6a0328c594/dj.fosphrnf.jpg/{w}x{h}{c}.{f}"
    },
    {
      "songId": "1109973216",
      "title": "KissHug",
      "albumTitle": "BABY",
      "previewUrl": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/59/5c/84/595c846b-7953-568d-195d-67c53cf3d371/mzaf_3007839461467888568.plus.aac.ep.m4a",
      "artworkUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music113/v4/51/aa/96/51aa96cd-fe54-6ac5-8278-2ba8aada1fce/dj.lwelogmf.jpg/{w}x{h}{c}.{f}"
    },
    {
      "songId": "1109978637",
      "title": "カブトムシ",
      "albumTitle": "桜の木の下",
      "previewUrl": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/22/4b/47/224b472c-d307-bcd8-58ec-ba6fe43f2fdc/mzaf_16725470264792600088.plus.aac.ep.m4a",
      "artworkUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music123/v4/fd/15/d4/fd15d4e4-f556-0581-9fb0-fc6a0328c594/dj.fosphrnf.jpg/{w}x{h}{c}.{f}"
    }
  ],'''
          patched = original[:idx] + block + original[idx:]
          parsed = json.loads(patched)
          if parsed.get('artistId') != 'aiko' or parsed.get('appleMusicTracks') != tracks:
              raise SystemExit('minimal aiko Apple Music patch validation failed')
          path.write_text(patched, encoding='utf-8')

          manifest_path = Path('data/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['artists']['aiko']['hash'] = hashlib.sha256(path.read_bytes()).hexdigest()[:16]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' data/artist/aiko.json data/manifest.json | sort)"
          test "$changed" = "$expected" || { echo "Unexpected diff:"; echo "$changed"; exit 1; }

      - name: Commit minimized data diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artist/aiko.json data/manifest.json
          git commit -m 'data: minimize aiko Apple Music diff'
          git push origin HEAD:data/aiko-apple-music-20260829
