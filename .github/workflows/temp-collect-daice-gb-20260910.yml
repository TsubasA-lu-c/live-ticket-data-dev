name: One-shot Da-iCE and Golden Bomber collection

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-collect-daice-gb-20260910.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify clean checkout
        run: |
          echo '--- git status before ---'
          git status --short

      - name: Apply verified collection
        run: python3 .github/workflows/temp-collect-daice-gb-20260910.py

      - name: Validate and publish Dev data
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo '--- target diff ---'
          git diff -- data/artist/da_ice.json data/artist/golden_bomber.json data/artists.json data/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/temp-collect-daice-gb-20260910.yml .github/workflows/temp-collect-daice-gb-20260910.py
          git add -- data/artist/da_ice.json data/artist/golden_bomber.json data/artists.json data/manifest.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '6'
          git diff --cached --name-only
          git commit -m 'update: collect Da-iCE and Golden Bomber ticket updates'
          git push origin HEAD:main
          echo '--- git status after ---'
          git status --short
