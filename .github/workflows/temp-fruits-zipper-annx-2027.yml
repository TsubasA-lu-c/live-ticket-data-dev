name: Temporary FRUITS ZIPPER ANNX Dev Update

on:
  push:
    branches:
      - chatgpt/fruits-zipper-annx-2027
    paths:
      - .github/workflows/temp-fruits-zipper-annx-2027.yml

permissions:
  contents: write

concurrency:
  group: temp-fruits-zipper-annx-2027-hosted-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Dev work branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fruits-zipper-annx-2027
          fetch-depth: 0

      - name: Apply exact validated candidate and commit data only
        shell: bash
        run: |
          set -euo pipefail
          baseline='4645cddcc0cbfa1a02efca92cfbc83a11b498de9'
          expected_fruits_hash='1142e4e65ffb09a2'
          target_branch='chatgpt/fruits-zipper-annx-2027'

          echo '--- git status before ---'
          git status --short
          git fetch origin main
          actual_main="$(git rev-parse origin/main)"
          test "$actual_main" = "$baseline" || {
            echo "[ERROR] Dev main moved: expected=$baseline actual=$actual_main"
            exit 1
          }
          if ! git diff --quiet "$baseline..HEAD" -- data; then
            echo '[ERROR] data already changed from validated baseline'
            git diff --name-only "$baseline..HEAD" -- data
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/artist/fruits_zipper.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          verified = '2026-09-01T00:00:00+09:00'
          official_news = 'https://fruitszipper.asobisystem.com/news/detail/88520'
          event_site = 'https://event.1242.com/events/fzannx/'
          tour_id = 'fruits_zipper_annx_yokohama_arena_2027'
          perf_id = 'fruits_zipper_annx_yokohama_arena_2027_0123'
          tour = {
              'id': tour_id,
              'artistId': 'fruits_zipper',
              'title': 'FRUITS ZIPPERのオールナイトニッポンX in 横浜アリーナ',
              'startDate': '2027-01-23T00:00:00+09:00',
              'endDate': '2027-01-23T00:00:00+09:00',
              'prices': [{'label': '全席指定', 'amount': 9300}],
              'source': 'system',
              'sourceUrl': official_news,
              'lastVerifiedAt': verified,
          }
          performance = {
              'id': perf_id,
              'tourId': tour_id,
              'venue': '横浜アリーナ',
              'performanceAt': '2027-01-23T16:30:00+09:00',
              'doorOpenAt': '2027-01-23T15:00:00+09:00',
              'kind': 'oneman',
              'eventName': tour['title'],
              'source': 'system',
              'sourceUrl': official_news,
              'lastVerifiedAt': verified,
          }
          lotteries = [
              {
                  'id': tour_id + '_fastest',
                  'tourId': tour_id,
                  'type': '最速先行',
                  'entryStartAt': '2026-09-01T00:25:00+09:00',
                  'entryEndAt': '2026-09-15T01:00:00+09:00',
                  'resultAt': None,
                  'paymentStartAt': None,
                  'paymentEndAt': None,
                  'performanceIds': [perf_id],
                  'source': 'system',
                  'sourceUrl': event_site,
                  'lastVerifiedAt': verified,
              },
              {
                  'id': tour_id + '_fc',
                  'tourId': tour_id,
                  'type': 'FRUITS ZIPPER OFFICIAL FANCLUB先行',
                  'entryStartAt': '2026-09-01T00:25:00+09:00',
                  'entryEndAt': '2026-09-15T01:00:00+09:00',
                  'resultAt': None,
                  'paymentStartAt': None,
                  'paymentEndAt': None,
                  'performanceIds': [perf_id],
                  'source': 'system',
                  'sourceUrl': event_site,
                  'lastVerifiedAt': verified,
              },
          ]

          def add_unique(name, item):
              items = data.setdefault(name, [])
              found = [x for x in items if x.get('id') == item['id']]
              if found:
                  raise SystemExit(f'[ERROR] id already exists: {name}:{item["id"]}')
              items.append(item)

          add_unique('tours', tour)
          add_unique('performances', performance)
          for item in lotteries:
              add_unique('lotteries', item)

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          data_dir = Path('data')
          artists_json = data_dir / 'artists.json'
          artist_dir = data_dir / 'artist'
          manifest_path = data_dir / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          def h16(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()[:16]

          manifest['version'] = manifest.get('version', 0) + 1
          now = datetime.now(timezone(timedelta(hours=9)))
          manifest['updatedAt'] = now.strftime('%Y-%m-%dT%H:%M:%S+09:00')
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = h16(artists_json)
          hashes = {p.stem: h16(p) for p in sorted(artist_dir.glob('*.json'))}
          manifest.setdefault('artists', {})
          for aid, value in hashes.items():
              manifest['artists'].setdefault(aid, {})['hash'] = value
          for aid in list(manifest['artists']):
              if aid not in hashes:
                  del manifest['artists'][aid]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          actual_hash="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          print(hashlib.sha256(Path('data/artist/fruits_zipper.json').read_bytes()).hexdigest()[:16])
          PY
          )"
          test "$actual_hash" = "$expected_fruits_hash" || {
            echo "[ERROR] validated candidate hash mismatch: expected=$expected_fruits_hash actual=$actual_hash"
            exit 1
          }

          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          manifest = json.loads(Path('data/manifest.json').read_text(encoding='utf-8'))
          h = hashlib.sha256(Path('data/artist/fruits_zipper.json').read_bytes()).hexdigest()[:16]
          assert manifest['version'] == 185, manifest['version']
          assert manifest['artists']['fruits_zipper']['hash'] == h, (manifest['artists']['fruits_zipper']['hash'], h)
          print('manifest version:', manifest['version'])
          print('fruits hash:', h)
          PY

          git diff --check
          mapfile -t changed < <(git diff --name-only -- data)
          printf '%s\n' "${changed[@]}"
          expected=('data/artist/fruits_zipper.json' 'data/manifest.json')
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "${expected[0]}"
          test "${changed[1]}" = "${expected[1]}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artist/fruits_zipper.json data/manifest.json
          git diff --cached --check
          git commit -m 'update: collect FRUITS ZIPPER ANNX Yokohama Arena'
          git push origin "HEAD:${target_branch}"

          echo '--- git status after ---'
          git status --short
