name: tmp register DIR EN GREY

on:
  push:
    branches:
      - work/add-dir-en-grey-20260916
    paths:
      - .github/workflows/tmp-dir-en-grey-register.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/add-dir-en-grey-20260916
          fetch-depth: 0
      - name: Register artist and update manifest
        shell: bash
        run: |
          set -euo pipefail
          echo '=== git status before ==='
          git status --short
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          data = Path('data')
          artists_path = data / 'artists.json'
          manifest_path = data / 'manifest.json'

          artists = json.loads(artists_path.read_text(encoding='utf-8'))
          if any(a.get('id') == 'dir_en_grey' for a in artists):
              raise SystemExit('dir_en_grey already exists in artists.json')

          artists.append({
              'id': 'dir_en_grey',
              'name': 'DIR EN GREY',
              'aliases': ['ディル アングレイ', 'ディルアングレイ'],
              'genre': 'バンド',
              'imageUrl': None,
              'source': 'system',
              'sourceUrl': 'https://www.direngrey.co.jp/',
              'lastVerifiedAt': '2026-09-16T23:03:00+09:00',
              'appleMusic': {'artistId': '83870278'},
          })
          artists_path.write_text(json.dumps(artists, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          detail = json.loads((data / 'artist' / 'dir_en_grey.json').read_text(encoding='utf-8'))
          assert detail['artistId'] == 'dir_en_grey'
          assert len(detail['tours']) == 3
          assert len(detail['performances']) == 26
          assert len(detail['lotteries']) == 13

          def hash16(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()[:16]

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = int(manifest.get('version', 0)) + 1
          jst = timezone(timedelta(hours=9))
          manifest['updatedAt'] = datetime.now(jst).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = hash16(artists_path)
          hashes = {p.stem: hash16(p) for p in sorted((data / 'artist').glob('*.json'))}
          manifest.setdefault('artists', {})
          for aid, value in hashes.items():
              manifest['artists'].setdefault(aid, {})['hash'] = value
          for aid in list(manifest['artists']):
              if aid not in hashes:
                  del manifest['artists'][aid]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print(f"artists: {len(artists)}")
          print(f"manifest version: {manifest['version']}")
          print(f"dir_en_grey hash: {hashes['dir_en_grey']}")
          PY
          echo '=== target diff ==='
          git diff -- data/artists.json data/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artists.json data/manifest.json
          git commit -m 'data: register DIR EN GREY'
          git push origin HEAD:work/add-dir-en-grey-20260916
          echo '=== git status after ==='
          git status --short
