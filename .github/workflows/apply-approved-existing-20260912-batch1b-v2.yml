name: Apply approved existing updates batch1b v2
on:
  push:
    branches: [audit/rescue-missing-performances-20260912]
    paths: ['.github/workflows/apply-approved-existing-20260912-batch1b-v2.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/rescue-missing-performances-20260912, fetch-depth: 0}
      - name: Apply and manifest
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          R=Path('data/artist'); NOW='2026-09-12T00:00:00+09:00'
          def ld(a): p=R/f'{a}.json'; return p,json.loads(p.read_text())
          def sv(p,d): p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          def pick(d,dates,tid=None):
              out=[]
              for date in dates:
                  m=[x for x in d.get('performances',[]) if (x.get('performanceAt') or '').startswith(date) and (tid is None or x.get('tourId')==tid)]
                  if not m: raise SystemExit(f'missing {d.get("artistId")} {date} {tid}')
                  out+=m
              tids={x['tourId'] for x in out}
              if tid is None and len(tids)!=1: raise SystemExit(f'ambiguous {d.get("artistId")} {dates} {tids}')
              return (tid or next(iter(tids))),out
          def add(d,lid,tid,typ,start,end,ps,url,result=None,pstart=None,pend=None):
              ids=[x['id'] for x in ps]; ls=d.setdefault('lotteries',[])
              if any(l.get('id')==lid or (l.get('entryStartAt')==start and l.get('entryEndAt')==end and sorted(l.get('performanceIds') or [])==sorted(ids)) for l in ls): return
              ls.append({'id':lid,'tourId':tid,'type':typ,'entryStartAt':start,'entryEndAt':end,'resultAt':result,'paymentStartAt':pstart,'paymentEndAt':pend,'performanceIds':ids,'source':'system','sourceUrl':url,'lastVerifiedAt':NOW})
          def one(a,dates,lid,typ,start,end,url,tid=None,result=None,pstart=None,pend=None):
              p,d=ld(a); tid,ps=pick(d,dates,tid); add(d,lid,tid,typ,start,end,ps,url,result,pstart,pend); sv(p,d)
          one('illit',['2026-12-23','2026-12-24','2026-12-26','2026-12-27'],'illit_press_start_encore_lawson_20260907','ローソンチケット先行','2026-09-07T17:00:00+09:00','2026-09-15T23:59:00+09:00','https://www.illit-official.jp/')
          for a,date in [('niziu','2026-09-22'),('ado','2026-09-23'),('equal_love','2026-09-22')]: one(a,[date],a+'_inkigayo_general_20260910','一般発売（先着）','2026-09-10T12:00:00+09:00',None,'https://inkigayo-live.jp/')
          one('mr_children',['2026-10-03','2026-10-04'],'mr_children_saturday_park_fukui_final_20260911','福井公演 最終抽選券受付','2026-09-11T19:00:00+09:00','2026-09-27T23:59:00+09:00','https://tour.mrchildren.jp/index.html','mr_children_saturday_park_2026','2026-10-02T20:30:00+09:00')
          one('yoasobi',['2026-10-24','2026-10-25'],'yoasobi_asia_dome_osaka_lawson_prerequest_20260908','ローソン プレリク先行','2026-09-08T12:00:00+09:00','2026-09-15T23:59:00+09:00','https://l-tike.com/order/?gLcode=56728&gPfKey=20251224000002109688','yoasobi_asia_dome_2026','2026-09-18T15:00:00+09:00')
          one('idolish7',['2026-09-13'],'idolish7_4ward_fukuoka_additional_general_20260910','追加一般発売','2026-09-10T18:00:00+09:00','2026-09-12T23:59:00+09:00','https://idolish7.com/4j/news/xbw60gvl4lcu/')
          one('idolish7',['2026-09-13'],'idolish7_4ward_fukuoka_same_day_conditional_20260913','当日券（残席がある場合）','2026-09-13T00:00:00+09:00',None,'https://idolish7.com/4j/news/xbw60gvl4lcu/')
          one('xg',['2027-02-10','2027-02-11','2027-02-27','2027-02-28'],'xg_the_core_final_presale_20260907','チケット先行抽選','2026-09-07T15:00:00+09:00','2026-09-14T23:59:00+09:00','https://www.xgalx.com/xg/news/detail.php?id=1135785',None,'2026-09-19T15:00:00+09:00','2026-09-19T15:00:00+09:00','2026-09-24T23:59:00+09:00')
          p,d=ld('hana')
          for date,start,end,suf in [('2026-09-16','2026-09-11T21:00:00+09:00','2026-09-16T18:30:00+09:00','osaka_0916'),('2026-09-17','2026-09-12T21:00:00+09:00','2026-09-17T18:30:00+09:00','osaka_0917'),('2026-10-29','2026-10-24T21:00:00+09:00','2026-10-29T18:30:00+09:00','budokan_1029'),('2026-10-30','2026-10-25T21:00:00+09:00','2026-10-30T18:30:00+09:00','budokan_1030'),('2026-10-31','2026-10-26T21:00:00+09:00','2026-10-31T17:00:00+09:00','budokan_1031')]:
              tid,ps=pick(d,[date]); add(d,'hana_born_to_bloom_resale_'+suf,tid,'公式リセール購入',start,end,ps,'https://hana.b-rave.tokyo/live/hana1sttour2026-borntobloom-resale-2/')
          sv(p,d)
          p,d=ld('candy_tune')
          for date,start,end,suf in [('2026-09-19','2026-09-17T10:00:00+09:00','2026-09-18T23:59:00+09:00','matsudo_0919'),('2026-12-08','2026-12-06T10:00:00+09:00','2026-12-07T23:59:00+09:00','tokyo_1208'),('2026-12-09','2026-12-07T10:00:00+09:00','2026-12-08T23:59:00+09:00','tokyo_1209')]:
              tid,ps=pick(d,[date]); add(d,'candy_tune_candy_circus_resale_'+suf,tid,'公式リセール',start,end,ps,'https://candytune.asobisystem.com/')
          sv(p,d)
          p,d=ld('10_feet'); tid,ps=pick(d,['2026-10-14'],'10_feet_fad30_261014_2026')
          add(d,'10_feet_fad30_261014_eplus_preorder',tid,'e+プレオーダー','2026-08-17T18:00:00+09:00','2026-08-23T23:59:00+09:00',ps,'https://eplus.jp/sf/detail/4581460001-P0030001P021001?P6=001'); add(d,'10_feet_fad30_261014_general',tid,'一般発売（先着）','2026-09-05T10:00:00+09:00','2026-10-13T18:00:00+09:00',ps,'https://eplus.jp/sf/detail/4581460001-P0030001P021001?P6=001'); sv(p,d)
          data=Path('data'); mp=data/'manifest.json'; m=json.loads(mp.read_text()); h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()[:16]
          m['version']=int(m.get('version',0))+1; m['updatedAt']=datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%dT%H:%M:%S+09:00'); m.setdefault('files',{}).setdefault('artists',{})['hash']=h(data/'artists.json'); hs={p.stem:h(p) for p in sorted((data/'artist').glob('*.json'))}; m.setdefault('artists',{})
          for a,x in hs.items():m['artists'].setdefault(a,{})['hash']=x
          for a in list(m['artists']):
              if a not in hs:del m['artists'][a]
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artist/10_feet.json data/artist/ado.json data/artist/candy_tune.json data/artist/equal_love.json data/artist/hana.json data/artist/idolish7.json data/artist/illit.json data/artist/mr_children.json data/artist/niziu.json data/artist/xg.json data/artist/yoasobi.json data/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'update: apply weekly approved ticket updates batch 1b'
          git push origin HEAD:audit/rescue-missing-performances-20260912
