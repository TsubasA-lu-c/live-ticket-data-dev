name: Inspect seven approved artists 20260912
on:
  push:
    paths: ['.github/workflows/inspect-seven-approved-20260912.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/rescue-missing-performances-20260912}
      - name: Summarize existing records
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ids=['aimyon','bts','jo1','masayoshi_oishi','oishi_masayoshi','sky_hi','spitz']
          for aid in ids:
            d=json.loads((Path('data/artist')/f'{aid}.json').read_text())
            print('\n###',aid)
            for t in d.get('tours',[]):
              print('TOUR',t.get('id'),'|',t.get('title'),'|',t.get('startDate'),'|',t.get('endDate'))
            for p in d.get('performances',[]):
              print('PERF',p.get('id'),'|',p.get('tourId'),'|',p.get('venue'),'|',p.get('performanceAt'),'|',p.get('doorOpenAt'))
            for l in d.get('lotteries',[]):
              print('LOT',l.get('id'),'|',l.get('tourId'),'|',l.get('applicationStart'),'|',l.get('applicationEnd'),'|',l.get('performanceIds'))
          PY
