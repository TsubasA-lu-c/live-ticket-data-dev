name: One-shot legacy-compatible unknown times

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/legacy-compatible-unknown-times-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Convert date-only performances to compatibility form
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          targets = {
              'babymetal': Path('data/artist/babymetal.json'),
              'zutomayo': Path('data/artist/zutomayo.json'),
          }

          changed_counts = {}
          for artist, path in targets.items():
              data = json.loads(path.read_text())
              count = 0
              for perf in data['performances']:
                  is_target = (
                      (artist == 'babymetal' and perf['id'].endswith('_date_only'))
                      or (artist == 'zutomayo' and perf['id'] == 'zutomayo_fujirock_2026_0725')
                  )
                  if not is_target:
                      continue
                  day = perf.get('performanceDate')
                  if not day:
                      raise SystemExit(f"{artist}:{perf['id']} missing performanceDate")
                  if perf.get('performanceAt') is not None:
                      raise SystemExit(f"{artist}:{perf['id']} expected null before conversion")
                  perf['performanceAt'] = f'{day}T12:00:00+09:00'
                  perf['performanceTimeEstimated'] = True
                  count += 1
              expected = 25 if artist == 'babymetal' else 1
              if count != expected:
                  raise SystemExit(f'{artist}: converted {count}, expected {expected}')
              changed_counts[artist] = count
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          # Targeted compatibility invariants.
          for artist, path in targets.items():
              data = json.loads(path.read_text())
              selected = [
                  p for p in data['performances']
                  if (artist == 'babymetal' and p['id'].endswith('_date_only'))
                  or (artist == 'zutomayo' and p['id'] == 'zutomayo_fujirock_2026_0725')
              ]
              for perf in selected:
                  assert perf['performanceTimeEstimated'] is True
                  assert perf['performanceAt'] == perf['performanceDate'] + 'T12:00:00+09:00'

          manifest_path = Path('data/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('version') != 158:
              raise SystemExit(f"unexpected manifest version {manifest.get('version')}")
          for artist, path in targets.items():
              digest = hashlib.sha256(path.read_bytes()).hexdigest()[:16]
              manifest['artists'][artist]['hash'] = digest
          manifest['version'] = 159
          jst = timezone(timedelta(hours=9))
          manifest['updatedAt'] = datetime.now(jst).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          print('converted', changed_counts)
          PY
          rm .github/workflows/legacy-compatible-unknown-times-temp.yml
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ['babymetal', 'zutomayo']:
              json.loads(Path(f'data/artist/{name}.json').read_text())
          manifest = json.loads(Path('data/manifest.json').read_text())
          assert manifest['version'] == 159
          PY
      - name: Commit exact compatibility conversion and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/artist/babymetal.json data/artist/zutomayo.json data/manifest.json .github/workflows/legacy-compatible-unknown-times-temp.yml
          git commit -m 'Keep unknown performance times legacy compatible'
          git push origin HEAD:${{ github.head_ref }}
