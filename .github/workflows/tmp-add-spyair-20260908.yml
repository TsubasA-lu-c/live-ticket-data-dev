                  {'songId':'1535609758','title':'サムライハート(Some Like It Hot!!)','albumTitle':'サムライハート(Some Like It Hot!!) - Single','previewUrl':'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/a5/52/17/a5521720-9543-021e-88bb-3adb07c397e0/mzaf_12087828670955535608.plus.aac.ep.m4a','artworkUrl':'https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/77/5d/e8/775de829-639f-66e0-5d6d-d452f3edd799/jacket_AIXX00239B00Z_550.jpg/{w}x{h}{c}.{f}'},
