          lot('spyair_jlt2026_airgate_fastest','spyair_just_like_this_2026','AIR-GATE会員最速先行（GOODS付）','2026-05-14T21:00:00+09:00','2026-05-25T23:59:00+09:00','https://www.sonymusic.co.jp/artist/spyair/info/583389',jlt_jp)
