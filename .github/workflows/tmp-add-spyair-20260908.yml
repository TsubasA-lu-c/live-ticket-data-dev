          perf('spyair_live_2026_taipei_20260627','spyair_live_2026_taipei','Legacy TERA','2026-06-27T12:00:00+08:00','2026-06-27','https://www.sonymusic.co.jp/artist/spyair/info/581802',estimated=True)
