          unexpected="$(printf '%s\n' "$status" | awk '{print $2}' | grep -v -E '^(data/artists.json|data/artist/spyair.json|data/manifest.json)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changes: $unexpected" >&2; exit 1; }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artists.json data/artist/spyair.json data/manifest.json
          git commit -m 'feat: add SPYAIR live data'
          git push origin HEAD:${GITHUB_REF_NAME}
