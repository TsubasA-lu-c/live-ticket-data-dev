          perf('spyair_just_like_this_2026_20260905','spyair_just_like_this_2026','KINTEX 第2展示場 後面広場','2026-09-05T18:00:00+09:00','2026-09-05','https://www.spyair.net/justlikethis2026/',door='2026-09-05T17:00:00+09:00')
          perf('spyair_just_like_this_2026_20260926','spyair_just_like_this_2026','河口湖ステラシアター','2026-09-26T17:00:00+09:00','2026-09-26','https://www.spyair.net/justlikethis2026/',door='2026-09-26T16:00:00+09:00')
          perf('spyair_treasure05x_2026_20260913','spyair_treasure05x_2026','蒲郡ラグーナビーチ','2026-09-13T11:00:00+09:00','2026-09-13','https://www.sonymusic.co.jp/artist/spyair/live/55397',kind='fes',event='TREASURE05X 2026',door='2026-09-13T09:30:00+09:00')
          perf('spyair_anoku_2026_20261024','spyair_anoku_2026','久留米大学旭町キャンパス 石橋正二郎記念体育館','2026-10-24T16:00:00+09:00','2026-10-24','https://www.sonymusic.co.jp/artist/spyair/info/585819',kind='fes',event='久留米大学医学部あのく祭',door='2026-10-24T15:00:00+09:00')
          perf('spyair_europe_tour_2026_20261030','spyair_europe_tour_2026','Multiversum Schwechat','2026-10-30T12:00:00+01:00','2026-10-30','https://www.sonymusic.co.jp/artist/spyair/live/55432',kind='fes',event='Yuni Con',estimated=True)
          perf('spyair_europe_tour_2026_20261102','spyair_europe_tour_2026','Cabaret Sauvage','2026-11-02T20:00:00+01:00','2026-11-02','https://www.dreamlight-labs.com/de/artist/spyair-europe-tour',door='2026-11-02T19:00:00+01:00')
          perf('spyair_europe_tour_2026_20261104','spyair_europe_tour_2026','Effenaar','2026-11-04T20:00:00+01:00','2026-11-04','https://www.dreamlight-labs.com/de/artist/spyair-europe-tour',door='2026-11-04T19:00:00+01:00')
          perf('spyair_europe_tour_2026_20261105','spyair_europe_tour_2026','Batschkapp','2026-11-05T20:00:00+01:00','2026-11-05','https://www.dreamlight-labs.com/de/artist/spyair-europe-tour',door='2026-11-05T19:00:00+01:00')
