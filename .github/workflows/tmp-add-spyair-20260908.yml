          assert len(tour_ids)==12 and len(perf_ids)==29
          for p in performances:
              assert p['tourId'] in tour_ids
              datetime.fromisoformat(p['performanceAt'])
              assert p['performanceDate']==p['performanceAt'][:10]
              if p['performanceTimeEstimated']:
                  dt=datetime.fromisoformat(p['performanceAt']); assert (dt.hour,dt.minute,dt.second)==(12,0,0)
              if p['kind'] in ('fes','taiban'): assert p.get('eventName')
          for l in lotteries:
              assert l['tourId'] in tour_ids and 'performanceIds' in l
              if l['performanceIds'] is not None:
                  assert l['performanceIds'] and all(pid in perf_ids for pid in l['performanceIds'])
          dump(artist_path,data)

