name: Fix ENHYPEN time compatibility
on:
  push:
    branches: [fix/enhypen-time-compat-20260828]
    paths:
      - 'tools/fix_enhypen_time_compat_20260828.py'
      - '.github/workflows/fix-enhypen-time-compat-20260828.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enhypen-time-compat-20260828
          fetch-depth: 2
      - run: python3 tools/fix_enhypen_time_compat_20260828.py
      - shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool data/artist/enhypen.json >/dev/null
          python3 -m json.tool data/manifest.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artist/enhypen.json data/manifest.json
          staged="$(git diff --cached --name-only)"
          test "$staged" = $'data/artist/enhypen.json\ndata/manifest.json'
          git commit -m 'fix: preserve unknown ENHYPEN performance times'
          git push origin HEAD:fix/enhypen-time-compat-20260828
