name: Temporary aiko album lottery result fix

on:
  push:
    branches:
      - fix/aiko-lottery-rework-20260829
    paths:
      - '.github/workflows/temp-aiko-album17-result-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check initial tree
        run: git status --short

      - name: Patch verified album lottery result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          p = Path('data/artist/aiko.json')
          text = p.read_text(encoding='utf-8')
          target_id = 'aiko_llp26_2026_2027_album17_added'
          lines = text.splitlines(keepends=True)
          hits = [i for i,line in enumerate(lines) if f'"id":"{target_id}"' in line]
          if len(hits) != 1:
              raise SystemExit(f'expected one {target_id}, found {len(hits)}')
          i = hits[0]
          line = lines[i]
          if '"resultAt":null' not in line:
              raise SystemExit('album17 resultAt is no longer null; review concurrent change')
          if '"sourceUrl":"https://www.aiko.com/topics/?id=8013"' not in line:
              raise SystemExit('album17 sourceUrl changed; review concurrent change')
          line = line.replace('"resultAt":null', '"resultAt":"2026-10-02T13:00:00+09:00"', 1)
          line = line.replace('"sourceUrl":"https://www.aiko.com/topics/?id=8013"', '"sourceUrl":"https://news.ponycanyon.co.jp/2026/08/125032"', 1)
          line = re.sub(r'"lastVerifiedAt":"[^"]+"', '"lastVerifiedAt":"2026-08-29T08:31:52+09:00"', line, count=1)
          lines[i] = line
          text = ''.join(lines)
          text = text.replace('  "lastVerifiedAt": "2026-08-29T07:24:54+09:00"\n}', '  "lastVerifiedAt": "2026-08-29T08:31:52+09:00"\n}', 1)
          p.write_text(text, encoding='utf-8')
          json.loads(text)

          mpath = Path('data/manifest.json')
          manifest = json.loads(mpath.read_text(encoding='utf-8'))
          manifest['version'] = int(manifest['version']) + 1
          manifest['updatedAt'] = '2026-08-29T08:31:52+09:00'
          manifest['artists']['aiko']['hash'] = hashlib.sha256(p.read_bytes()).hexdigest()[:16]
          mpath.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify exact diff and JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('data').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          d=json.loads(Path('data/artist/aiko.json').read_text(encoding='utf-8'))
          row=next(x for x in d['lotteries'] if x['id']=='aiko_llp26_2026_2027_album17_added')
          assert row['resultAt']=='2026-10-02T13:00:00+09:00'
          assert row['paymentStartAt'] is None and row['paymentEndAt'] is None
          assert row['sourceUrl']=='https://news.ponycanyon.co.jp/2026/08/125032'
          e=next(x for x in d['lotteries'] if x['id']=='aiko_llp26_2026_2027_eplus_preorder_aichi')
          assert e['resultAt'] is None and e['paymentStartAt'] is None and e['paymentEndAt'] is None
          PY
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' data/artist/aiko.json data/manifest.json | sort)"
          test "$changed" = "$expected" || { echo "Unexpected diff:"; echo "$changed"; exit 1; }
          git diff --check
          git status --short
          git diff -- data/artist/aiko.json data/manifest.json

      - name: Commit verified data fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artist/aiko.json data/manifest.json
          git commit -m 'data: add verified aiko album lottery result'
          git push origin HEAD:fix/aiko-lottery-rework-20260829
          git status --short
