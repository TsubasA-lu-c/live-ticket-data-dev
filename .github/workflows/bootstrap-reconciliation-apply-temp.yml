name: Bootstrap reconciliation apply temp

on:
  push:
    branches:
      - apply/bootstrap-reconciliation-20260823
    paths:
      - '.github/bootstrap-reconciliation-apply-request.json'

permissions:
  contents: write

concurrency:
  group: bootstrap-reconciliation-apply-20260823
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify request and pristine data base
        shell: bash
        run: |
          set -euo pipefail
          request=.github/bootstrap-reconciliation-apply-request.json
          test -f "$request"
          production="$(python3 -c 'import json; d=json.load(open(".github/bootstrap-reconciliation-apply-request.json")); print(str(bool(d.get("production", False))).lower())')"
          test "$production" = false || { echo 'Production forbidden.' >&2; exit 1; }
          expected="$(python3 -c 'import json; d=json.load(open(".github/bootstrap-reconciliation-apply-request.json")); print(d["expectedMainCommit"])')"
          branch="$(python3 -c 'import json; d=json.load(open(".github/bootstrap-reconciliation-apply-request.json")); print(d["targetBranch"])')"
          test "$branch" = 'apply/bootstrap-reconciliation-20260823' || { echo "Unexpected target branch: $branch" >&2; exit 1; }
          git fetch origin main
          actual="$(git rev-parse origin/main)"
          test "$actual" = "$expected" || { echo "main moved: expected=$expected actual=$actual" >&2; exit 1; }
          if ! git diff --quiet origin/main...HEAD -- data/; then
            echo 'Refusing to apply: data already differs from audited main.' >&2
            git diff --name-status origin/main...HEAD -- data/
            exit 1
          fi

      - name: Apply explicit ID-level operations and audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          request_path = Path('.github/bootstrap-reconciliation-apply-request.json')
          request = json.loads(request_path.read_text(encoding='utf-8'))
          patch_files = request.get('patchFiles') or []
          if not patch_files:
              raise SystemExit('patchFiles is empty')
          expected_artists = set(request.get('expectedArtists') or [])
          expected_delete_count = request.get('expectedDeleteCount')
          if expected_delete_count is None:
              raise SystemExit('expectedDeleteCount is required')

          operations = []
          for rel in patch_files:
              path = Path(rel)
              if not path.is_file():
                  raise SystemExit(f'missing patch file: {rel}')
              payload = json.loads(path.read_text(encoding='utf-8'))
              ops = payload.get('operations') or []
              if not isinstance(ops, list):
                  raise SystemExit(f'operations must be list: {rel}')
              operations.extend(ops)

          collections = {'tour': 'tours', 'performance': 'performances', 'lottery': 'lotteries'}
          by_artist = {}
          explicit_deletes = set()
          touched = set()
          for op in operations:
              artist = op.get('artistId')
              kind = op.get('kind')
              obj_id = op.get('id')
              action = op.get('op')
              if not all(isinstance(v, str) and v for v in (artist, kind, obj_id, action)):
                  raise SystemExit(f'invalid operation identity: {op}')
              if kind not in collections or action not in {'upsert', 'merge', 'delete'}:
                  raise SystemExit(f'invalid operation: {op}')
              key = (artist, kind, obj_id)
              if key in touched:
                  raise SystemExit(f'duplicate operation target: {key}')
              touched.add(key)
              if action == 'delete':
                  reason = op.get('reason')
                  if not isinstance(reason, str) or not reason.strip():
                      raise SystemExit(f'delete without reason: {key}')
                  explicit_deletes.add(key)
              by_artist.setdefault(artist, []).append(op)

          if set(by_artist) != expected_artists:
              missing = sorted(expected_artists - set(by_artist))
              extra = sorted(set(by_artist) - expected_artists)
              raise SystemExit(f'artist target mismatch missing={missing} extra={extra}')
          if len(explicit_deletes) != int(expected_delete_count):
              raise SystemExit(f'delete count mismatch expected={expected_delete_count} actual={len(explicit_deletes)}')

          audit = {'artists': {}, 'operations': len(operations), 'explicitDeletes': len(explicit_deletes)}
          changed_files = []
          for artist, ops in sorted(by_artist.items()):
              path = Path('data/artist') / f'{artist}.json'
              if not path.is_file():
                  raise SystemExit(f'missing artist data: {artist}')
              data = json.loads(path.read_text(encoding='utf-8'))
              before_ids = {}
              for kind, arr_name in collections.items():
                  arr = data.get(arr_name)
                  if not isinstance(arr, list):
                      raise SystemExit(f'{artist}.{arr_name} must be list')
                  ids = [x.get('id') for x in arr if isinstance(x, dict)]
                  if len(ids) != len(set(ids)):
                      raise SystemExit(f'duplicate existing ids: {artist}.{arr_name}')
                  before_ids[kind] = set(ids)

              for op in ops:
                  arr_name = collections[op['kind']]
                  arr = data[arr_name]
                  matches = [i for i, row in enumerate(arr) if isinstance(row, dict) and row.get('id') == op['id']]
                  if op['op'] == 'upsert':
                      if op.get('expectAbsent') is not True:
                          raise SystemExit(f'upsert must set expectAbsent=true: {(artist, op["kind"], op["id"])}')
                      if matches:
                          raise SystemExit(f'upsert target already exists: {(artist, op["kind"], op["id"])}')
                      value = op.get('value')
                      if not isinstance(value, dict) or value.get('id') != op['id']:
                          raise SystemExit(f'invalid upsert value: {(artist, op["kind"], op["id"])}')
                      arr.append(value)
                  elif op['op'] == 'merge':
                      if len(matches) != 1:
                          raise SystemExit(f'merge target count != 1: {(artist, op["kind"], op["id"])} count={len(matches)}')
                      changes = op.get('changes')
                      if not isinstance(changes, dict) or not changes:
                          raise SystemExit(f'merge changes missing: {(artist, op["kind"], op["id"])}')
                      row = dict(arr[matches[0]])
                      row.update(changes)
                      arr[matches[0]] = row
                  else:
                      if len(matches) != 1:
                          raise SystemExit(f'delete target count != 1: {(artist, op["kind"], op["id"])} count={len(matches)}')
                      del arr[matches[0]]

              after_ids = {}
              for kind, arr_name in collections.items():
                  arr = data[arr_name]
                  ids = [x.get('id') for x in arr if isinstance(x, dict)]
                  if len(ids) != len(set(ids)):
                      raise SystemExit(f'duplicate resulting ids: {artist}.{arr_name}')
                  after_ids[kind] = set(ids)

              unexpected_removed = []
              expected_removed = []
              for kind in collections:
                  removed = before_ids[kind] - after_ids[kind]
                  allowed = {obj_id for a, k, obj_id in explicit_deletes if a == artist and k == kind}
                  if removed != allowed:
                      unexpected_removed.append({'kind': kind, 'removed': sorted(removed), 'allowed': sorted(allowed)})
                  expected_removed.extend((kind, x) for x in sorted(removed))
              if unexpected_removed:
                  raise SystemExit(f'unexpected removals for {artist}: {unexpected_removed}')

              tour_ids = {x.get('id') for x in data['tours'] if isinstance(x, dict)}
              perf_ids = {x.get('id') for x in data['performances'] if isinstance(x, dict)}
              for row in data['performances']:
                  if not isinstance(row, dict):
                      raise SystemExit(f'non-object performance: {artist}')
                  for req in ('id', 'tourId', 'performanceAt', 'source'):
                      if row.get(req) is None:
                          raise SystemExit(f'missing required performance field {artist}.{row.get("id")}.{req}')
                  if row.get('tourId') not in tour_ids:
                      raise SystemExit(f'orphan performance: {artist}.{row.get("id")}')
                  if row.get('kind') not in ('oneman', 'fes', 'taiban'):
                      raise SystemExit(f'invalid performance kind: {artist}.{row.get("id")}')
                  if row.get('kind') in ('fes', 'taiban') and not row.get('eventName'):
                      raise SystemExit(f'eventName required: {artist}.{row.get("id")}')
              for row in data['lotteries']:
                  if not isinstance(row, dict):
                      raise SystemExit(f'non-object lottery: {artist}')
                  for req in ('id', 'tourId', 'type', 'source'):
                      if row.get(req) is None:
                          raise SystemExit(f'missing required lottery field {artist}.{row.get("id")}.{req}')
                  if row.get('tourId') not in tour_ids:
                      raise SystemExit(f'orphan lottery: {artist}.{row.get("id")}')
                  pids = row.get('performanceIds')
                  if pids is not None:
                      if not isinstance(pids, list) or any(pid not in perf_ids for pid in pids):
                          raise SystemExit(f'invalid lottery performanceIds: {artist}.{row.get("id")}')
              for row in data['tours']:
                  if not isinstance(row, dict):
                      raise SystemExit(f'non-object tour: {artist}')
                  for req in ('id', 'artistId', 'title', 'source', 'sourceUrl', 'lastVerifiedAt'):
                      if row.get(req) is None:
                          raise SystemExit(f'missing required tour field {artist}.{row.get("id")}.{req}')
                  if row.get('artistId') != artist:
                      raise SystemExit(f'tour artist mismatch: {artist}.{row.get("id")}')

              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              changed_files.append(str(path))
              audit['artists'][artist] = {
                  'operations': len(ops),
                  'deleted': [{'kind': k, 'id': i} for k, i in expected_removed],
                  'countsBefore': {k: len(v) for k, v in before_ids.items()},
                  'countsAfter': {k: len(v) for k, v in after_ids.items()},
              }

          manifest_path = Path('data/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          def hash16(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()[:16]
          manifest['version'] = int(manifest.get('version', 0)) + 1
          JST = timezone(timedelta(hours=9))
          manifest['updatedAt'] = datetime.now(JST).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = hash16(Path('data/artists.json'))
          hashes = {}
          for fp in sorted(Path('data/artist').glob('*.json')):
              hashes[fp.stem] = hash16(fp)
          manifest.setdefault('artists', {})
          for aid, h in hashes.items():
              manifest['artists'].setdefault(aid, {})['hash'] = h
          for aid in list(manifest['artists']):
              if aid not in hashes:
                  del manifest['artists'][aid]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          audit['manifestVersion'] = manifest['version']
          Path('/tmp/bootstrap-apply-audit.json').write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          PY

      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-status
          bad="$(git diff --name-only | grep -Ev '^data/artist/[^/]+\.json$|^data/manifest\.json$' || true)"
          test -z "$bad" || { echo "Unexpected changed paths:" >&2; echo "$bad" >&2; exit 1; }
          test -z "$(git diff --name-only -- data/artists.json)" || { echo 'data/artists.json must not change.' >&2; exit 1; }

      - name: Commit audited data changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artist/*.json data/manifest.json
          staged="$(git diff --cached --name-only)"
          test -n "$staged" || { echo 'No data changes to commit.' >&2; exit 1; }
          bad="$(printf '%s\n' "$staged" | grep -Ev '^data/artist/[^/]+\.json$|^data/manifest\.json$' || true)"
          test -z "$bad" || { echo "Unexpected staged paths:" >&2; echo "$bad" >&2; exit 1; }
          git commit -m 'Apply audited bootstrap reconciliation to dev branch'
          git push origin HEAD:apply/bootstrap-reconciliation-20260823
