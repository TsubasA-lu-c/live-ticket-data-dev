name: Rescue 10-FEET Kyoto Chotokkyu 20260912
on:
  push:
    branches: ['audit/rescue-missing-performances-20260912']
    paths: ['.github/workflows/rescue-kyoto-chotokkyu-20260912.yml']
permissions:
  contents: write
jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Add confirmed 12/13 performance and rebuild manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          p=Path('data/artist/10_feet.json'); d=json.loads(p.read_text())
          tid='10_feet_kyoto_chotokkyu_2026'
          assert any(x['id']==tid for x in d['tours'])
          pid=tid+'_kyoto_1213'
          if not any(x['id']==pid for x in d['performances']):
              d['performances'].append({
                'id':pid,'tourId':tid,'venue':'京都パルスプラザ',
                'performanceAt':'2026-12-13T12:00:00+09:00','performanceDate':'2026-12-13',
                'performanceTimeEstimated':True,'doorOpenAt':None,'kind':'fes','eventName':'響都超特急2026',
                'source':'system','sourceUrl':'https://10-feet.kyoto/contents/live/page/2',
                'lastVerifiedAt':'2026-09-12T00:00:00+09:00'})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          mpath=Path('data/manifest.json'); m=json.loads(mpath.read_text())
          def h16(x):return hashlib.sha256(x.read_bytes()).hexdigest()[:16]
          m['version']=int(m['version'])+1
          JST=timezone(timedelta(hours=9)); m['updatedAt']=datetime.now(JST).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          m['files']['artists']['hash']=h16(Path('data/artists.json'))
          for fp in Path('data/artist').glob('*.json'):
              m['artists'].setdefault(fp.stem,{})['hash']=h16(fp)
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 - <<'PY'
          import json
          d=json.load(open('data/artist/10_feet.json'))
          p=[x for x in d['performances'] if x['id']=='10_feet_kyoto_chotokkyu_2026_kyoto_1213']
          assert len(p)==1 and p[0]['performanceDate']=='2026-12-13' and p[0]['performanceTimeEstimated'] is True
          assert json.load(open('data/manifest.json'))['version']==204
          print('響都超特急 rescue sanity: PASS')
          PY
      - name: Commit data only
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add -- data/artist/10_feet.json data/manifest.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: add 10-FEET 響都超特急 12/13'
          git push origin HEAD:audit/rescue-missing-performances-20260912
