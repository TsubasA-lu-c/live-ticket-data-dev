name: Inspect weekly approved remaining 20260912
on:
  push:
    branches: [audit/rescue-missing-performances-20260912]
    paths: ['.github/workflows/inspect-weekly-approved-remaining-20260912.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print relevant inventory
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          aids=['nogizaka46','aimyon','larc_en_ciel','spitz','fruits_zipper','the_oral_cigarettes','jo1','boku_aozora','le_sserafim','oishi_masayoshi','masayoshi_oishi','ive','kurayamisaka','bts']
          for aid in aids:
              d=json.loads((Path('data/artist')/f'{aid}.json').read_text())
              print('\n===',aid,'===')
              print('counts',len(d.get('tours',[])),len(d.get('performances',[])),len(d.get('lotteries',[])))
              for t in d.get('tours',[]):
                  title=t.get('title','')
                  if aid in ['aimyon','spitz','bts'] or any(k.lower() in title.lower() for k in ['gift','under','anniversary','arirang','aao','pureflow','inkigayo','boro','hyper','university','festival','showcase']):
                      print('TOUR',t['id'],'|',title,'|',t.get('startDate'),'|',t.get('endDate'),'|',t.get('sourceUrl'))
              for x in d.get('performances',[]):
                  dt=x.get('performanceDate') or x.get('performanceAt','')[:10]
                  if dt >= '2026-09-01': print('PERF',x['id'],'|',x['tourId'],'|',dt,'|',x.get('venue'),'|',x.get('performanceAt'),'| est=',x.get('performanceTimeEstimated'))
              for x in d.get('lotteries',[]):
                  st=x.get('entryStartAt') or ''
                  if st >= '2026-08-01' or any(k in x.get('id','').lower() for k in ['aao','arirang']): print('LOT',x['id'],'|',x['tourId'],'|',x.get('type'),'|',x.get('entryStartAt'),'|',x.get('entryEndAt'),'|',x.get('performanceIds'))
          PY
