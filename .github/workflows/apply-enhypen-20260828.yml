name: Apply reviewed ENHYPEN update

on:
  push:
    branches:
      - apply/enhypen-20260828
    paths:
      - 'tools/apply_enhypen_20260828.py'
      - '.github/workflows/apply-enhypen-20260828.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apply/enhypen-20260828
          fetch-depth: 2
      - name: Apply reviewed data
        run: python3 tools/apply_enhypen_20260828.py
      - name: Verify and commit only data files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool data/artist/enhypen.json >/dev/null
          python3 -m json.tool data/manifest.json >/dev/null
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artist/enhypen.json data/manifest.json
          staged="$(git diff --cached --name-only)"
          test "$staged" = $'data/artist/enhypen.json\ndata/manifest.json' || {
            echo "Unexpected staged files:" >&2
            printf '%s\n' "$staged" >&2
            exit 1
          }
          git commit -m 'data: update ENHYPEN 2026-08-28'
          git push origin HEAD:apply/enhypen-20260828
