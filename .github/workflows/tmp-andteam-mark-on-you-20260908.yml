name: 'Temporary &TEAM Mark on You update'

on:
  push:
    branches:
      - 'chatgpt/andteam-mark-on-you-20260908'
    paths:
      - '.github/workflows/tmp-andteam-mark-on-you-20260908.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified Mark on You data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime
          from pathlib import Path

          DATA = Path('data')
          ARTIST_PATH = DATA / 'artist' / 'and_team.json'
          ARTISTS_PATH = DATA / 'artists.json'
          MANIFEST_PATH = DATA / 'manifest.json'

          TOUR_ID = 'and_team_mark_on_you_2026_2027'
          ANNOUNCE_URL = 'https://www.andteam-official.jp/news/e672b7142d8c'
          FC_URL = 'https://www.andteam-official.jp/news/021ab1de6a61'
          VERIFIED = '2026-09-08T21:15:03+09:00'

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def dump(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def sha16(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()[:16]

          def dt(value):
              return datetime.fromisoformat(value)

          doc = load(ARTIST_PATH)
          assert doc.get('artistId') == 'and_team'
          assert TOUR_ID not in {x.get('id') for x in doc.get('tours', [])}, 'tour already exists'

          tour = {
              'id': TOUR_ID,
              'artistId': 'and_team',
              'title': "2026-2027 &TEAM CONCERT TOUR 'Mark on You'",
              'startDate': '2026-10-15T00:00:00+09:00',
              'endDate': '2027-03-27T00:00:00+09:00',
              'prices': None,
              'source': 'system',
              'sourceUrl': ANNOUNCE_URL,
              'lastVerifiedAt': VERIFIED,
          }

          # Hall performances: official FC article states exact OPEN/START times.
          hall_rows = [
              ('tokyo_1015', '東京ガーデンシアター', '2026-10-15', '17:00', '18:00'),
              ('tokyo_1016', '東京ガーデンシアター', '2026-10-16', '17:00', '18:00'),
              ('shizuoka_1020', '富士市文化会館ロゼシアター大ホール', '2026-10-20', '17:30', '18:30'),
              ('iwate_1027', 'トーサイクラシックホール岩手 大ホール', '2026-10-27', '17:00', '18:00'),
              ('iwate_1028', 'トーサイクラシックホール岩手 大ホール', '2026-10-28', '17:00', '18:00'),
              ('aichi_1109', '愛知県芸術劇場', '2026-11-09', '16:30', '17:30'),
              ('aichi_1110', '愛知県芸術劇場', '2026-11-10', '16:30', '17:30'),
              ('osaka_1118', 'グランキューブ大阪', '2026-11-18', '17:00', '18:00'),
              ('osaka_1119', 'グランキューブ大阪', '2026-11-19', '17:00', '18:00'),
              ('hiroshima_1127', '広島文化学園HBGホール', '2026-11-27', '17:30', '18:30'),
              ('fukuoka_1210', '福岡サンパレス', '2026-12-10', '17:00', '18:00'),
              ('fukuoka_1211', '福岡サンパレス', '2026-12-11', '17:00', '18:00'),
              ('ishikawa_1215', '本多の森 北電ホール', '2026-12-15', '17:00', '18:00'),
              ('ishikawa_1216', '本多の森 北電ホール', '2026-12-16', '17:00', '18:00'),
              ('ehime_1219', '松山市民会館 大ホール', '2026-12-19', '17:00', '18:00'),
              ('ehime_1220', '松山市民会館 大ホール', '2026-12-20', '16:00', '17:00'),
              ('hokkaido_1227', '札幌文化芸術劇場 hitaru', '2026-12-27', '16:00', '17:00'),
              ('kumamoto_0105', '熊本城ホール メインホール', '2027-01-05', '17:00', '18:00'),
              ('kumamoto_0106', '熊本城ホール メインホール', '2027-01-06', '17:00', '18:00'),
              ('miyagi_0110', '仙台サンプラザホール', '2027-01-10', '17:00', '18:00'),
              ('miyagi_0111', '仙台サンプラザホール', '2027-01-11', '16:00', '17:00'),
              ('niigata_0115', '新潟県民会館 大ホール', '2027-01-15', '17:00', '18:00'),
              ('niigata_0116', '新潟県民会館 大ホール', '2027-01-16', '16:00', '17:00'),
              ('niigata_0119', '新潟県民会館 大ホール', '2027-01-19', '17:00', '18:00'),
              ('niigata_0120', '新潟県民会館 大ホール', '2027-01-20', '17:00', '18:00'),
              ('okayama_0122', '倉敷市民会館', '2027-01-22', '17:00', '18:00'),
              ('okayama_0123', '倉敷市民会館', '2027-01-23', '16:00', '17:00'),
              ('okinawa_0128', '沖縄コンベンションセンター・劇場棟', '2027-01-28', '17:30', '18:30'),
          ]
          assert len(hall_rows) == 28

          hall_perfs = []
          for suffix, venue, date, open_time, start_time in hall_rows:
              hall_perfs.append({
                  'id': f'and_team_mark_on_you_2026_2027_{suffix}',
                  'tourId': TOUR_ID,
                  'venue': venue,
                  'performanceAt': f'{date}T{start_time}:00+09:00',
                  'doorOpenAt': f'{date}T{open_time}:00+09:00',
                  'kind': 'oneman',
                  'eventName': None,
                  'source': 'system',
                  'sourceUrl': FC_URL,
                  'lastVerifiedAt': VERIFIED,
              })

          # Arena performances: exact dates/venues are announced, but times/ticket details are not yet announced.
          arena_rows = [
              ('hyogo_0203', 'GLION ARENA KOBE', '2027-02-03'),
              ('hyogo_0204', 'GLION ARENA KOBE', '2027-02-04'),
              ('aichi_0206', 'IG Arena', '2027-02-06'),
              ('aichi_0207', 'IG Arena', '2027-02-07'),
              ('kanagawa_0213', 'ぴあアリーナMM', '2027-02-13'),
              ('kanagawa_0214', 'ぴあアリーナMM', '2027-02-14'),
              ('kagawa_0227', 'あなぶきアリーナ香川', '2027-02-27'),
              ('kagawa_0228', 'あなぶきアリーナ香川', '2027-02-28'),
              ('fukuoka_0320', 'マリンメッセ福岡 B館', '2027-03-20'),
              ('fukuoka_0321', 'マリンメッセ福岡 B館', '2027-03-21'),
              ('fukuoka_0322', 'マリンメッセ福岡 B館', '2027-03-22'),
              ('miyagi_0326', 'セキスイハイム スーパーアリーナ', '2027-03-26'),
              ('miyagi_0327', 'セキスイハイム スーパーアリーナ', '2027-03-27'),
          ]
          assert len(arena_rows) == 13

          arena_perfs = []
          for suffix, venue, date in arena_rows:
              arena_perfs.append({
                  'id': f'and_team_mark_on_you_2026_2027_{suffix}',
                  'tourId': TOUR_ID,
                  'venue': venue,
                  'performanceAt': f'{date}T12:00:00+09:00',
                  'doorOpenAt': None,
                  'kind': 'oneman',
                  'eventName': None,
                  'source': 'system',
                  'sourceUrl': ANNOUNCE_URL,
                  'lastVerifiedAt': VERIFIED,
                  'performanceDate': date,
                  'performanceTimeEstimated': True,
              })

          new_perfs = hall_perfs + arena_perfs
          assert len(new_perfs) == 41
          new_perf_ids = [p['id'] for p in new_perfs]
          assert len(new_perf_ids) == len(set(new_perf_ids))
          existing_perf_ids = {p.get('id') for p in doc.get('performances', [])}
          assert not (set(new_perf_ids) & existing_perf_ids), 'new performance ID collision'

          hall_ids = [p['id'] for p in hall_perfs]
          lottery = {
              'id': 'and_team_mark_on_you_2026_2027_lune_membership_fc',
              'tourId': TOUR_ID,
              'type': '&TEAM OFFICIAL FANCLUB LUNÉ MEMBERSHIP会員先行抽選',
              'entryStartAt': '2026-09-07T13:00:00+09:00',
              'entryEndAt': '2026-09-13T23:59:00+09:00',
              'resultAt': '2026-09-18T11:00:00+09:00',
              'paymentStartAt': '2026-09-18T11:00:00+09:00',
              'paymentEndAt': '2026-09-21T23:00:00+09:00',
              'performanceIds': hall_ids,
              'source': 'system',
              'sourceUrl': FC_URL,
              'lastVerifiedAt': VERIFIED,
          }
          assert lottery['id'] not in {x.get('id') for x in doc.get('lotteries', [])}, 'lottery already exists'

          doc['tours'] = [tour] + doc.get('tours', [])
          doc['performances'] = new_perfs + doc.get('performances', [])
          doc['lotteries'] = [lottery] + doc.get('lotteries', [])
          dump(ARTIST_PATH, doc)

          artists = load(ARTISTS_PATH)
          matches = [a for a in artists if a.get('id') == 'and_team']
          assert len(matches) == 1
          matches[0]['sourceUrl'] = FC_URL
          matches[0]['lastVerifiedAt'] = VERIFIED
          dump(ARTISTS_PATH, artists)

          # Semantic validation equivalent for the fields touched here.
          verify = load(ARTIST_PATH)
          tours = {x['id']: x for x in verify.get('tours', [])}
          perfs = {x['id']: x for x in verify.get('performances', [])}
          lotteries = {x['id']: x for x in verify.get('lotteries', [])}
          assert len(tours) == len(verify.get('tours', [])), 'duplicate tour IDs'
          assert len(perfs) == len(verify.get('performances', [])), 'duplicate performance IDs'
          assert len(lotteries) == len(verify.get('lotteries', [])), 'duplicate lottery IDs'
          assert TOUR_ID in tours
          assert all(perfs[pid]['tourId'] == TOUR_ID for pid in new_perf_ids)
          assert lotteries[lottery['id']]['performanceIds'] == hall_ids
          assert len(lotteries[lottery['id']]['performanceIds']) == 28
          assert all(pid in perfs for pid in lotteries[lottery['id']]['performanceIds'])
          for p in hall_perfs:
              assert dt(p['doorOpenAt']) < dt(p['performanceAt'])
          for p in arena_perfs:
              assert p['performanceTimeEstimated'] is True
              assert p['performanceAt'].endswith('T12:00:00+09:00')
          assert dt(lottery['entryStartAt']) < dt(lottery['entryEndAt']) < dt(lottery['resultAt'])
          assert dt(lottery['resultAt']) == dt(lottery['paymentStartAt']) < dt(lottery['paymentEndAt'])

          manifest = load(MANIFEST_PATH)
          manifest['version'] = int(manifest.get('version', 0)) + 1
          manifest['updatedAt'] = VERIFIED
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = sha16(ARTISTS_PATH)
          artist_hashes = {fp.stem: sha16(fp) for fp in sorted((DATA / 'artist').glob('*.json'))}
          manifest.setdefault('artists', {})
          for aid, digest in artist_hashes.items():
              manifest['artists'].setdefault(aid, {})['hash'] = digest
          for aid in list(manifest['artists']):
              if aid not in artist_hashes:
                  del manifest['artists'][aid]
          dump(MANIFEST_PATH, manifest)

          manifest_check = load(MANIFEST_PATH)
          assert manifest_check['files']['artists']['hash'] == sha16(ARTISTS_PATH)
          assert manifest_check['artists']['and_team']['hash'] == sha16(ARTIST_PATH)
          print('validated: 1 tour, 41 performances (28 hall + 13 arena), 1 FC lottery')
          PY

          git diff --check
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          unexpected="$(printf '%s\n' "$status" | awk '{print $2}' | grep -v -E '^(data/artist/and_team.json|data/artists.json|data/manifest.json)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changes: $unexpected" >&2; exit 1; }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artist/and_team.json data/artists.json data/manifest.json
          git commit -m 'data: add &TEAM Mark on You tour and FC presale'
          git push origin HEAD:${GITHUB_REF_NAME}
