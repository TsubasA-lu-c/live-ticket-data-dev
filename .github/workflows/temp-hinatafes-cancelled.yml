name: One-shot HinataFes 2026 cancellation update

on:
  push:
    paths:
      - '.github/workflows/temp-hinatafes-cancelled.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark HinataFes performances cancelled and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          echo '--- git status before ---'
          git status --short

          python3 - <<'PY'
          import copy
          import hashlib
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          artist_path = Path('data/artist/hinatazaka46.json')
          manifest_path = Path('data/manifest.json')
          data = json.loads(artist_path.read_text(encoding='utf-8'))
          before = copy.deepcopy(data)

          target_ids = {
              'hinatazaka46_hinata_fes_2026_miyazaki_0905',
              'hinatazaka46_hinata_fes_2026_miyazaki_0906',
          }
          cancel_url = 'https://www.hinatazaka46.com/s/official/news/detail/E00906'
          verified_at = '2026-09-03T00:00:00+09:00'

          performances = {item['id']: item for item in data['performances']}
          assert target_ids <= performances.keys()

          for performance_id in sorted(target_ids):
              performance = performances[performance_id]
              assert performance['tourId'] == 'hinatazaka46_hinata_fes_2026'
              assert performance['venue'] == 'ひなたサンマリンスタジアム宮崎'
              assert performance['kind'] == 'fes'
              assert performance['eventName'] == 'ひなたフェス 2026'
              assert performance.get('eventStatus') in (None, 'cancelled')

              # Preserve existing key order as much as possible and place eventStatus
              # immediately before source when adding it for the first time.
              if 'eventStatus' not in performance:
                  reordered = {}
                  for key, value in performance.items():
                      if key == 'source':
                          reordered['eventStatus'] = 'cancelled'
                      reordered[key] = value
                  performance.clear()
                  performance.update(reordered)
              else:
                  performance['eventStatus'] = 'cancelled'

              performance['sourceUrl'] = cancel_url
              performance['lastVerifiedAt'] = verified_at

          # No collection outside the two targeted Performance objects may change.
          assert data['tours'] == before['tours']
          assert data['lotteries'] == before['lotteries']
          assert data.get('appleMusicTracks') == before.get('appleMusicTracks')
          before_performances = {item['id']: item for item in before['performances']}
          after_performances = {item['id']: item for item in data['performances']}
          assert before_performances.keys() == after_performances.keys()
          for performance_id in before_performances:
              if performance_id not in target_ids:
                  assert before_performances[performance_id] == after_performances[performance_id]

          for performance_id in target_ids:
              performance = after_performances[performance_id]
              assert performance['eventStatus'] == 'cancelled'
              assert performance['sourceUrl'] == cancel_url
              assert performance['lastVerifiedAt'] == verified_at

          artist_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          # Parse every distributed JSON file before publishing.
          for path in sorted(Path('data').rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          old_version = int(manifest.get('version', 0))
          assert old_version == 186
          manifest['version'] = old_version + 1
          jst = timezone(timedelta(hours=9))
          manifest['updatedAt'] = datetime.now(jst).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          manifest.setdefault('artists', {}).setdefault('hinatazaka46', {})['hash'] = hashlib.sha256(
              artist_path.read_bytes()
          ).hexdigest()[:16]
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          print(f"manifest version: {old_version} -> {manifest['version']}")
          print(f"hinatazaka46 hash: {manifest['artists']['hinatazaka46']['hash']}")
          PY

          git diff --check
          echo '--- diff ---'
          git diff -- data/artist/hinatazaka46.json data/manifest.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/temp-hinatafes-cancelled.yml
          git add -- data/artist/hinatazaka46.json data/manifest.json

          mapfile -t staged < <(git diff --cached --name-only)
          printf '%s\n' "${staged[@]}"
          if [ "${#staged[@]}" -ne 3 ]; then
            echo '[ERROR] unexpected staged file count'
            exit 1
          fi
          printf '%s\n' "${staged[@]}" | grep -Fx '.github/workflows/temp-hinatafes-cancelled.yml'
          printf '%s\n' "${staged[@]}" | grep -Fx 'data/artist/hinatazaka46.json'
          printf '%s\n' "${staged[@]}" | grep -Fx 'data/manifest.json'

          git commit -m 'update: mark HinataFes 2026 performances cancelled'
          git push origin HEAD:main

          echo '--- git status after ---'
          git status --short
