              [perf(tid+'_1011', tid, 'ぴあアリーナMM', '2026-10-11T17:00:00+09:00', '2026-10-11T16:00:00+09:00', 'fes', 'STARフェス DAY2', 'https://cutiestreet.asobisystem.com/news/detail/43664')])

          # IMP.: CDTV autumn + Buzz Rhythm.
          cdtv = 'imp_cdtv_autumn_thanks_2026'
          buzz = 'imp_buzzrhythm_live_2026'
          add('imp',
              [tour('imp', cdtv, 'CDTVライブ！ライブ！秋の大感謝祭2026', '2026-09-12T00:00:00+09:00', '2026-09-12T00:00:00+09:00', 'https://www.tbs.co.jp/cdtv_livelive/articles/20260706.html'),
               tour('imp', buzz, 'バズリズム LIVE 2026', '2026-11-07T00:00:00+09:00', '2026-11-07T00:00:00+09:00', 'https://buzzrhythm.live/')],
              [perf(cdtv+'_0912', cdtv, '東京ガーデンシアター', '2026-09-12T18:00:00+09:00', '2026-09-12T16:30:00+09:00', 'fes', 'CDTVライブ！ライブ！秋の大感謝祭2026', 'https://tickets.tbs.co.jp/cdtv_livelive26fall/'),
               perf(buzz+'_1107', buzz, '横浜アリーナ', '2026-11-07T16:00:00+09:00', '2026-11-07T15:00:00+09:00', 'fes', 'バズリズム LIVE 2026', 'https://buzzrhythm.live/')])

          # kurayamisaka: Buzz Rhythm.
          tid = 'kurayamisaka_buzzrhythm_live_2026'
          add('kurayamisaka',
              [tour('kurayamisaka', tid, 'バズリズム LIVE 2026', '2026-11-08T00:00:00+09:00', '2026-11-08T00:00:00+09:00', 'https://buzzrhythm.live/')],
              [perf(tid+'_1108', tid, '横浜アリーナ', '2026-11-08T16:00:00+09:00', '2026-11-08T15:00:00+09:00', 'fes', 'バズリズム LIVE 2026', 'https://buzzrhythm.live/')])

          # 京都音楽博覧会: Macaroni existing tour, Hitsuji/milet new tours.
          d = get('macaroni_empitsu')
          merge(d['tours'], 'macaroni_empitsu_fes_2026_kyotohakurankai', {'lastVerifiedAt': VERIFIED, 'sourceUrl': 'https://kyotoonpaku.net/'})
          add('macaroni_empitsu', perfs=[perf('macaroni_empitsu_fes_2026_kyotohakurankai_1010', 'macaroni_empitsu_fes_2026_kyotohakurankai', '京都・梅小路公園 芝生広場', '2026-10-10T11:30:00+09:00', '2026-10-10T10:00:00+09:00', 'fes', '京都音楽博覧会2026 in 梅小路公園', 'https://kyotoonpaku.net/')])
          for aid, tid, day, url in [
              ('hitsuji_bungaku','hitsuji_bungaku_kyoto_onpaku_2026','2026-10-11','https://kyotoonpaku.net/'),
              ('milet','milet_kyoto_onpaku_2026','2026-10-11','https://www.sonymusic.co.jp/artist/milet_music/info/583678'),
          ]:
              add(aid,
                  [tour(aid, tid, '京都音楽博覧会2026 in 梅小路公園', day+'T00:00:00+09:00', day+'T00:00:00+09:00', url)],
                  [perf(tid+'_1011', tid, '京都・梅小路公園 芝生広場', day+'T11:30:00+09:00', day+'T10:00:00+09:00', 'fes', '京都音楽博覧会2026 in 梅小路公園', url)])

          # INKIGAYO LIVE in TOKYO DAY1.
          for aid in ('niziu', 'tomorrow_x_together'):
              tid = aid + '_inkigayo_live_tokyo_2026'
              add(aid,
                  [tour(aid, tid, 'INKIGAYO LIVE in TOKYO', '2026-09-22T00:00:00+09:00', '2026-09-22T00:00:00+09:00', 'https://inkigayo-live.jp/')],
                  [perf(tid+'_0922', tid, 'ベルーナドーム', '2026-09-22T18:00:00+09:00', '2026-09-22T16:00:00+09:00', 'fes', 'INKIGAYO LIVE in TOKYO DAY1', 'https://inkigayo-live.jp/')])

          # Stray Kids RUN IT JAPAN Tokyo Dome additions + W-member presale.
          d = get('stray_kids')
          merge(d['tours'], 'stray_kids_run_it_japan_2026', {
              'endDate': '2026-11-08T00:00:00+09:00',
              'sourceUrl': 'https://www.sonymusic.co.jp/artist/StrayKids/info/586376',
              'lastVerifiedAt': VERIFIED,
          })
          skz_ids = [
              'stray_kids_run_it_japan_2026_tokyo_dome_1106',
              'stray_kids_run_it_japan_2026_tokyo_dome_1107',
              'stray_kids_run_it_japan_2026_tokyo_dome_1108',
          ]
          add('stray_kids', perfs=[
              perf(skz_ids[0], 'stray_kids_run_it_japan_2026', '東京ドーム', '2026-11-06T18:00:00+09:00', '2026-11-06T16:00:00+09:00', 'oneman', None, 'https://www.sonymusic.co.jp/artist/StrayKids/info/586376'),
              perf(skz_ids[1], 'stray_kids_run_it_japan_2026', '東京ドーム', '2026-11-07T17:00:00+09:00', '2026-11-07T15:00:00+09:00', 'oneman', None, 'https://www.sonymusic.co.jp/artist/StrayKids/info/586376'),
              perf(skz_ids[2], 'stray_kids_run_it_japan_2026', '東京ドーム', '2026-11-08T16:30:00+09:00', '2026-11-08T14:30:00+09:00', 'oneman', None, 'https://www.sonymusic.co.jp/artist/StrayKids/info/586376'),
          ], lotteries=[
              lottery('stray_kids_run_it_japan_2026_tokyo_dome_w_member_fastest', 'stray_kids_run_it_japan_2026', '東京ドーム公演 W会員最速先行', '2026-08-30T21:00:00+09:00', '2026-09-09T23:59:00+09:00', None, None, None, skz_ids, 'https://www.sonymusic.co.jp/artist/StrayKids/info/586376')
          ])

          # MONAKI: replace compatibility-estimated noon with official times.
          d = get('monaki')
          for pid, day in [('monaki_1st_tour_2026_fukuoka_1118','2026-11-18'), ('monaki_1st_tour_2026_sapporo_1127','2026-11-27')]:
              merge(d['performances'], pid, {
                  'performanceAt': day+'T19:00:00+09:00',
                  'doorOpenAt': day+'T18:00:00+09:00',
                  'sourceUrl': 'https://monaki.jp/news/detail/88526',
                  'lastVerifiedAt': VERIFIED,
              }, remove=('performanceDate','performanceTimeEstimated'))

          # ATEEZ BAD offline events + exact approved lottery windows.
          tid = 'ateez_bad_japanese_ver_offline_2026'
          ateez_ids = [tid+'_osaka_0905', tid+'_tokyo_1002', tid+'_tokyo_1003']
          aurl = 'https://ateez-official.jp/contents/1106095'
          add('ateez',
              [tour('ateez', tid, 'JAPAN 5TH SINGLE「BAD (Japanese Ver.)」発売記念 オフラインイベント', '2026-09-05T00:00:00+09:00', '2026-10-03T00:00:00+09:00', aurl)],
              [perf(ateez_ids[0], tid, 'ハービスホール', '2026-09-05T13:40:00+09:00', None, 'oneman', 'JAPAN 5TH SINGLE「BAD (Japanese Ver.)」発売記念 オフラインイベント', 'https://ateez-official.jp/contents/1106518'),
               perf(ateez_ids[1], tid, '有明GYM-EX', '2026-10-02T13:50:00+09:00', None, 'oneman', 'JAPAN 5TH SINGLE「BAD (Japanese Ver.)」発売記念 オフラインイベント', 'https://ateez-official.jp/contents/1106520'),
               perf(ateez_ids[2], tid, '有明GYM-EX', '2026-10-03T11:30:00+09:00', None, 'oneman', 'JAPAN 5TH SINGLE「BAD (Japanese Ver.)」発売記念 オフラインイベント', 'https://ateez-official.jp/contents/1106520')],
              [lottery(tid+'_2shot_osaka', tid, 'FC会員限定 2ショット撮影会抽選（大阪）', '2026-05-29T18:00:00+09:00', '2026-06-04T23:59:00+09:00', '2026-06-11T18:00:00+09:00', None, None, [ateez_ids[0]], 'https://ateez-official.jp/contents/1077238'),
               lottery(tid+'_2shot_tokyo_1002', tid, 'FC会員限定 2ショット撮影会抽選（東京10/2）', '2026-06-05T12:00:00+09:00', '2026-06-11T23:59:00+09:00', '2026-06-18T18:00:00+09:00', None, None, [ateez_ids[1]], 'https://ateez-official.jp/contents/1077238'),
               lottery(tid+'_2shot_tokyo_1003', tid, 'FC会員限定 2ショット撮影会抽選（東京10/3）', '2026-06-12T12:00:00+09:00', '2026-06-18T23:59:00+09:00', '2026-06-25T18:00:00+09:00', None, None, [ateez_ids[2]], 'https://ateez-official.jp/contents/1077238'),
               lottery(tid+'_serial_round1', tid, 'シリアルナンバー特典 オフラインイベント応募 第1回', '2026-07-28T10:00:00+09:00', '2026-08-03T09:00:00+09:00', '2026-08-07T20:00:00+09:00', None, None, ateez_ids, 'https://ateez-official.jp/contents/1088399'),
               lottery(tid+'_serial_round2', tid, 'シリアルナンバー特典 オフラインイベント応募 第2回', '2026-08-03T10:00:00+09:00', '2026-08-10T09:00:00+09:00', '2026-08-14T20:00:00+09:00', None, None, ateez_ids, 'https://ateez-official.jp/contents/1088399'),
               lottery(tid+'_serial_round3', tid, 'シリアルナンバー特典 オフラインイベント応募 第3回', '2026-08-10T10:00:00+09:00', '2026-08-17T09:00:00+09:00', '2026-08-21T20:00:00+09:00', None, None, ateez_ids, 'https://ateez-official.jp/contents/1088399')])

          # Da-iCE: missing Side A performances only. 10/22 uses current tour-page START 18:00.
          tid = 'da_ice_day_hall_phase_2026'
          add('da_ice', perfs=[
              perf(tid+'_aichi_1022', tid, '愛知県芸術劇場 大ホール', '2026-10-22T18:00:00+09:00', '2026-10-22T17:30:00+09:00', 'oneman', None, 'https://www.da-ice.jp/schedule/tour.php?fdate=2026-10-13&id=1003063&ldate=2026-12-15'),
              perf(tid+'_tokyo_1117', tid, '東京ガーデンシアター', '2026-11-17T19:00:00+09:00', '2026-11-17T18:00:00+09:00', 'oneman', None, 'https://www.da-ice.jp/schedule/tour.php?fdate=2026-10-13&id=1003063&ldate=2026-12-15'),
