name: Apply reviewed 2026-09-03 Dev updates

on:
  push:
    branches:
      - chatgpt/review-20260903-0957-dev-apply
    paths:
      - '.github/workflows/apply-reviewed-20260903.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply reviewed data only
        shell: bash
        run: |
          set -euo pipefail
          echo '--- status before ---'
          git status --short
          test "$(git rev-parse HEAD)" = '5140c90f3fcf64003e28aee191613d67104f41f8'

          python3 - <<'PY'
          from __future__ import annotations
          import copy
          import hashlib
          import json
          import subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          ROOT = Path('.')
          DATA = ROOT / 'data'
          VERIFIED = '2026-09-03T00:00:00+09:00'

          def read(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def upsert(items, values):
              items = list(items or [])
              index = {}
              for i, item in enumerate(items):
                  if isinstance(item, dict) and isinstance(item.get('id'), str):
                      if item['id'] in index:
                          raise SystemExit(f"duplicate existing id: {item['id']}")
                      index[item['id']] = i
              for value in values or []:
                  item_id = value['id']
                  if item_id in index:
                      items[index[item_id]] = value
                  else:
                      index[item_id] = len(items)
                      items.append(value)
              return items

          def merge(items, object_id, changes, remove=()):
              matches = [x for x in items if isinstance(x, dict) and x.get('id') == object_id]
              if len(matches) != 1:
                  raise SystemExit(f'merge target not unique: {object_id} ({len(matches)})')
              target = matches[0]
              target.update(changes)
              for key in remove:
                  target.pop(key, None)

          def tour(aid, tid, title, start, end, url, prices=None, extra=None):
              value = {
                  'id': tid, 'artistId': aid, 'title': title,
                  'startDate': start, 'endDate': end, 'prices': prices,
                  'source': 'system', 'sourceUrl': url, 'lastVerifiedAt': VERIFIED,
              }
              if extra:
                  value.update(extra)
              return value

          def perf(pid, tid, venue, at, opened, kind, event_name, url, extra=None):
              value = {
                  'id': pid, 'tourId': tid, 'venue': venue,
                  'performanceAt': at, 'doorOpenAt': opened,
                  'kind': kind, 'eventName': event_name,
                  'source': 'system', 'sourceUrl': url, 'lastVerifiedAt': VERIFIED,
              }
              if extra:
                  value.update(extra)
              return value

          def lottery(lid, tid, kind, start, end, result, pay_start, pay_end, perf_ids, url):
              return {
                  'id': lid, 'tourId': tid, 'type': kind,
                  'entryStartAt': start, 'entryEndAt': end,
                  'resultAt': result, 'paymentStartAt': pay_start, 'paymentEndAt': pay_end,
                  'performanceIds': perf_ids,
                  'source': 'system', 'sourceUrl': url, 'lastVerifiedAt': VERIFIED,
              }

          touched = set()
          docs = {}
          def get(aid):
              if aid not in docs:
                  path = DATA / 'artist' / f'{aid}.json'
                  doc = read(path)
                  if doc.get('artistId') != aid:
                      raise SystemExit(f'artistId mismatch: {aid}')
                  docs[aid] = doc
              touched.add(aid)
              return docs[aid]

          def add(aid, tours=(), perfs=(), lotteries=()):
              doc = get(aid)
              doc['tours'] = upsert(doc.get('tours'), tours)
              doc['performances'] = upsert(doc.get('performances'), perfs)
              doc['lotteries'] = upsert(doc.get('lotteries'), lotteries)
              return doc

          # JO1: Seoul cancellation + VMAJ.
          d = get('jo1')
          for pid in ('jo1_eien_2026_seoul_0926', 'jo1_eien_2026_seoul_0927'):
              merge(d['performances'], pid, {
                  'eventStatus': 'cancelled',
                  'sourceUrl': 'https://jo1.jp/news/detail/6306?lang=en',
                  'lastVerifiedAt': VERIFIED,
              })
          tid = 'jo1_mtv_vmaj_2026'
          add('jo1',
              [tour('jo1', tid, 'MTV VMAJ 2026', '2026-10-29T00:00:00+09:00', '2026-10-29T00:00:00+09:00', 'https://www.mtvjapan.com/event/vmaj/2026/')],
              [perf(tid+'_1029', tid, '東京ドーム', '2026-10-29T18:00:00+09:00', '2026-10-29T16:00:00+09:00', 'fes', 'MTV VMAJ 2026', 'https://www.mtvjapan.com/event/vmaj/2026/')])

          # INI: existing VMAJ tour gets performance + Dream Festival.
          d = get('ini')
          merge(d['tours'], 'ini_mtv_vmaj_2026', {
              'title': 'MTV VMAJ 2026',
              'startDate': '2026-10-29T00:00:00+09:00',
              'endDate': '2026-10-29T00:00:00+09:00',
              'sourceUrl': 'https://ini-official.com/news/detail/4363?lang=en',
              'lastVerifiedAt': VERIFIED,
          })
          add('ini', perfs=[perf('ini_mtv_vmaj_2026_1029', 'ini_mtv_vmaj_2026', '東京ドーム', '2026-10-29T18:00:00+09:00', '2026-10-29T16:00:00+09:00', 'fes', 'MTV VMAJ 2026', 'https://ini-official.com/news/detail/4363?lang=en')])
          tid = 'ini_dream_festival_2026'
          add('ini',
              [tour('ini', tid, '15th Anniversary テレビ朝日ドリームフェスティバル2026', '2026-11-22T00:00:00+09:00', '2026-11-22T00:00:00+09:00', 'https://ini-official.com/news/detail/4382')],
              [perf(tid+'_1122', tid, 'Kアリーナ横浜', '2026-11-22T15:00:00+09:00', '2026-11-22T13:30:00+09:00', 'fes', '15th Anniversary テレビ朝日ドリームフェスティバル2026', 'https://ini-official.com/news/detail/4382')])

          # MAZZEL: VMAJ + Dream Festival.
          v = 'mazzel_mtv_vmaj_2026'
          dream = 'mazzel_dream_festival_2026'
          add('mazzel',
              [tour('mazzel', v, 'MTV VMAJ 2026', '2026-10-29T00:00:00+09:00', '2026-10-29T00:00:00+09:00', 'https://mazzel.tokyo/news/5475/'),
               tour('mazzel', dream, '15th Anniversary テレビ朝日ドリームフェスティバル2026', '2026-11-23T00:00:00+09:00', '2026-11-23T00:00:00+09:00', 'https://post.tv-asahi.co.jp/?p=832267')],
              [perf(v+'_1029', v, '東京ドーム', '2026-10-29T18:00:00+09:00', '2026-10-29T16:00:00+09:00', 'fes', 'MTV VMAJ 2026', 'https://mazzel.tokyo/news/5475/'),
               perf(dream+'_1123', dream, 'Kアリーナ横浜', '2026-11-23T15:00:00+09:00', '2026-11-23T13:30:00+09:00', 'fes', '15th Anniversary テレビ朝日ドリームフェスティバル2026', 'https://post.tv-asahi.co.jp/?p=832267')])

          # Aぇ! group / Novelbright: Dream Festival 11/21.
          for aid, prefix in [('ae_group','ae_group'), ('novelbright','novelbright')]:
              tid = prefix + '_dream_festival_2026'
              add(aid,
                  [tour(aid, tid, '15th Anniversary テレビ朝日ドリームフェスティバル2026', '2026-11-21T00:00:00+09:00', '2026-11-21T00:00:00+09:00', 'https://post.tv-asahi.co.jp/?p=832267')],
                  [perf(tid+'_1121', tid, 'Kアリーナ横浜', '2026-11-21T15:00:00+09:00', '2026-11-21T13:30:00+09:00', 'fes', '15th Anniversary テレビ朝日ドリームフェスティバル2026', 'https://post.tv-asahi.co.jp/?p=832267')])

          # CUTIE STREET: STARフェス DAY2.
          tid = 'cutie_street_star_fes_2026'
          add('cutie_street',
