          # Materialize approved same-person alias to 大石昌良 delivery data.
          src = get('oishi_masayoshi')
          dst = get('masayoshi_oishi')
          src_tour = next(x for x in src['tours'] if x['id'] == tid)
          mirror_tid = 'masayoshi_oishi__rel__' + tid
          mt = copy.deepcopy(src_tour)
          mt['id'] = mirror_tid
          mt['artistId'] = 'masayoshi_oishi'
          mt['relationDisplay'] = dict(mt['relationDisplay'])
          mt['relationDisplay']['mirrored'] = True
          dst['tours'] = upsert(dst.get('tours'), [mt])
          perf_map = {}
          mirrored_perfs = []
          for p in src['performances']:
              if p.get('tourId') != tid:
                  continue
              mp = copy.deepcopy(p)
              mp['id'] = 'masayoshi_oishi__rel__' + p['id']
              mp['tourId'] = mirror_tid
              perf_map[p['id']] = mp['id']
              mirrored_perfs.append(mp)
          dst['performances'] = upsert(dst.get('performances'), mirrored_perfs)
          mirrored_lotteries = []
          for l in src['lotteries']:
              if l.get('tourId') != tid:
                  continue
              ml = copy.deepcopy(l)
              ml['id'] = 'masayoshi_oishi__rel__' + l['id']
              ml['tourId'] = mirror_tid
              if isinstance(ml.get('performanceIds'), list):
                  ml['performanceIds'] = [perf_map[x] for x in ml['performanceIds']]
              mirrored_lotteries.append(ml)
          dst['lotteries'] = upsert(dst.get('lotteries'), mirrored_lotteries)

          # BTS Singapore four dates, local +08:00.
          tid = 'bts_world_tour_arirang_singapore_2026'
          burl = 'https://weverse.io/bts/notice/36080?hl=ja'
          bdates = ['2026-12-17','2026-12-19','2026-12-20','2026-12-22']
          add('bts',
              [tour('bts', tid, "BTS WORLD TOUR 'ARIRANG' IN SINGAPORE", bdates[0]+'T00:00:00+08:00', bdates[-1]+'T00:00:00+08:00', burl)],
              [perf(tid+'_'+day[-4:].replace('-',''), tid, 'National Stadium, Singapore', day+'T19:00:00+08:00', None, 'oneman', None, burl) for day in bdates])

          # 櫻坂46: RIJF + Taipei.
          rijf = 'sakurazaka46_rock_in_japan_2026'
          taipei = 'sakurazaka46_music_expo_taipei_2026'
          add('sakurazaka46',
              [tour('sakurazaka46', rijf, 'ROCK IN JAPAN FESTIVAL 2026', '2026-09-21T00:00:00+09:00', '2026-09-21T00:00:00+09:00', 'https://sakurazaka46.com/s/s46/news/detail/E00650'),
               tour('sakurazaka46', taipei, 'MUSIC EXPO LIVE 2026 in TAIPEI', '2026-10-25T00:00:00+08:00', '2026-10-25T00:00:00+08:00', 'https://sakurazaka46.com/s/s46/news/detail/E00661')],
              [perf(rijf+'_0921', rijf, '千葉市蘇我スポーツ公園', '2026-09-21T11:45:00+09:00', '2026-09-21T08:30:00+09:00', 'fes', 'ROCK IN JAPAN FESTIVAL 2026', 'https://sakurazaka46.com/s/s46/news/detail/E00650'),
               perf(taipei+'_1025', taipei, 'TAIPEI ARENA', '2026-10-25T18:00:00+08:00', None, 'fes', 'MUSIC EXPO LIVE 2026 in TAIPEI DAY2', 'https://sakurazaka46.com/s/s46/news/detail/E00661')])

          expected_artists = {
              'jo1','ini','mazzel','ae_group','novelbright','cutie_street','imp','kurayamisaka',
              'macaroni_empitsu','hitsuji_bungaku','milet','niziu','tomorrow_x_together','stray_kids',
              'monaki','ateez','da_ice','oishi_masayoshi','masayoshi_oishi','bts','sakurazaka46',
          }
          if touched != expected_artists:
              raise SystemExit(f'touched artists mismatch: {sorted(touched)}')

          # Write only explicitly touched artist files.
          for aid in sorted(touched):
              write(DATA / 'artist' / f'{aid}.json', docs[aid])

          # Refresh registry verification timestamps for touched delivery files.
          registry_path = DATA / 'artists.json'
          registry = read(registry_path)
          found = set()
          for row in registry:
              if row.get('id') in touched:
                  row['lastVerifiedAt'] = VERIFIED
                  found.add(row['id'])
          if found != touched:
              raise SystemExit(f'artists.json missing touched ids: {sorted(touched-found)}')
          write(registry_path, registry)

          # Structural validation before manifest update.
          for path in sorted((DATA / 'artist').glob('*.json')):
              doc = read(path)
              aid = path.stem
              if doc.get('artistId') != aid:
                  raise SystemExit(f'{path}: artistId mismatch')
              collections = {name: doc.get(name, []) for name in ('tours','performances','lotteries')}
              for name, items in collections.items():
                  if not isinstance(items, list):
                      raise SystemExit(f'{path}: {name} not list')
                  ids = [x.get('id') for x in items if isinstance(x, dict)]
                  if len(ids) != len(set(ids)):
                      raise SystemExit(f'{path}: duplicate id in {name}')
              tour_ids = {x['id'] for x in collections['tours']}
              perf_ids = {x['id'] for x in collections['performances']}
              for p in collections['performances']:
                  if p.get('tourId') not in tour_ids:
                      raise SystemExit(f"{path}: missing tour for performance {p.get('id')}")
              for l in collections['lotteries']:
                  if l.get('tourId') not in tour_ids:
                      raise SystemExit(f"{path}: missing tour for lottery {l.get('id')}")
                  if isinstance(l.get('performanceIds'), list):
                      missing = set(l['performanceIds']) - perf_ids
                      if missing:
                          raise SystemExit(f"{path}: lottery {l.get('id')} missing performances {sorted(missing)}")

          # Update manifest exactly like canonical update_manifest.py.
          manifest_path = DATA / 'manifest.json'
          manifest = read(manifest_path)
          def h16(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()[:16]
          manifest['version'] = int(manifest.get('version', 0)) + 1
          jst = timezone(timedelta(hours=9))
          manifest['updatedAt'] = datetime.now(jst).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = h16(registry_path)
          manifest.setdefault('artists', {})
          hashes = {p.stem: h16(p) for p in sorted((DATA / 'artist').glob('*.json'))}
          for aid, hv in hashes.items():
              manifest['artists'].setdefault(aid, {})['hash'] = hv
          for aid in list(manifest['artists']):
              if aid not in hashes:
                  del manifest['artists'][aid]
          write(manifest_path, manifest)

          # Verify manifest hashes after writing.
          if read(manifest_path)['files']['artists']['hash'] != h16(registry_path):
              raise SystemExit('artists manifest hash mismatch')
          for aid, hv in hashes.items():
              if read(manifest_path)['artists'][aid]['hash'] != hv:
                  raise SystemExit(f'manifest hash mismatch: {aid}')
          PY

          git diff --check
          echo '--- changed data files ---'
          git diff --name-only -- data
          count=$(git diff --name-only -- data | wc -l | tr -d ' ')
          test "$count" = '23'
          if git diff --name-only | grep -Ev '^data/' >/dev/null; then
            echo '[ERROR] non-data diff detected'
            git diff --name-only
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data
          git commit -m 'update: apply reviewed 2026-09-03 live ticket updates'
          git push origin HEAD:main

          echo '--- status after ---'
          git status --short
