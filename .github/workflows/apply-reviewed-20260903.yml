              [lottery(tid+'_club014_fastest', tid, 'CLUB014会員最速先行', '2025-12-20T18:00:00+09:00', '2026-02-09T23:59:00+09:00', '2026-02-13T19:00:00+09:00', '2026-02-13T19:00:00+09:00', '2026-02-16T23:59:00+09:00', opids, ourl),
               lottery(tid+'_club014_second', tid, 'CLUB014 2次先行', '2026-02-27T19:00:00+09:00', '2026-04-06T23:59:00+09:00', '2026-04-10T19:00:00+09:00', '2026-04-10T19:00:00+09:00', '2026-04-13T23:59:00+09:00', opids, ourl),
