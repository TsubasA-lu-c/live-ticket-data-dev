          official = 'オーイシ横アリ ～オーイシマサヨシ ワンマンライブ at 横浜アリーナ～'
          ourl = 'https://www.014014.jp/schedules/7330'
          rel = {'sourceArtistId': aid, 'sourceTourId': tid, 'officialTitle': official, 'mirrored': False}
          opids = [tid+'_day1_0227', tid+'_day2_0228']
          add(aid,
              [tour(aid, tid, '【オーイシマサヨシ】'+official, '2027-02-27T00:00:00+09:00', '2027-02-28T00:00:00+09:00', ourl, [{'label':'通常チケット','amount':10900},{'label':'車椅子 指定席チケット','amount':10900}], {'relationDisplay': rel})],
